# Default settings configuration for electron-core-ui
# Consumer applications can override or extend these via their own YAML config.

groups:
  - id: "appearance"
    titleKey: "settings.appearance.title"
    items:
      - setting:
          id: "theme"
          titleKey: "settings.appearance.theme.title"
          descriptionKey: "settings.appearance.theme.description"
          type: "theme"
          default: "dark/dark-plus"
      - setting:
          id: "language"
          titleKey: "settings.appearance.language.title"
          descriptionKey: "settings.appearance.language.description"
          type: "enum"
          default: "en"
          # Locale is a per-machine / per-user preference, not a
          # project decision — keep it out of the workspace overlay so
          # a checked-in `.restorm/settings.json` never forces another
          # contributor's UI into a language they didn't choose.
          userOnly: true
          params:
            # Canonical flag source: electron-core-ui/src/renderer/components/Settings/languages.ts (AVAILABLE_LANGUAGES) — keep both in sync.
            values:
              - value: "en"
                labelKey: "settings.appearance.language.en"
                flag: "🇬🇧"
              - value: "fr"
                labelKey: "settings.appearance.language.fr"
                flag: "🇫🇷"
              - value: "es"
                labelKey: "settings.appearance.language.es"
                flag: "🇪🇸"
              - value: "de"
                labelKey: "settings.appearance.language.de"
                flag: "🇩🇪"
              - value: "it"
                labelKey: "settings.appearance.language.it"
                flag: "🇮🇹"
              - value: "pt"
                labelKey: "settings.appearance.language.pt"
                flag: "🇵🇹"
              - value: "nl"
                labelKey: "settings.appearance.language.nl"
                flag: "🇳🇱"
              - value: "sv"
                labelKey: "settings.appearance.language.sv"
                flag: "🇸🇪"
              - value: "fi"
                labelKey: "settings.appearance.language.fi"
                flag: "🇫🇮"
              - value: "pl"
                labelKey: "settings.appearance.language.pl"
                flag: "🇵🇱"
              - value: "el"
                labelKey: "settings.appearance.language.el"
                flag: "🇬🇷"
              - value: "uk"
                labelKey: "settings.appearance.language.uk"
                flag: "🇺🇦"
              - value: "hr"
                labelKey: "settings.appearance.language.hr"
                flag: "🇭🇷"
              - value: "sr"
                labelKey: "settings.appearance.language.sr"
                flag: "🇷🇸"
              - value: "sq"
                labelKey: "settings.appearance.language.sq"
                flag: "🇦🇱"
              - value: "da"
                labelKey: "settings.appearance.language.da"
                flag: "🇩🇰"
              - value: "nb"
                labelKey: "settings.appearance.language.nb"
                flag: "🇳🇴"
              - value: "cs"
                labelKey: "settings.appearance.language.cs"
                flag: "🇨🇿"
              - value: "hu"
                labelKey: "settings.appearance.language.hu"
                flag: "🇭🇺"
              - value: "ro"
                labelKey: "settings.appearance.language.ro"
                flag: "🇷🇴"
              - value: "tr"
                labelKey: "settings.appearance.language.tr"
                flag: "🇹🇷"
              - value: "id"
                labelKey: "settings.appearance.language.id"
                flag: "🇮🇩"
              - value: "vi"
                labelKey: "settings.appearance.language.vi"
                flag: "🇻🇳"
              - value: "ja"
                labelKey: "settings.appearance.language.ja"
                flag: "🇯🇵"
              - value: "ko"
                labelKey: "settings.appearance.language.ko"
                flag: "🇰🇷"
              - value: "zh-CN"
                labelKey: "settings.appearance.language.zh-CN"
                flag: "🇨🇳"
              - value: "zh-TW"
                labelKey: "settings.appearance.language.zh-TW"
                flag: "🇹🇼"
      - setting:
          id: "advancedVisualEffects"
          titleKey: "settings.appearance.advancedVisualEffects.title"
          descriptionKey: "settings.appearance.advancedVisualEffects.description"
          type: "toggle"
          default: true
          feature: "advancedGraphics"
          featureDisabledDefault: false
      - group:
          id: "editor"
          titleKey: "settings.appearance.editor.title"
          items:
            - setting:
                id: "fontSize"
                titleKey: "settings.appearance.editor.fontSize.title"
                descriptionKey: "settings.appearance.editor.fontSize.description"
                type: "number"
                default: 14
                params:
                  min: 8
                  max: 72
                  integer: true
            - setting:
                id: "fontFamily"
                titleKey: "settings.appearance.editor.fontFamily.title"
                descriptionKey: "settings.appearance.editor.fontFamily.description"
                type: "text"
                default: "Consolas, 'Courier New', monospace"
            - setting:
                id: "wordWrap"
                titleKey: "settings.appearance.editor.wordWrap.title"
                descriptionKey: "settings.appearance.editor.wordWrap.description"
                type: "toggle"
                default: false
            - setting:
                id: "minimap"
                titleKey: "settings.appearance.editor.minimap.title"
                descriptionKey: "settings.appearance.editor.minimap.description"
                type: "toggle"
                default: false
            - setting:
                id: "lineNumbers"
                titleKey: "settings.appearance.editor.lineNumbers.title"
                descriptionKey: "settings.appearance.editor.lineNumbers.description"
                type: "toggle"
                default: true
  - id: "files"
    titleKey: "settings.files.title"
    items:
      - setting:
          id: "autoSave"
          titleKey: "settings.files.autoSave.title"
          descriptionKey: "settings.files.autoSave.description"
          type: "enum"
          default: "off"
          params:
            values:
              - value: "off"
                labelKey: "settings.files.autoSave.off"
              - value: "afterDelay"
                labelKey: "settings.files.autoSave.afterDelay"
              - value: "onWindowChange"
                labelKey: "settings.files.autoSave.onWindowChange"
      - setting:
          id: "autoSaveDelay"
          titleKey: "settings.files.autoSaveDelay.title"
          descriptionKey: "settings.files.autoSaveDelay.description"
          type: "number"
          default: 1000
          params:
            min: 100
            max: 60000
            integer: true
      - setting:
          id: "reopenLastFile"
          titleKey: "settings.files.reopenLastFile.title"
          descriptionKey: "settings.files.reopenLastFile.description"
          type: "toggle"
          default: false
          # The "last opened file" is a per-machine convenience, not something
          # a shared workspace should pin — keep it out of the workspace overlay.
          userOnly: true
