# Default settings configuration for electron-core-ui
# Consumer applications can override or extend these via their own YAML config.

groups:
  - id: "appearance"
    titleKey: "settings.appearance.title"
    items:
      - setting:
          id: "theme"
          titleKey: "settings.appearance.theme.title"
          descriptionKey: "settings.appearance.theme.description"
          type: "theme"
          default: "dark/dark-plus"
      - setting:
          id: "language"
          titleKey: "settings.appearance.language.title"
          descriptionKey: "settings.appearance.language.description"
          type: "enum"
          default: "en"
          # Locale is a per-machine / per-user preference, not a
          # project decision — keep it out of the workspace overlay so
          # a checked-in `.restorm/settings.json` never forces another
          # contributor's UI into a language they didn't choose.
          userOnly: true
          params:
            values:
              - value: "en"
                labelKey: "settings.appearance.language.en"
              - value: "fr"
                labelKey: "settings.appearance.language.fr"
      - setting:
          id: "advancedVisualEffects"
          titleKey: "settings.appearance.advancedVisualEffects.title"
          descriptionKey: "settings.appearance.advancedVisualEffects.description"
          type: "toggle"
          default: true
          feature: "advancedGraphics"
          featureDisabledDefault: false
      - group:
          id: "editor"
          titleKey: "settings.appearance.editor.title"
          items:
            - setting:
                id: "fontSize"
                titleKey: "settings.appearance.editor.fontSize.title"
                descriptionKey: "settings.appearance.editor.fontSize.description"
                type: "number"
                default: 14
                params:
                  min: 8
                  max: 72
                  integer: true
            - setting:
                id: "fontFamily"
                titleKey: "settings.appearance.editor.fontFamily.title"
                descriptionKey: "settings.appearance.editor.fontFamily.description"
                type: "text"
                default: "Consolas, 'Courier New', monospace"
            - setting:
                id: "wordWrap"
                titleKey: "settings.appearance.editor.wordWrap.title"
                descriptionKey: "settings.appearance.editor.wordWrap.description"
                type: "toggle"
                default: false
            - setting:
                id: "minimap"
                titleKey: "settings.appearance.editor.minimap.title"
                descriptionKey: "settings.appearance.editor.minimap.description"
                type: "toggle"
                default: false
            - setting:
                id: "lineNumbers"
                titleKey: "settings.appearance.editor.lineNumbers.title"
                descriptionKey: "settings.appearance.editor.lineNumbers.description"
                type: "toggle"
                default: true
  - id: "files"
    titleKey: "settings.files.title"
    items:
      - setting:
          id: "autoSave"
          titleKey: "settings.files.autoSave.title"
          descriptionKey: "settings.files.autoSave.description"
          type: "enum"
          default: "off"
          params:
            values:
              - value: "off"
                labelKey: "settings.files.autoSave.off"
              - value: "afterDelay"
                labelKey: "settings.files.autoSave.afterDelay"
              - value: "onWindowChange"
                labelKey: "settings.files.autoSave.onWindowChange"
      - setting:
          id: "autoSaveDelay"
          titleKey: "settings.files.autoSaveDelay.title"
          descriptionKey: "settings.files.autoSaveDelay.description"
          type: "number"
          default: 1000
          params:
            min: 100
            max: 60000
            integer: true
