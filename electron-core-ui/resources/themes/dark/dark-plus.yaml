# Dark+ Theme
name: Dark+
description: Extended dark theme based on Visual Studio Dark

colors:
  # Chat-bubble tints: neutral surface lift + the classic VS blue accent.
  chat-bubble.incoming.background: "rgb(255, 255, 255, 0.07)"
  chat-bubble.outgoing.background: "rgb(14, 99, 156, 0.40)"
  # Syntax palette: classic VS Code Dark+ token identity.
  hljs.foreground: "#d4d4d4"
  hljs.keyword: "#569cd6"
  hljs.type: "#4ec9b0"
  hljs.number: "#b5cea8"
  hljs.string: "#ce9178"
  hljs.regexp: "#d16969"
  hljs.comment: "#6a9955"
  hljs.meta: "#9b9b9b"
  hljs.variable: "#9cdcfe"
  hljs.attr: "#9cdcfe"
  hljs.section: "#dcdcaa"
  hljs.selector: "#d7ba7d"
  hljs.addition.background: "#16301c"
  hljs.deletion.background: "#431b1b"
  window.border: "#666666"
  button.hoverBackground: "#3C3C3C"
  button.secondaryHoverBackground: "#45494E"
  tab.activeForeground: "#ffffff"

  # Tag colors for Dark+ (accent blue)
  tag.background: "#094771"
  tag.background-hover: "#0e639c"
  tag.foreground: "#ffffff"
