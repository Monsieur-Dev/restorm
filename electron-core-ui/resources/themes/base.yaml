# Base CSS Variables
# These are custom CSS variables defined within the project components.
# They are not theme-specific but can be overridden by themes.

variables:
  # Chat-bubble tints (incoming = received/left, outgoing = sent/right).
  # Universal fallbacks; each theme family overrides these in its _base.yaml
  # so the conversation surfaces (e.g. the MCP logs viewer) stay coherent.
  - id: chat-bubble-incoming-background
    value: "rgb(128, 128, 128, 0.12)"
    description: "Background tint of an incoming (received, left-aligned) chat bubble"

  - id: chat-bubble-outgoing-background
    value: "rgb(64, 110, 180, 0.35)"
    description: "Background tint of an outgoing (sent, right-aligned) chat bubble"

  # highlight.js syntax token colours (MarkdownViewer). Universal defaults are
  # the VS-2015 dark palette; each theme family overrides them in its _base.yaml
  # so syntax highlighting tracks light / dark / high-contrast.
  - id: hljs-foreground
    value: "#dcdcdc"
    description: "Syntax highlight: default code foreground"
  - id: hljs-keyword
    value: "#569cd6"
    description: "Syntax highlight: keywords / literals / names"
  - id: hljs-type
    value: "#4ec9b0"
    description: "Syntax highlight: built-ins / types"
  - id: hljs-number
    value: "#b8d7a3"
    description: "Syntax highlight: numbers / classes"
  - id: hljs-string
    value: "#d69d85"
    description: "Syntax highlight: strings"
  - id: hljs-regexp
    value: "#9a5334"
    description: "Syntax highlight: regexps / template tags"
  - id: hljs-comment
    value: "#57a64a"
    description: "Syntax highlight: comments / quotes / doctags"
  - id: hljs-meta
    value: "#9b9b9b"
    description: "Syntax highlight: meta / tags"
  - id: hljs-variable
    value: "#bd63c5"
    description: "Syntax highlight: variables"
  - id: hljs-attr
    value: "#9cdcfe"
    description: "Syntax highlight: attributes (JSON keys)"
  - id: hljs-section
    value: "#d7ba7d"
    description: "Syntax highlight: sections / headings"
  - id: hljs-selector
    value: "#d7ba7d"
    description: "Syntax highlight: CSS selectors / bullets"
  - id: hljs-addition-background
    value: "#144212"
    description: "Syntax highlight: diff addition background"
  - id: hljs-deletion-background
    value: "#660000"
    description: "Syntax highlight: diff deletion background"

  - id: dropdown-padding-top
    value: "1px"
    description: "Padding top for dropdown items (mac: 3px)"

  - id: dropdown-padding-bottom
    value: "1px"
    description: "Padding bottom for dropdown items (mac: 4px)"

  - id: sash-size
    value: "4px"
    description: Size of sash divider

  - id: sash-hover-size
    value: "8px"
    description: Hover size of sash divider

  - id: editor-group-tab-height
    value: "35px"
    description: Height of editor tabs

  - id: monaco-monospace-font
    value: "Consolas, 'Courier New', monospace"
    description: Monospace font family (platform-dependent)

  - id: text-link-decoration
    value: "underline"
    description: Text link decoration style

  - id: beak-left-percent
    value: "50%"
    description: Tooltip beak position

  # Tooltip / hover widget defaults (can be overridden per theme)
  - id: editorHoverWidget-background
    value: "#252526"
    description: Fallback hover widget background

  - id: editorHoverWidget-foreground
    value: "#CCCCCC"
    description: Fallback hover widget foreground

  - id: editorHoverWidget-border
    value: "#454545"
    description: Fallback hover widget border

  - id: textCodeBlock-background
    value: "rgba(255, 255, 255, 0.1)"
    description: Fallback text code block background

  - id: tabs-border-bottom-color
    value: "transparent"
    description: Border color for tabs

  - id: ag-font-size
    value: "12px"
    description: AG Grid font size

  - id: editor-font-size
    value: "13px"
    description: Default editor font size

  - id: editor-font-family
    value: "Consolas, 'Courier New', monospace"
    description: Default editor font family

  # Radio component defaults (for high contrast themes)
  - id: radio-activeBorder
    value: "transparent"
    description: Radio button active border color

  - id: radio-inactiveBorder
    value: "transparent"
    description: Radio button inactive border color

  # Window controls overlay
  - id: wco-iconForeground
    value: "#cccccc"
    description: Window controls overlay icon color

  # Tag component colors (generic defaults, can be overridden per theme type)
  - id: tag-background
    value: "#444444"
    description: Default tag background color

  - id: tag-background-hover
    value: "#555555"
    description: Default tag hover background color

  - id: tag-foreground
    value: "#ffffff"
    description: Default tag foreground color

  # Input validation error feedback
  - id: inputValidation-errorBorder
    value: "#be1100"
    description: Input validation error border color

  - id: inputValidation-errorBackground
    value: "#5a1d1d"
    description: Input validation error background color

  - id: inputValidation-errorForeground
    value: "#f48771"
    description: Input validation error foreground color

  - id: testing-iconPassed
    value: "#73c991"
    description: Color for passed test icon

  - id: testing-iconFailed
    value: "#f14c4c"
    description: Color for failed test icon

