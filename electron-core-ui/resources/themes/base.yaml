    value: "#ffffff"
    description: "Foreground (text) on any coloured badge pill"

  - id: badge-get-background
    value: "#2e7d32"
    description: "HTTP GET badge background (Material green)"

  - id: badge-post-background
    value: "#1565c0"
    description: "HTTP POST badge background (Material blue)"

  - id: badge-put-background
