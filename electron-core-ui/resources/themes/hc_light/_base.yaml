    description: List active selection background

  - id: list.activeSelectionForeground
    value: "#ffffff"
    description: List active selection foreground

  - id: list.hoverBackground
    value: "#e8e8e8"
    description: List hover background

  - id: list.dropBackground
    value: "#cce5ff"
    description: List drop target background during a drag



  - id: list.hoverForeground
    value: "#333333"
    description: List hover foreground

  - id: list.focusBackground
    value: "#d6ebff"
    description: List focus background

  - id: list.focusForeground
    value: "#333333"
    description: List focus foreground

  - id: list.foreground
    value: "#333333"
