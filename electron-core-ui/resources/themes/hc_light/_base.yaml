# High Contrast Light Theme Base
# Default values for high contrast light themes

colors:
  # Editor colors
  - id: editor.background
    value: "#ffffff"
    description: Editor background color

  - id: editor.foreground
    value: "#000000"
    description: Editor foreground color

  # Chat-bubble tints for high-contrast light themes (opaque so the bubble
  # edges read clearly). → --chat-bubble-incoming/outgoing-background
  - id: chat-bubble.incoming.background
    value: "#eaeaea"
    description: Incoming chat-bubble background (HC light)

  - id: chat-bubble.outgoing.background
    value: "#cfe3f7"
    description: Outgoing chat-bubble background (HC light)

  # highlight.js syntax token colours for HIGH-CONTRAST LIGHT (darker, fully
  # saturated so tokens stay legible on white without the dark base defaults).
  - id: hljs.foreground
    value: "#000000"
    description: "Syntax highlight: default code foreground (HC light)"
  - id: hljs.keyword
    value: "#0000c0"
    description: "Syntax highlight: keywords / literals / names (HC light)"
  - id: hljs.type
    value: "#0f5d63"
    description: "Syntax highlight: built-ins / types (HC light)"
  - id: hljs.number
    value: "#0a5e2a"
    description: "Syntax highlight: numbers / classes (HC light)"
  - id: hljs.string
    value: "#9b0000"
    description: "Syntax highlight: strings (HC light)"
  - id: hljs.regexp
    value: "#7a0030"
    description: "Syntax highlight: regexps / template tags (HC light)"
  - id: hljs.comment
    value: "#006400"
    description: "Syntax highlight: comments / quotes / doctags (HC light)"
  - id: hljs.meta
    value: "#5a5a5a"
    description: "Syntax highlight: meta / tags (HC light)"
  - id: hljs.variable
    value: "#7a1f99"
    description: "Syntax highlight: variables (HC light)"
  - id: hljs.attr
    value: "#003a8c"
    description: "Syntax highlight: attributes / JSON keys (HC light)"
  - id: hljs.section
    value: "#6a0000"
    description: "Syntax highlight: sections / headings (HC light)"
  - id: hljs.selector
    value: "#6a0000"
    description: "Syntax highlight: CSS selectors / bullets (HC light)"
  - id: hljs.addition.background
    value: "#c8f0d0"
    description: "Syntax highlight: diff addition background (HC light)"
  - id: hljs.deletion.background
    value: "#ffc9c6"
    description: "Syntax highlight: diff deletion background (HC light)"

  # Hyperlink / inline-link text colour (URL-style links, e.g. ECUI Button link)
  - id: textLink.foreground
    value: "#0F4A85"
    description: Foreground color for links

  - id: textLink.activeForeground
    value: "#002966"
    description: Foreground color for active / hovered links

  # Default widget background (for editors, panels, previews)
  - id: editorWidget.background
    value: "#FFFFFF"
    description: Editor widget background color

  - id: editorWidget.border
    value: "#0F4A85"
    description: Editor widget border color

  # Hover widget / tooltip colors
  - id: editorHoverWidget.background
    value: "#FFFFFF"
    description: Hover widget background color

  - id: editorHoverWidget.foreground
    value: "#000000"
    description: Hover widget foreground color

  - id: editorHoverWidget.border
    value: "#6fc3df"
    description: Hover widget border color (high contrast)

  # Generic foreground (used by many controls / labels)
  - id: foreground
    value: "#000000"
    description: Primary foreground color

  # Input colors (HC specific - bright borders)
  - id: input.background
    value: "#ffffff"
    description: Input background color

  - id: input.foreground
    value: "#000000"
    description: Input foreground color

  - id: input.border
    value: "#6fc3df"
    description: Input border color (high contrast)

  # Toggle / input option active styles (used by checkbox/toggle)
  - id: inputOption.activeBackground
    value: "#00000022"
    description: Active option background

  - id: inputOption.activeBorder
    value: "#000000"
    description: Active option border

  - id: inputOption.activeForeground
    value: "#000000"
    description: Active option foreground

  # Generic description text (used by labels, tooltips, etc.)
  - id: descriptionForeground
    value: "#3B3B3B"
    description: Description / secondary foreground

  # Inline code / text code block background (used by tooltips and markdown)
  - id: textCodeBlock.background
    value: "rgba(255, 255, 255, 0.1)"
    description: Text code block background

  # Dropdown colors
  - id: dropdown.background
    value: "#ffffff"
    description: Dropdown background color

  - id: dropdown.foreground
    value: "#333333"
    description: Dropdown foreground color

  - id: dropdown.border
    value: "#6fc3df"
    description: Dropdown border color (high contrast)

  - id: dropdown.listBackground
    value: "#ffffff"
    description: Dropdown list background color

  # QuickInput colors
  - id: quickInput.background
    value: "#f3f3f3"
    description: Quick input background color

  - id: quickInput.foreground
    value: "#333333"
    description: Quick input foreground color

  # List colors
  - id: list.activeSelectionBackground
