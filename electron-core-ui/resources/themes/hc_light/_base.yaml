    description: Scrollbar slider active background

  # Tab colors
  - id: tab.activeForeground
    value: "#333333"
    description: Active tab foreground

  - id: tab.activeBorder
    value: "#0078d4"
    description: Active tab border

  - id: tab.inactiveForeground
    value: "rgba(51, 51, 51, 0.7)"
    description: Inactive tab foreground

  - id: tab.border
    value: "rgba(97, 97, 97, 0.2)"
    description: Tab border

  - id: tab.dragAndDropBorder
    value: "#000000"
    description: Border color used when dragging tabs

  # Dock primitive — panel surface (the dockable side that fades on
  # collapse + floats over the main column during hover-preview) and
  # the foreground pair painted on it. The surface is a fixed
  # per-family colour, so the text on it must be fixed the same way:
  # a foreground inherited from another token family (editor, button,
  # …) can coincide with the dock surface and render the panel content
  # invisible. All three mirror their `editor.*` / `descriptionForeground`
  # counterparts; a theme that overrides one should override all three.
  - id: dock.background
    value: "#ffffff"
    description: Dock panel background

  - id: dock.foreground
    value: "#000000"
    description: Dock panel foreground (paired with dock.background)

  - id: dock.descriptionForeground
    value: "#3B3B3B"
    description: Dock panel secondary foreground (paired with dock.background)

  # Status bar
  - id: statusBarItem.remoteBackground
    value: "#FFFFFF"
    description: Status bar remote item background

  - id: statusBarItem.remoteForeground
    value: "#000000"
    description: Status bar remote item foreground

  # Action bar
  - id: actionBar.toggledBackground
    value: "#dddddd"
    description: Action bar toggled background

  # WCO (Window Controls Overlay)
  - id: wco.iconForeground
    value: "#000000"
    description: WCO codicon foreground color

  # Panels
  - id: panel.border
    value: "#000000"
    description: Panel border

