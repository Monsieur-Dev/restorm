# Light Theme Base
# Default values for light themes based on Visual Studio Light

colors:
  # Editor colors
  - id: editor.background
    value: "#ffffff"
    description: Editor background color

  - id: editor.foreground
    value: "#000000"
    description: Editor foreground color

  # Chat-bubble tints for light themes (incoming = received/left,
  # outgoing = sent/right). → --chat-bubble-incoming/outgoing-background
  - id: chat-bubble.incoming.background
    value: "rgb(0, 0, 0, 0.06)"
    description: Incoming chat-bubble background (light themes)

  - id: chat-bubble.outgoing.background
    value: "rgb(0, 120, 215, 0.16)"
    description: Outgoing chat-bubble background (light themes)

  # highlight.js syntax token colours for LIGHT themes (VS / GitHub-light-ish
  # palette — dark text so tokens stay legible on a light background).
  - id: hljs.foreground
    value: "#1f1f1f"
    description: "Syntax highlight: default code foreground (light)"
  - id: hljs.keyword
    value: "#0000ff"
    description: "Syntax highlight: keywords / literals / names (light)"
  - id: hljs.type
    value: "#267f99"
    description: "Syntax highlight: built-ins / types (light)"
  - id: hljs.number
    value: "#098658"
    description: "Syntax highlight: numbers / classes (light)"
  - id: hljs.string
    value: "#a31515"
    description: "Syntax highlight: strings (light)"
  - id: hljs.regexp
    value: "#811f3f"
    description: "Syntax highlight: regexps / template tags (light)"
  - id: hljs.comment
    value: "#008000"
    description: "Syntax highlight: comments / quotes / doctags (light)"
  - id: hljs.meta
    value: "#808080"
    description: "Syntax highlight: meta / tags (light)"
  - id: hljs.variable
    value: "#9b46b0"
    description: "Syntax highlight: variables (light)"
  - id: hljs.attr
    value: "#0451a5"
    description: "Syntax highlight: attributes / JSON keys (light)"
  - id: hljs.section
    value: "#800000"
    description: "Syntax highlight: sections / headings (light)"
  - id: hljs.selector
    value: "#800000"
    description: "Syntax highlight: CSS selectors / bullets (light)"
  - id: hljs.addition.background
    value: "#dafbe1"
    description: "Syntax highlight: diff addition background (light)"
  - id: hljs.deletion.background
    value: "#ffd7d5"
    description: "Syntax highlight: diff deletion background (light)"

  # Hyperlink / inline-link text colour (URL-style links, e.g. ECUI Button link)
  - id: textLink.foreground
    value: "#005FB8"
    description: Foreground color for links

  - id: textLink.activeForeground
    value: "#0078D4"
    description: Foreground color for active / hovered links

  # Default widget background (for editors, panels, previews)
  - id: editorWidget.background
    value: "#F8F8F8"
    description: Editor widget background color

  - id: editorWidget.border
    value: "#C8C8C8"
    description: Editor widget border color

  # Hover widget / tooltip colors
  - id: editorHoverWidget.background
    value: "#F3F3F3"
    description: Hover widget background color

  - id: editorHoverWidget.foreground
    value: "#333333"
    description: Hover widget foreground color

  - id: editorHoverWidget.border
    value: "#CECECE"
    description: Hover widget border color

  # Generic foreground (used by many controls / labels)
  - id: foreground
    value: "#3B3B3B"
    description: Primary foreground color

  - id: editor.inactiveSelectionBackground
    value: "#E5EBF1"
    description: Editor inactive selection background

  - id: editor.selectionHighlightBackground
    value: "#ADD6FF80"
    description: Editor selection highlight background

  - id: editorIndentGuide.background1
    value: "#D3D3D3"
    description: Editor indent guide background

  - id: editorIndentGuide.activeBackground1
    value: "#939393"
    description: Editor active indent guide background

  - id: editorSuggestWidget.background
    value: "#F3F3F3"
    description: Editor suggest widget background

  # Input colors
  - id: input.background
    value: "#ffffff"
    description: Input background color

  - id: input.foreground
    value: "#000000"
    description: Input foreground color

  - id: input.border
    value: "#cecece"
    description: Input border color

  - id: input.placeholderForeground
    value: "#767676"
    description: Input placeholder foreground

  # Input validation states — used by form fields when a field is in
  # error / warning / info state. VS Code Light+ defaults.
  - id: inputValidation.errorBackground
    value: "#FDE7E7"
    description: Input validation error background (pale red)

  - id: inputValidation.errorBorder
    value: "#BE1100"
    description: Input validation error border

  - id: inputValidation.errorForeground
    value: "#A1260D"
    description: Input validation error foreground

  - id: inputValidation.warningBackground
    value: "#FFFCE5"
    description: Input validation warning background (pale yellow)

  - id: inputValidation.warningBorder
    value: "#B89500"
    description: Input validation warning border

  - id: inputValidation.warningForeground
    value: "#7A6307"
    description: Input validation warning foreground

  - id: inputValidation.infoBackground
    value: "#E1F0FF"
    description: Input validation info background (pale blue)

  - id: inputValidation.infoBorder
    value: "#007ACC"
    description: Input validation info border

  - id: inputValidation.infoForeground
    value: "#316BCD"
    description: Input validation info foreground

  # Toggle / input option active styles (used by checkbox/toggle)
  - id: inputOption.activeBackground
    value: "#BED6ED"
    description: Active option background

  - id: inputOption.activeBorder
    value: "#005FB8"
    description: Active option border

  - id: inputOption.activeForeground
    value: "#000000"
    description: Active option foreground

  # Generic description text (used by labels, tooltips, etc.)
  - id: descriptionForeground
    value: "#3B3B3B"
    description: Description / secondary foreground

  # Inline code / text code block background (used by tooltips and markdown)
  - id: textCodeBlock.background
    value: "rgba(255, 255, 255, 0.1)"
    description: Text code block background

  # Dropdown colors
  - id: dropdown.background
    value: "#ffffff"
    description: Dropdown background color

  - id: dropdown.foreground
    value: "#333333"
    description: Dropdown foreground color

  - id: dropdown.border
    value: "#cecece"
    description: Dropdown border color

  - id: dropdown.listBackground
    value: "#ffffff"
    description: Dropdown list background color

  # QuickInput colors
  - id: quickInput.background
    value: "#f3f3f3"
    description: Quick input background color

  - id: quickInput.foreground
    value: "#333333"
    description: Quick input foreground color

  # List colors
  - id: list.activeSelectionBackground
    value: "#0060c0"
    description: List active selection background

  - id: list.activeSelectionForeground
    value: "#ffffff"
    description: List active selection foreground

  - id: list.activeSelectionIconForeground
    value: "#FFF"
    description: Active selection icon foreground

  - id: list.hoverBackground
    value: "#e8e8e8"
    description: List hover background

  - id: list.hoverForeground
    value: "#333333"
    description: List hover foreground

  - id: list.focusBackground
    value: "#d6ebff"
    description: List focus background

  - id: list.focusForeground
    value: "#333333"
    description: List focus foreground

  - id: list.foreground
    value: "#333333"
    description: List foreground

  - id: list.focusAndSelectionOutline
    value: "#90C2F9"
    description: List focus and selection outline

  - id: list.dropBackground
    value: "#D6EBFF"
    description: List drop target background (drag-and-drop preview)

  # Button colors
  - id: button.background
    value: "#007acc"
    description: Button background color

  - id: button.foreground
    value: "#ffffff"
    description: Button foreground color

  - id: button.hoverBackground
    value: "#0062a3"
    description: Button hover background color

  - id: button.secondaryBackground
    value: "#E5E5E5"
    description: Secondary button background color

  - id: button.secondaryForeground
    value: "#3B3B3B"
    description: Secondary button foreground color

  - id: button.secondaryHoverBackground
    value: "#CCCCCC"
    description: Secondary button hover background color

  - id: button.background.emphasis.1
    value: "#d97b2a"
    description: Emphasis-1 button background (warm orange)

  - id: button.border.emphasis.1
    value: "#c06a1f"
    description: Emphasis-1 button border

  - id: button.hoverBackground.emphasis.1
    value: "#e68a35"
    description: Emphasis-1 button hover background

  - id: button.foreground.emphasis.1
    value: "#ffffff"
    description: Emphasis-1 button foreground

  # Checkbox colors
  - id: checkbox.background
    value: "#ffffff"
    description: Checkbox background color

  - id: checkbox.foreground
    value: "#000000"
    description: Checkbox foreground color

  - id: checkbox.border
    value: "#cecece"
    description: Checkbox border color

  # Focus border
  - id: focusBorder
    value: "#0090f1"
    description: Focus border color

  # Scrollbar colors
  - id: scrollbarSlider.background
    value: "#64646466"
    description: Scrollbar slider background

  - id: scrollbarSlider.hoverBackground
    value: "#646464b3"
    description: Scrollbar slider hover background

  - id: scrollbarSlider.activeBackground
    value: "#00000099"
    description: Scrollbar slider active background

  # Tag colors (light base)
  - id: tag.background
    value: "#d0e5ff" # soft blue
    description: Tag background color

  - id: tag.background-hover
    value: "#bddbff" # slightly stronger blue
    description: Tag hover background color

  - id: tag.foreground
    value: "#003355"
    description: Tag foreground color

  # Tab colors
  - id: tab.activeForeground
    value: "#333333"
    description: Active tab foreground

  - id: tab.activeTextColor
    value: "#333333"
    description: Active tab text color (used by tab strips that distinguish the text color from the foreground token)

  - id: tab.activeBorder
    value: "#0078d4"
    description: Active tab border

  - id: tab.activeGlow
    value: "rgba(0, 100, 200, 0.15)"
    description: Active tab glow effect color (radial gradient)

  - id: tab.inactiveForeground
    value: "rgba(51, 51, 51, 0.7)"
    description: Inactive tab foreground

  - id: tab.border
    value: "rgba(97, 97, 97, 0.2)"
    description: Tab border

  - id: tab.selectedForeground
    value: "#333333b3"
    description: Selected tab foreground

  - id: tab.selectedBackground
    value: "#ffffffa5"
    description: Selected tab background

  - id: tab.lastPinnedBorder
    value: "#61616130"
    description: Last pinned tab border

  - id: tab.dragAndDropBorder
    value: "#4FC3F7"
    description: Border color used when dragging tabs

  # Menu colors
  - id: menu.background
    value: "#ffffff"
    description: Menu background (matches editor surface on light themes — without this the menu is transparent and the workbench bleeds through)

  - id: menu.foreground
    value: "#3B3B3B"
    description: Menu foreground (matches the global `foreground` token)

  - id: menu.selectionBackground
    value: "#0090F1"
    description: Menu item hover/selection background (VS Code Light+ accent)

  - id: menu.separatorBackground
    value: "#D4D4D4"
    description: Divider lines between menu sections

  - id: menu.border
    value: "#D4D4D4"
    description: Menu border

  # Search editor
  - id: searchEditor.textInputBorder
    value: "#CECECE"
    description: Search editor text input border

  # Settings
  - id: settings.textInputBorder
    value: "#CECECE"
    description: Settings text input border

  - id: settings.numberInputBorder
    value: "#CECECE"
    description: Settings number input border

  # Activity bar
  - id: activityBarBadge.background
    value: "#007ACC"
    description: Activity bar badge background

  # Side bar
  - id: sideBarTitle.foreground
    value: "#6F6F6F"
    description: Side bar title foreground

  - id: sideBarSectionHeader.background
    value: "#0000"
    description: Side bar section header background

  - id: sideBarSectionHeader.border
    value: "#61616130"
    description: Side bar section header border

  # Dock primitive — panel surface (the dockable side that fades on
  # collapse + floats over the main column during hover-preview).
  # Kept opaque by default so consumers don't have to opt in per
  # call site for the preview overlay to read cleanly over content.
  # Mirrors `editor.background` so the dock blends into the workbench
  # by default; per-theme overrides are still free to diverge.
  - id: dock.background
    value: "#ffffff"
    description: Dock panel background

  # Status bar
  - id: statusBarItem.remoteForeground
    value: "#FFF"
    description: Status bar remote item foreground

  - id: statusBarItem.remoteBackground
    value: "#16825D"
    description: Status bar remote item background

  - id: statusBarItem.errorBackground
    value: "#c72e0f"
    description: Status bar error item background

  # Ports
  - id: ports.iconRunningProcessForeground
    value: "#369432"
    description: Running process icon foreground

  # Notebook
  - id: notebook.cellBorderColor
    value: "#E8E8E8"
    description: Notebook cell border color

  - id: notebook.selectedCellBackground
    value: "#c8ddf150"
    description: Notebook selected cell background

  # Terminal
  - id: terminal.inactiveSelectionBackground
    value: "#E5EBF1"
    description: Terminal inactive selection background

  # Widget
  - id: widget.border
    value: "#d4d4d4"
    description: Widget border

  - id: window.border
    value: "#C8C8C8"
    description: Native-window border color (used by the title bar / drag region)

  # Panels
  - id: panel.border
    value: "#E5E5E5"
    description: Panel border

  # Action bar
  - id: actionBar.toggledBackground
    value: "#dddddd"
    description: Action bar toggled background

  # Diff editor
  - id: diffEditor.unchangedRegionBackground
    value: "#f8f8f8"
    description: Diff editor unchanged region background

  # WCO (Window Controls Overlay)
  - id: wco.iconForeground
    value: "#000000"
    description: WCO codicon foreground color

  # Scenario graph nodes (scenario editor)
  - id: scenarioNode.background
    value: "#ffffff"
    description: Scenario node body background

  - id: scenarioNode.headerBackground
    value: "#e8eaed"
    description: Scenario node header background

  - id: scenarioNode.headerBackgroundSelected
    value: "#d3e6fb"
    description: Scenario node header background when selected

  # Alert colors (info)
  - id: alert.info.background
    value: "#e1f5fe"
    description: Alert info background color

  - id: alert.info.foreground
    value: "#01579b"
    description: Alert info foreground color

  - id: alert.info.border
    value: "#81d4fa"
    description: Alert info border color

  # Alert colors (warning)
  - id: alert.warning.background
    value: "#fff3cd"
    description: Alert warning background color

  - id: alert.warning.foreground
    value: "#856404"
    description: Alert warning foreground color

  - id: alert.warning.border
    value: "#ffc107"
    description: Alert warning border color

  # Alert colors (error)
  - id: alert.error.background
    value: "#ffebee"
    description: Alert error background color

  - id: alert.error.foreground
    value: "#c62828"
    description: Alert error foreground color

  - id: alert.error.border
    value: "#ef9a9a"
    description: Alert error border color

  # Alert colors (debug)
  - id: alert.debug.background
    value: "#f5f5f5"
    description: Alert debug background color

  - id: alert.debug.foreground
    value: "#616161"
    description: Alert debug foreground color

  - id: alert.debug.border
    value: "#e0e0e0"
    description: Alert debug border color
