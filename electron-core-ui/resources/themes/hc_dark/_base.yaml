  # Scenario graph nodes (scenario editor)
  - id: scenarioNode.background
    value: "#0d0d0d"
    description: Scenario node body background

  - id: scenarioNode.headerBackground
    value: "#1c1c1c"
    description: Scenario node header background

  - id: scenarioNode.headerBackgroundSelected
    value: "#04518a"
    description: Scenario node header background when selected

  # Scrollbar colors
  - id: scrollbarSlider.background
    value: "#79797966"
    description: Scrollbar slider background

  - id: scrollbarSlider.hoverBackground
    value: "#646464b3"
    description: Scrollbar slider hover background

  - id: scrollbarSlider.activeBackground
    value: "#bfbfbf66"
    description: Scrollbar slider active background

  # Tab colors
  - id: tab.activeForeground
    value: "#ffffff"
    description: Active tab foreground

  - id: tab.activeTextColor
    value: "#ffffff"
    description: Active tab text color (selected tab)

  - id: tab.activeBorder
    value: "#0078d4"
    description: Active tab border

  - id: tab.inactiveForeground
    value: "rgba(255, 255, 255, 0.5)"
    description: Inactive tab foreground

  - id: tab.border
    value: "rgba(128, 128, 128, 0.35)"
    description: Tab border

  - id: tab.dragAndDropBorder
    value: "#FFFFFF"
    description: Border color used when dragging tabs

  # Selection
  - id: selection.background
    value: "#008000"
    description: Selection background

  # Side bar
  - id: sideBarTitle.foreground
    value: "#FFFFFF"
    description: Side bar title foreground

  # Dock primitive — panel surface (the dockable side that fades on
  # collapse + floats over the main column during hover-preview) and
  # the foreground pair painted on it. The surface is a fixed
  # per-family colour, so the text on it must be fixed the same way:
  # a foreground inherited from another token family (editor, button,
  # …) can coincide with the dock surface and render the panel content
  # invisible. All three mirror their `editor.*` / `descriptionForeground`
  # counterparts; a theme that overrides one should override all three.
  - id: dock.background
    value: "#000000"
    description: Dock panel background

  - id: dock.foreground
    value: "#FFFFFF"
    description: Dock panel foreground (paired with dock.background)

  - id: dock.descriptionForeground
    value: "#FFFFFF"
    description: Dock panel secondary foreground (paired with dock.background)

  # Status bar
  - id: statusBarItem.remoteBackground
    value: "#00000000"
    description: Status bar remote item background

  # Ports
  - id: ports.iconRunningProcessForeground
    value: "#FFFFFF"
    description: Running process icon foreground

  # Action bar
  - id: actionBar.toggledBackground
    value: "#383a49"
    description: Action bar toggled background

  # WCO (Window Controls Overlay)
  - id: wco.iconForeground
    value: "#ffffff"
    description: WCO codicon foreground color

  # Panels
  - id: panel.border
    value: "#FFFFFF"
    description: Panel border

  # Alert colors (info) - High contrast
  - id: alert.info.background
    value: "#000000"
    description: Alert info background color

  - id: alert.info.foreground
    value: "#6fc3df"
    description: Alert info foreground color

  - id: alert.info.border
    value: "#6fc3df"
    description: Alert info border color

  # Alert colors (warning) - High contrast
  - id: alert.warning.background
    value: "#000000"
    description: Alert warning background color

  - id: alert.warning.foreground
    value: "#ffcc00"
    description: Alert warning foreground color

  - id: alert.warning.border
    value: "#ffcc00"
    description: Alert warning border color

  # Alert colors (error) - High contrast
