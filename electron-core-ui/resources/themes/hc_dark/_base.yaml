    value: "#000000"
    description: Alert error background color

  - id: alert.error.foreground
    value: "#ff6b6b"
    description: Alert error foreground color

  - id: alert.error.border
    value: "#ff6b6b"
    description: Alert error border color

  # Alert colors (debug) - High contrast
  - id: alert.debug.background
    value: "#000000"
    description: Alert debug background color

  - id: alert.debug.foreground
    value: "#ffffff"
    description: Alert debug foreground color

  - id: alert.debug.border
    value: "#ffffff"
    description: Alert debug border color

