# Secret scanning — runs gitleaks over the whole git history on every pull
# request and on every push to main. The local pre-commit hook runs the same
# scanner on the staged diff; this job is the safety net behind it.
name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan the git history
        run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --log-opts=--all --config /repo/.gitleaks.toml \
            --redact --no-banner --verbose
