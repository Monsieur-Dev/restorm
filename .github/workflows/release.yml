name: Release (production)

# Production release: build the distributables and publish them, together with
# the release notes, to the PUBLIC R2 bucket (restorm-releases, served at
# https://dl.restorm.app) — the single distribution channel, deliberately: no
# GitHub Release, nothing for a user to download from the repository. Triggered
# on a version tag (vX.Y.Z), called by manual-release.yml right after it bumps +
# tags, or run manually.
#
# All three desktop platforms, unsigned. Windows (nsis) + macOS (dmg/zip) build
# without code signing / notarisation for now — installable for testing, with the
# usual SmartScreen / Gatekeeper prompt. Signing + notarisation are still to come
# (macOS auto-update in particular needs a signed build to self-apply).
#
# The `tag` input exists because on a `workflow_call` run `github.ref` is the
# CALLER's ref (refs/heads/main), not the tag that was just created — a plain
# checkout would build the pre-bump code. The caller passes the tag explicitly,
# and both jobs check out `inputs.tag` first, falling back to `github.ref` on the
# push / manual paths (where `inputs` is empty).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      targets:
        description: 'Platforms to build (comma-separated: linux,windows,macos)'
        required: false
        default: 'linux,windows,macos'
        type: string
      tag:
        description: 'Existing tag/ref to (re)build WITHOUT bumping (e.g. v1.1.1). Blank = the dispatched ref. This workflow never creates or deletes tags — new versions come from manual-release.yml.'
        required: false
        type: string
      publish:
        description: 'Publish artifacts to R2. Set false to validate the pipeline (incl. macOS sign/notarize/staple) without touching the public bucket or the auto-update feed.'
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      tag:
        description: 'Tag to build and publish (vX.Y.Z)'
        required: true
        type: string
      targets:
        description: 'Platforms to build (comma-separated: linux,windows,macos)'
        required: false
        default: 'linux,windows,macos'
        type: string
      publish:
        description: 'Publish artifacts to R2 (false = dry run).'
        required: false
        default: true
        type: boolean

# Read-only: nothing here writes to the repository. The distributables and the
# notes go to R2 with their own credentials, and the version bump + tag are the
# caller's job (manual-release.yml), not this workflow's.
permissions:
  contents: read

jobs:
  # Resolve WHICH platforms to build (the `targets` input, default all three)
  # and WHICH ref to build. Emitting the matrix here lets a dispatch build a
  # subset — e.g. rebuild only macos from an existing tag — instead of the
  # fixed 3-OS matrix. `targets` is also surfaced as an output so the
  # downstream store jobs can each gate on their own platform having built.
  setup:
    name: Resolve build matrix + ref
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      ref: ${{ steps.plan.outputs.ref }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - id: plan
        shell: bash
        run: |
          TARGETS="${{ inputs.targets }}"
          [ -z "$TARGETS" ] && TARGETS="linux,windows,macos"
          REF="${{ inputs.tag }}"
          [ -z "$REF" ] && REF="${{ github.ref }}"
          inc=""
          case ",$TARGETS," in *,linux,*)   inc="${inc}{\"os\":\"ubuntu-latest\",\"platform\":\"linux\"},";;   esac
          case ",$TARGETS," in *,windows,*) inc="${inc}{\"os\":\"windows-latest\",\"platform\":\"windows\"},";; esac
          case ",$TARGETS," in *,macos,*)   inc="${inc}{\"os\":\"macos-latest\",\"platform\":\"macos\"},";;    esac
          inc="${inc%,}"
          if [ -z "$inc" ]; then echo "no valid platform in targets='$TARGETS'" >&2; exit 1; fi
          {
            echo "matrix={\"include\":[$inc]}"
            echo "ref=$REF"
            echo "targets=$TARGETS"
          } >> "$GITHUB_OUTPUT"
          echo "Building [$TARGETS] from ref $REF"

  release:
    name: Release (${{ matrix.platform }})
    needs: setup
    runs-on: ${{ matrix.os }}
    # Use bash on every runner (Git Bash on Windows) so the shared shell steps
    # below — inline `NODE_OPTIONS=… cmd`, unix-style paths — behave identically
    # across linux/windows/macos.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.ref }}
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.26.1

      - name: Install + build electron-core-ui
        run: |
          cd electron-core-ui
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install restorm dependencies
        run: |
          cd restorm
          pnpm install --frozen-lockfile

      - name: Install rpm tooling (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build distributables (electron-builder)
        run: |
          cd restorm
          # An unset GitHub secret renders as an EMPTY env var, and
          # electron-builder treats an empty CSC_LINK as a provided cert
          # path — it resolves to the project dir and dies with "not a
          # file". Strip every empty signing/telemetry var so an
          # uncredentialed run stays a plain unsigned build.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD \
                   APPLE_TEAM_ID APPLE_API_KEY_ID APPLE_API_ISSUER \
                   AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET \
                   SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT; do
            if [ -z "$(printenv "$v")" ]; then unset "$v"; fi
          done
          # macOS notarization uses an App Store Connect API key. The secret
          # holds the .p8 base64; @electron/notarize wants a file PATH, so
          # materialize it and point APPLE_API_KEY at the file. Absent secret ⇒
          # nothing is written and the notarize gate below stays off.
          if [ "${{ matrix.platform }}" = "macos" ] && [ -n "$APPLE_API_KEY_B64" ]; then
            printf '%s' "$APPLE_API_KEY_B64" | base64 -d > "$RUNNER_TEMP/apple_api_key.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/apple_api_key.p8"
          fi
          # macOS signing keychain — pre-managed here on purpose. electron-builder's
          # own keychain setup unlocks its temporary keychain with the CERT password
          # rather than the keychain password (app-builder-lib macCodeSign.js
          # importCerts: `set-key-partition-list -k <cscKeyPassword>` against a
          # keychain created with a random password), which fails on current macos
          # runners with "SecKeychainUnlock: passphrase not correct". So build the
          # keychain here with a known password (used consistently), import the
          # cert, and hand electron-builder the ready keychain via CSC_KEYCHAIN — it
          # skips its own keychain creation when CSC_LINK is unset (macPackager.js).
          SIGNED=""
          if [ "${{ matrix.platform }}" = "macos" ] && [ -n "$CSC_LINK" ] && [ -n "$CSC_KEY_PASSWORD" ]; then
            KEYCHAIN="$RUNNER_TEMP/restorm-signing.keychain-db"
            KEYCHAIN_PWD="$(openssl rand -base64 24)"
            printf '%s' "$CSC_LINK" | base64 -d > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
            security set-keychain-settings "$KEYCHAIN"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            rm -f "$RUNNER_TEMP/cert.p12"
            echo "Signing identities in the build keychain:"
            security find-identity -v -p codesigning "$KEYCHAIN"
            export CSC_KEYCHAIN="$KEYCHAIN"
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            unset CSC_LINK CSC_KEY_PASSWORD
            SIGNED=1
          fi
          # ASYNC notarization: do NOT notarize inline — that pins the 10x macOS
          # runner polling Apple for 30-80 min. electron-builder only SIGNS here;
          # the submit + wait + staple are split across later jobs
          # (mac-notary-wait on Linux, mac-staple-publish on a short mac runner).
          # So no notarize flag.
          NOTARIZE_FLAG=""
          # Windows code signing via Azure Trusted Signing. electron-builder 26
          # signs the app executables + the NSIS installer inline when
          # win.azureSignOptions is set (it self-installs the TrustedSigning
          # PowerShell module and calls Invoke-TrustedSigning, authenticating
          # with the AZURE_TENANT_ID/CLIENT_ID/CLIENT_SECRET env below via
          # EnvironmentCredential). We inject the options ONLY here, and ONLY
          # when the Azure credentials are present, so package.json stays
          # unsigned by default: an uncredentialed build (or another workflow)
          # must not carry azureSignOptions, or electron-builder would try to
          # sign and fail. The account/profile were created under MonsieurDev
          # (North Europe endpoint).
          WIN_SIGN_FLAGS=""
          if [ "${{ matrix.platform }}" = "windows" ] && [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$AZURE_TENANT_ID" ]; then
            WIN_SIGN_FLAGS="-c.win.azureSignOptions.publisherName=MonsieurDev -c.win.azureSignOptions.endpoint=https://neu.codesigning.azure.net/ -c.win.azureSignOptions.codeSigningAccountName=restormsigning -c.win.azureSignOptions.certificateProfileName=restorm-public-trust"
            echo "Windows build → signing via Azure Trusted Signing (account restormsigning, profile restorm-public-trust)."
          fi
          # A tag-triggered run sets GITHUB_REF_TYPE=tag, which flips
          # electron-builder into implicit publishing — it then tries to push
          # the .snap to the Snap Store, but snapcraft isn't installed on this
          # build runner, so the whole build fails. We publish artifacts to R2
          # (the step below) and the .snap to the store (snap-store.yml)
          # ourselves, never from here. Force the non-tag build behaviour so
          # electron-builder still generates latest*.yml (needed for
          # auto-update) but pushes nothing: the reusable workflow_call path
          # already runs this way (its ref is the caller's branch).
          GITHUB_REF_TYPE=branch NODE_OPTIONS="$NODE_HEAP" pnpm run dist -- $NOTARIZE_FLAG $WIN_SIGN_FLAGS
          # Signed macOS build → submit each .dmg to the notary service WITHOUT
          # waiting and record the submission ids. The .app inside every dmg/zip
          # of one arch shares a single code signature (cdhash), so one
          # submission per arch notarizes all of that arch's artifacts (stapling
          # happens later, in mac-staple-publish). The presence of
          # notary-submissions.txt is the async-signed marker the downstream
          # steps/jobs key off.
          if [ "${{ matrix.platform }}" = "macos" ] && [ -n "$SIGNED" ] && [ -n "$APPLE_API_KEY" ]; then
            : > dist-electron/notary-submissions.txt
            for dmg in dist-electron/*.dmg; do
              [ -f "$dmg" ] || continue
              echo "Submitting $dmg to the notary service (--no-wait)…"
              id=$(xcrun notarytool submit "$dmg" \
                     --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
                     --no-wait --output-format json \
                   | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).id)}catch(e){process.exit(1)}})')
              [ -n "$id" ] || { echo "notarytool submit returned no id for $dmg" >&2; exit 1; }
              echo "  → submission id $id"
              echo "$id" >> dist-electron/notary-submissions.txt
            done
          fi
        env:
          # Source-map generation roughly doubles the renderer build's peak heap,
          # so the limit tracks whether maps are being produced at all — which is
          # itself decided by whether the crash-report upload is configured. The
          # 4 GB path is the long-standing default and stays the cost until the
          # credentials exist; without this the first credentialed release would
          # OOM instead of publishing.
          NODE_HEAP: ${{ secrets.SENTRY_AUTH_TOKEN && '--max-old-space-size=8192' || '--max-old-space-size=4096' }}
          # Crash-report source maps: absent ⇒ the build emits none and the
          # upload step is skipped, and the build stays green either way.
          # Crash reporting: the DSN is BAKED INTO the bundles here. A packaged
          # app inherits no environment, so a build without this ships with
          # crash reporting permanently inert — which is exactly how every
          # v1.0.0 crash went unreported.
          RESTORM_SENTRY_DSN: ${{ secrets.RESTORM_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          # generic publish provider → electron-builder generates latest*.yml
          # (the auto-update feed) without uploading; we upload to R2 below.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Stop electron-builder from hunting the keychain for a macOS
          # signing identity (would fail the mac job with no cert installed).
          # An EXPLICIT identity via CSC_LINK below is unaffected by this.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # ── Code signing (inert until the secrets exist) ──────────────
          # macOS: Developer ID Application cert as base64 .p12 + passphrase.
          # An unset secret yields an empty env var, which electron-builder
          # treats as absent — the build stays unsigned, exactly as before.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # macOS notarization (used with -c.mac.notarize=true above). Primary
          # path: an App Store Connect API key — the .p8 base64 rides in
          # APPLE_API_KEY_B64 and is decoded to a file (APPLE_API_KEY) in the
          # run step above. APPLE_ID + app-specific password remain a fallback
          # when those are configured instead.
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows (Azure Trusted Signing — pending the mechanism decision;
          # wiring documented in docs/contributing/release-signing.md).
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Flag whether this macOS build went the async-notarization path
        # The build step writes notary-submissions.txt only when it actually
        # signed + submitted. Its presence routes the mac artifacts to
        # mac-staple-publish (notarize wait → staple → verify → publish) instead
        # of the inline publish below. An UNSIGNED mac build has no marker and
        # keeps the normal in-matrix publish (a plain unsigned build, as before).
        if: matrix.platform == 'macos'
        run: |
          if [ -f restorm/dist-electron/notary-submissions.txt ]; then
            echo "mac_async=true" >> "$GITHUB_ENV"
          else
            echo "mac_async=false" >> "$GITHUB_ENV"
          fi

      - name: Store the signed macOS dist for the staple job
        # Hand the signed-but-unstapled dist to mac-staple-publish: the .dmg
        # installers (+ blockmaps), the auto-update .zip archives, the update
        # feed, and the submission ids. Only SINGLE FILES are handed off (dmg,
        # zip) — never the raw .app directory: GitHub artifacts don't preserve
        # a bundle's symlinks/permissions and would break its signature. The
        # staple job extracts the .app from the zip instead. Ephemeral (1-day).
        if: matrix.platform == 'macos' && env.mac_async == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: |
            restorm/dist-electron/*.dmg
            restorm/dist-electron/*.dmg.blockmap
            restorm/dist-electron/*-mac.zip
            restorm/dist-electron/latest-mac.yml
            restorm/dist-electron/notary-submissions.txt
          retention-days: 1
          if-no-files-found: error

      - name: Describe this platform's build for the npm launcher
        # `restorm-cli` reads this manifest to know which file to fetch and what
        # it must hash to, so it can cache a verified build instead of
        # re-downloading 400 MB on every CI job. Written per platform because
        # this step runs inside the build matrix — see the script's header.
        # Skipped for the async macOS path: the hashes only settle after
        # stapling, so mac-staple-publish writes the mac manifest instead.
        if: matrix.platform != 'macos' || env.mac_async != 'true'
        run: |
          VERSION=$(node -p "require('./restorm/package.json').version")
          node scripts/release-manifest.mjs restorm/dist-electron "$VERSION" https://dl.restorm.app

      - name: Publish to R2 (public — restorm-releases)
        # Per-version layout: binaries + blockmaps live under `v<version>/`,
        # while the `latest*.yml` update feeds stay at the bucket ROOT (their
        # URL is what every installed app polls) with their `url:`/`path:`
        # entries rewritten to point into the version folder — electron-updater
        # and the website's download page both resolve those relative paths.
        # Skipped for the async macOS path (mac-staple-publish publishes the
        # stapled artifacts) and when `publish` is false (a dry-run validation).
        if: (inputs.publish != false) && (matrix.platform != 'macos' || env.mac_async != 'true')
        run: |
          VERSION=$(node -p "require('./restorm/package.json').version")
          # Point the feeds' file references into the version folder. perl, not
          # sed -i: BSD sed (macOS) takes -i's argument differently and silently
          # drops -E, so the capture groups stop existing.
          for yml in restorm/dist-electron/latest*.yml; do
            [ -f "$yml" ] || continue
            V="v${VERSION}" perl -pi -e 's|^( *- +url: )(.+)$|$1$ENV{V}/$2|; s|^(path: )(.+)$|$1$ENV{V}/$2|' "$yml"
          done
          # Binaries + blockmaps → v<version>/ … The .snap rides along so the
          # snap-store workflow can publish it to the store from R2 without a
          # rebuild (the update feeds never reference it — snaps update
          # through the store, not electron-updater).
          aws s3 cp restorm/dist-electron/ "s3://restorm-releases/v${VERSION}/" \
            --recursive --endpoint-url "${R2_ENDPOINT}" \
            --exclude "*" \
            --include "*.deb" --include "*.rpm" --include "*.exe" \
            --include "*.dmg" --include "*.zip" --include "*.AppImage" \
            --include "*.snap" \
            --include "*.blockmap" \
            --include "manifest-*.json" \
            --exclude "*/*"
          # …and the rewritten feeds → bucket root.
          aws s3 cp restorm/dist-electron/ "s3://restorm-releases/" \
            --recursive --endpoint-url "${R2_ENDPOINT}" \
            --exclude "*" \
            --include "latest*.yml" \
            --exclude "*/*"
          # …and every installer AGAIN under `latest/` with a STABLE,
          # version-less name — permanent direct-download URLs for the
          # website's buttons, AppImageHub, AUR, badges. Overwritten by every
          # release, whatever the version.
          stable_name() {
            case "$1" in
              *.AppImage)      echo "Restorm.AppImage" ;;
              *.deb)           echo "restorm_amd64.deb" ;;
              *.rpm)           echo "restorm.x86_64.rpm" ;;
              *.snap)          echo "restorm_amd64.snap" ;;
              *.exe)           echo "Restorm-Setup.exe" ;;
              *-arm64.dmg)     echo "Restorm-arm64.dmg" ;;
              *.dmg)           echo "Restorm.dmg" ;;
              *-arm64-mac.zip) echo "Restorm-arm64-mac.zip" ;;
              *-mac.zip)       echo "Restorm-mac.zip" ;;
              # Every other zip comes from the Windows job — the portable build
              # `restorm-cli` unpacks when no installer is present.
              *.zip)           echo "Restorm-win.zip" ;;
              manifest-*.json) echo "$1" ;;
              *)               echo "" ;;
            esac
          }
          for f in restorm/dist-electron/*; do
            [ -f "$f" ] || continue
            dest=$(stable_name "$(basename "$f")")
            [ -n "$dest" ] || continue
            aws s3 cp "$f" "s3://restorm-releases/latest/${dest}" \
              --endpoint-url "${R2_ENDPOINT}"
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

  # ── Async macOS notarization: WAIT (cheap Linux runner) ──────────────────
  # The mac build job submitted each .dmg to the notary service --no-wait and
  # freed the 10x macOS runner. Poll the App Store Connect Notary API from here
  # (a 1x Linux runner) until every submission is Accepted. No-ops for an
  # unsigned mac build (no submissions artifact) and when macOS wasn't built.
  mac-notary-wait:
    name: macOS notarization (wait)
    needs: [setup, release]
    if: contains(needs.setup.outputs.targets, 'macos')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # The workflow's OWN ref (the branch/tag it ran from) — not the built
        # tag — so scripts/notary-poll.mjs is present even when this run is
        # rebuilding an older tag that predates the script.
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Download the signed macOS dist
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macos-dist
          path: restorm/dist-electron
      - name: Poll the notary service until every submission is Accepted
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ ! -f restorm/dist-electron/notary-submissions.txt ]; then
            echo "No macOS submissions (unsigned build) — nothing to wait for."
            exit 0
          fi
          printf '%s' "$APPLE_API_KEY_B64" | base64 -d > "$RUNNER_TEMP/apple_api_key.p8"
          export APPLE_API_KEY="$RUNNER_TEMP/apple_api_key.p8"
          ids=$(tr '\n' ' ' < restorm/dist-electron/notary-submissions.txt)
          echo "Polling submissions: $ids"
          NOTARY_POLL_SECONDS=60 NOTARY_TIMEOUT_MINUTES=90 node scripts/notary-poll.mjs $ids

  # ── Async macOS notarization: STAPLE + PUBLISH (short macOS runner) ───────
  # Once notarized: staple the ticket into each .dmg and each .app (they share
  # the notarized cdhash), re-zip the stapled .app into the auto-update zip
  # (stapler can't staple a .zip), verify Gatekeeper acceptance, recompute the
  # update feed + npm manifest from the stapled files, and publish to R2. Gated
  # on the `publish` input so the whole flow can be validated with publish=false.
  mac-staple-publish:
    name: macOS staple + publish
    needs: [setup, mac-notary-wait]
    if: contains(needs.setup.outputs.targets, 'macos')
    runs-on: macos-latest
    steps:
      - name: Checkout code
        # Workflow ref (carries scripts/restaple-feed.mjs + release-manifest.mjs),
        # not the built tag. The release VERSION is read from the artifact's feed.
        uses: actions/checkout@v7
      - name: Download the signed macOS dist
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macos-dist
          path: restorm/dist-electron
      - name: Staple, verify, re-stamp the feed, publish
        env:
          PUBLISH: ${{ inputs.publish }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          cd restorm
          if [ ! -f dist-electron/notary-submissions.txt ]; then
            echo "No macOS submissions (unsigned build) — nothing to staple/publish."
            exit 0
          fi
          # Version from the artifact's feed, not package.json — the checkout is
          # the workflow ref, whose version can differ from the rebuilt tag.
          VERSION=$(awk '/^version:/{print $2; exit}' dist-electron/latest-mac.yml)
          [ -n "$VERSION" ] || { echo "could not read version from latest-mac.yml" >&2; exit 1; }
          echo "Publishing macOS artifacts for v${VERSION}"
          # Staple each DMG directly (Gatekeeper validates the dmg's own ticket).
          for dmg in dist-electron/*.dmg; do
            [ -f "$dmg" ] || continue
            echo "Stapling $dmg"; xcrun stapler staple "$dmg"; xcrun stapler validate "$dmg"
          done
          # The auto-update .zip can't be stapled directly, and the .app it
          # carries must be stapled for offline Gatekeeper. Per zip: extract the
          # .app, staple it (same notarized cdhash → the ticket is fetched by
          # cdhash), verify Gatekeeper acceptance, then re-zip with the same
          # ditto flags electron-builder uses.
          for zip in dist-electron/*-mac.zip; do
            [ -f "$zip" ] || continue
            work="$RUNNER_TEMP/$(basename "$zip" .zip)"
            rm -rf "$work"; mkdir -p "$work"
            ditto -x -k "$zip" "$work"
            app="$(find "$work" -maxdepth 1 -name '*.app' -print -quit)"
            [ -n "$app" ] || { echo "no .app inside $zip" >&2; exit 1; }
            echo "Stapling + verifying $app (from $(basename "$zip"))"
            xcrun stapler staple "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
            rm -f "$zip"
            ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"
          done
          # Recompute the update-feed hashes (stapling changed the files) + the
          # npm launcher manifest, both from the FINAL stapled artifacts.
          node ../scripts/restaple-feed.mjs dist-electron dist-electron/latest-mac.yml
          node ../scripts/release-manifest.mjs dist-electron "$VERSION" https://dl.restorm.app
          if [ "${PUBLISH}" = "false" ]; then
            echo "publish=false — macOS sign/notarize/staple/verify validated; NOT publishing to R2."
            exit 0
          fi
          # Publish (mirror of the matrix R2 step, mac files only): feed → root,
          # binaries/blockmaps/manifest → v<version>/, installers → latest/ with
          # stable version-less names.
          V="v${VERSION}" perl -pi -e 's|^( *- +url: )(.+)$|$1$ENV{V}/$2|; s|^(path: )(.+)$|$1$ENV{V}/$2|' dist-electron/latest-mac.yml
          aws s3 cp dist-electron/ "s3://restorm-releases/v${VERSION}/" \
            --recursive --endpoint-url "${R2_ENDPOINT}" \
            --exclude "*" --include "*.dmg" --include "*.dmg.blockmap" \
            --include "*-mac.zip" --include "manifest-darwin.json" --exclude "*/*"
          aws s3 cp dist-electron/latest-mac.yml "s3://restorm-releases/latest-mac.yml" \
            --endpoint-url "${R2_ENDPOINT}"
          for f in dist-electron/*-arm64.dmg dist-electron/*.dmg \
                   dist-electron/*-arm64-mac.zip dist-electron/*-mac.zip \
                   dist-electron/manifest-darwin.json; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in
              *-arm64.dmg)     dest="Restorm-arm64.dmg" ;;
              *.dmg)           dest="Restorm.dmg" ;;
              *-arm64-mac.zip) dest="Restorm-arm64-mac.zip" ;;
              *-mac.zip)       dest="Restorm-mac.zip" ;;
              manifest-*.json) dest="$(basename "$f")" ;;
              *)               dest="" ;;
            esac
            [ -n "$dest" ] || continue
            aws s3 cp "$f" "s3://restorm-releases/latest/${dest}" --endpoint-url "${R2_ENDPOINT}"
          done

  publish-notes:
    name: Publish release notes
    runs-on: ubuntu-latest
    # Once every platform has landed its artifacts: mirror the hand-written
    # release notes next to them, so the notes are readable from the feed alone
    # (the download page, the website's changelog pages, any other consumer) with
    # no access to this repository. Own job, not a step in the matrix above —
    # publishing the same files three times over would be a race for no reason.
    needs: [setup, release]
    # Notes are version-level; only (re)publish them on a full release, not on a
    # single-platform rebuild (they are already in the feed at that point).
    if: ${{ contains(needs.setup.outputs.targets, 'linux') && contains(needs.setup.outputs.targets, 'windows') && contains(needs.setup.outputs.targets, 'macos') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Stage the release notes
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./restorm/package.json').version")
          mkdir -p notes/changelogs notes/release-notes
          # The English source doubles as changelogs/en.md so a consumer can read
          # changelogs/<locale>.md for every locale, English included, instead of
          # special-casing one language.
          cp restorm/CHANGELOG.md notes/CHANGELOG.md
          cp restorm/CHANGELOG.md notes/changelogs/en.md
          cp restorm/changelogs/*.md notes/changelogs/
          # This version's own section, sliced out of the changelog. Best effort:
          # the notes are hand-written before the version bump, so a missing
          # section means that step was skipped — worth a warning, not a failed
          # release (the full changelog still ships).
          awk -v want="## v${VERSION}" '
            $0 == want { inside = 1; print; next }
            inside && /^## v/ { exit }
            inside { print }
          ' restorm/CHANGELOG.md > "notes/release-notes/v${VERSION}.md"
          if [ ! -s "notes/release-notes/v${VERSION}.md" ]; then
            rm "notes/release-notes/v${VERSION}.md"
            echo "::warning::CHANGELOG.md has no '## v${VERSION}' section — publishing the full changelog without a per-version note."
          fi
          find notes -type f | sort

      - name: Publish notes to R2 (public — restorm-releases)
        run: |
          # Short max-age (installers keep the bucket default): a site rebuild
          # right after a release must see the new notes, and the files are tiny.
          aws s3 cp notes/ "s3://restorm-releases/" \
            --recursive --endpoint-url "${R2_ENDPOINT}" \
            --content-type "text/markdown; charset=utf-8" \
            --cache-control "public, max-age=300"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

  snap-store:
    name: Snap Store
    # R2 → Snap Store, in its own reusable workflow: downloads the .snap this
    # release just published to the version folder and uploads it + the
    # listing screenshots. Kept out of the build matrix so the store-side
    # logic lives in one dedicated file (also runnable by hand via dispatch).
    needs: [setup, release]
    # The .snap is produced by the LINUX build, so only publish it when linux
    # was part of this run (a macos-only rebuild must not touch the store).
    if: ${{ contains(needs.setup.outputs.targets, 'linux') }}
    uses: ./.github/workflows/snap-store.yml
    with:
      tag: ${{ inputs.tag || github.ref }}
    secrets: inherit

  npm-publish:
    name: npm
    # Stamps the released version onto the restorm-cli bootstrap package and
    # publishes it — its payload is fetched from R2's latest/ at runtime, so
    # nothing is rebuilt here either.
    needs: [setup, release]
    # restorm-cli fetches every platform's build from R2 at runtime, so only
    # (re)publish the launcher on a full release, not a single-platform rebuild.
    if: ${{ contains(needs.setup.outputs.targets, 'linux') && contains(needs.setup.outputs.targets, 'windows') && contains(needs.setup.outputs.targets, 'macos') }}
    uses: ./.github/workflows/npm-publish.yml
    with:
      tag: ${{ inputs.tag || github.ref }}
    secrets: inherit
