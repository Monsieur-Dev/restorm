name: Build and Test

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      
      - name: Install electron-core-ui dependencies
        run: |
          cd electron-core-ui
          pnpm install --frozen-lockfile
      
      - name: Check electron-core-ui unused dependencies
        run: |
          cd electron-core-ui
          npx depcheck
      
      - name: Run electron-core-ui linter (ESLint + Stylelint)
        run: |
          cd electron-core-ui
          pnpm run lint
      
      - name: Run electron-core-ui type check
        run: |
          cd electron-core-ui
          pnpm run typecheck
      
      - name: Validate theme contrast ratios
        run: |
          cd electron-core-ui
          pnpm run validate:contrast
      
      - name: Build electron-core-ui
        run: |
          cd electron-core-ui
          pnpm run build
      
      - name: Install gitable dependencies
        run: |
          cd gitable
          pnpm install --frozen-lockfile
      
      - name: Check gitable unused dependencies
        run: |
          cd gitable
          npx depcheck
      
      - name: Run linter
        run: |
          cd gitable
          pnpm run lint
      
      - name: Run type check
        run: |
          cd gitable
          pnpm run typecheck
      
      - name: Build gitable application
        run: |
          cd gitable
          pnpm run build

      - name: Install restorm dependencies
        run: |
          cd restorm
          pnpm install --frozen-lockfile

      - name: Check restorm unused dependencies
        run: |
          cd restorm
          npx depcheck

      - name: Run restorm linter
        run: |
          cd restorm
          pnpm run lint

      - name: Run restorm type check
        run: |
          cd restorm
          pnpm run typecheck

      - name: Run restorm unit and integration tests
        run: |
          cd restorm
          pnpm run test:all

      - name: Build restorm application
        run: |
          cd restorm
          NODE_OPTIONS="--max-old-space-size=4096" pnpm run build

      - name: Install Playwright browsers and dependencies
        run: |
          cd restorm
          pnpm exec playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run restorm E2E tests (Playwright)
        run: |
          cd restorm
          xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" pnpm run test:e2e

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    
    services:
      petstore:
        image: swaggerapi/petstore
        ports:
          - 8080:8080
      graphql:
        image: node:20-alpine
        ports:
          - 4000:4000
      soap:
        image: castlemock/castlemock
        ports:
          - 8090:8080
      grpc:
        image: moul/grpcbin
        ports:
          - 9000:9000
          - 9002:9001
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install electron-core-ui dependencies
        run: |
          cd electron-core-ui
          pnpm install --frozen-lockfile

      - name: Build electron-core-ui
        run: |
          cd electron-core-ui
          pnpm run build

      - name: Install restorm dependencies
        run: |
          cd restorm
          pnpm install --frozen-lockfile

      - name: Start GraphQL and Socket.IO servers
        run: |
          cd restorm/tests/docker/graphql-server && npm install && node server.js &
          cd restorm/tests/docker/socketio-server && npm install && node server.js &
          sleep 10

      - name: Wait for services
        run: |
          cd restorm
          node tests/integration/wait-for-services.js

      - name: Run integration tests
        run: |
          cd restorm
          pnpm run test:integration:coverage
