name: Build and Test

# Toggle for the redundant-with-local checks (lint / typecheck / depcheck):
#
#   DEFAULT (unset or 'false'): LIGHT CI — only install, build, and tests run.
#     This is sufficient for normal pushes because the pre-commit hook already
#     enforces lint + typecheck + depcheck locally before any commit lands.
#
#   FULL CI: set the repository variable CI_FULL_CHECKS=true
#     (Settings → Variables → Actions → CI_FULL_CHECKS) to re-enable all steps
#     on every push.  Alternatively, trigger a manual run via
#     Actions → "Build and Test" → Run workflow → check "Run full checks".
#
# Always-on (never gated): install, build, unit tests, integration tests.
# These catch lockfile drift, uncommitted artefacts, and env issues that local
# hooks cannot — they are the green signal that ship.sh --auto merges on.

# No `push: main` trigger: every merge to main comes from a PR whose branch
# was required to be up to date, so the merge commit's tree is identical to
# the PR head that CI already validated — rebuilding it on push was a pure
# duplicate. (Direct pushes to main are forbidden by project rules; the
# staging preview build on merge lives in build-staging.yml, unchanged.)
on:
  pull_request:
  workflow_dispatch:
    inputs:
      full_checks:
        description: 'Run full checks (lint, typecheck, depcheck) — same as CI_FULL_CHECKS=true'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.26.1

      - name: Install electron-core-ui dependencies
        run: |
          cd electron-core-ui
          pnpm install --frozen-lockfile

      # The electron package's postinstall download can fail transiently on
      # hosted runners; unit tests that spawn Electron then die at import time
      # with "Electron failed to install correctly" / "fetch failed". Probe
      # the binary and re-run the official install script with retries so the
      # test step never depends on postinstall timing.
      - name: Ensure the Electron binary is present
        run: |
          cd electron-core-ui
          for i in 1 2 3; do
            if node -e "require('electron')" >/dev/null 2>&1; then
              echo "Electron binary OK"
              exit 0
            fi
            echo "Electron binary missing — running install.js (attempt $i)…"
            node node_modules/electron/install.js && continue
            sleep 10
          done
          if node -e "require('electron')" >/dev/null 2>&1; then
            echo "Electron binary OK"
            exit 0
          fi
          echo "Electron binary still missing after 3 attempts" >&2
          exit 1

      - name: Check electron-core-ui unused dependencies
        if: ${{ vars.CI_FULL_CHECKS == 'true' || inputs.full_checks == true }}
        run: |
          cd electron-core-ui
          npx depcheck

      - name: Run electron-core-ui linter (ESLint + Stylelint)
        if: ${{ vars.CI_FULL_CHECKS == 'true' || inputs.full_checks == true }}
        run: |
          cd electron-core-ui
          NODE_OPTIONS="--max-old-space-size=4096" pnpm run lint

      - name: Run electron-core-ui type check
        if: ${{ vars.CI_FULL_CHECKS == 'true' || inputs.full_checks == true }}
        run: |
          cd electron-core-ui
          NODE_OPTIONS="--max-old-space-size=4096" pnpm run typecheck

      - name: Run electron-core-ui tests
        run: |
          cd electron-core-ui
          pnpm run test

      - name: Validate theme contrast ratios
        run: |
          cd electron-core-ui
          pnpm run validate:contrast

      - name: Build electron-core-ui
        run: |
          cd electron-core-ui
          pnpm run build

      - name: Install restorm dependencies
        run: |
          cd restorm
          pnpm install --frozen-lockfile

      - name: Check restorm unused dependencies
        if: ${{ vars.CI_FULL_CHECKS == 'true' || inputs.full_checks == true }}
        run: |
          cd restorm
          npx depcheck

      - name: Run restorm linter
        if: ${{ vars.CI_FULL_CHECKS == 'true' || inputs.full_checks == true }}
        run: |
          cd restorm
          NODE_OPTIONS="--max-old-space-size=4096" pnpm run lint

      - name: Run restorm type check
        if: ${{ vars.CI_FULL_CHECKS == 'true' || inputs.full_checks == true }}
        run: |
          cd restorm
          NODE_OPTIONS="--max-old-space-size=4096" pnpm run typecheck

      - name: Run restorm unit and integration tests
        run: |
          cd restorm
          pnpm run test:all

      - name: Build restorm application
        run: |
          cd restorm
          NODE_OPTIONS="--max-old-space-size=4096" pnpm run build

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      petstore:
        image: swaggerapi/petstore
        ports:
          - 8080:8080
      petstore-openapi3:
        # Real OpenAPI 3.0 server. Used by the OpenAPI 3.x importer
        # integration tests to validate URL-based spec fetch +
        # content-sniff routing. Runtime endpoints under `/v3/*`
        # require auth and are not exercised in CI; runtime execution
        # stays on the swaggerapi/petstore mock above.
        image: openapitools/openapi-petstore
        ports:
          - 8081:8080
      graphql:
        image: node:20-alpine
        ports:
          - 4000:4000
      soap:
        image: castlemock/castlemock
        ports:
          - 8090:8080
      grpc:
        # Native gRPC only (port 9000). Its second port is TLS-secured
        # native gRPC too, not gRPC-Web — the gRPC-Web mock (started
        # below alongside the other zero-dependency mocks) owns :9002.
        image: moul/grpcbin
        ports:
          - 9000:9000
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.26.1

      - name: Install electron-core-ui dependencies
        run: |
          cd electron-core-ui
          pnpm install --frozen-lockfile

      - name: Build electron-core-ui
        run: |
          cd electron-core-ui
          pnpm run build

      - name: Install restorm dependencies
        run: |
          cd restorm
          pnpm install --frozen-lockfile

      - name: Start GraphQL, Socket.IO, raw-WebSocket, HTTP-util, SOAP, OData-v2, JSON-RPC, tRPC, SSE, Connect-RPC and gRPC-Web mock servers
        run: |
          cd restorm/tests/docker/graphql-server && npm install && node server.js &
          cd restorm/tests/docker/socketio-server && npm install && node server.js &
          cd restorm/tests/docker/ws-echo-server && npm install && node server.js &
          # http-util, soap-server, odata-v2-petstore, jsonrpc-server,
          # trpc-server, sse-server, connect-server and grpcweb-server are
          # zero-dependency (pure node:http) — no npm install needed.
          cd restorm/tests/docker/http-util && node server.js &
          cd restorm/tests/docker/soap-server && node server.js &
          cd restorm/tests/docker/jsonrpc-server && node server.js &
          cd restorm/tests/docker/trpc-server && node server.js &
          cd restorm/tests/docker/sse-server && node server.js &
          cd restorm/tests/docker/odata-v2-petstore && node server.js &
          cd restorm/tests/docker/connect-server && node server.js &
          cd restorm/tests/docker/grpcweb-server && node server.js &
          sleep 10

      - name: Start OData Pet Store
        # AspNetCoreOData service isn't on a public registry so we
        # build it from tests/docker/odata-petstore/ on the fly and
        # run it as a detached container alongside the services
        # above. Port 5100 is what wait-for-services + the restorm
        # tests expect.
        run: |
          cd restorm/tests/docker/odata-petstore
          docker build -t restorm-odata-petstore .
          docker run -d --name restorm-odata-petstore -p 5100:5100 restorm-odata-petstore

      - name: Start Auth Service
        # Same pattern as odata-petstore — .NET 9 minimal-API container
        # built on the fly, exposing :5110. Drives the `auth-login` e2e
        # suite (POST /login, GET /pet/{id}, GET /swagger.json).
        run: |
          cd restorm/tests/docker/auth-service
          docker build -t restorm-auth-service .
          docker run -d --name restorm-auth-service -p 5110:5110 restorm-auth-service

      - name: Start MQTT broker (Mosquitto)
        # eclipse-mosquitto:2 on :1883, mirroring tests/docker/docker-compose.yml.
        # allow_anonymous=true + a pre-hashed passwd file (restorm/restorm) drive
        # the MQTT publish/subscribe + auth integration tests.
        run: |
          cd restorm/tests/docker
          docker run -d --name restorm-mqtt -p 1883:1883 \
            -v "$(pwd)/mosquitto.conf:/mosquitto/config/mosquitto.conf" \
            -v "$(pwd)/mosquitto-passwd:/mosquitto/config/passwd:ro" \
            eclipse-mosquitto:2

      - name: Start ActiveMQ broker (STOMP)
        # rmohr/activemq:5.15.9 ships a stomp+ws transport connector on
        # :61614 out of the box, mirroring tests/docker/docker-compose.yml.
        run: |
          docker run -d --name restorm-activemq -p 61614:61614 rmohr/activemq:5.15.9

      - name: Start RabbitMQ broker (AMQP)
        # rabbitmq:3-management with the definitions import that seeds the
        # `/` vhost, `guest` user and `restorm-e2e-queue` — mirroring
        # tests/docker/docker-compose.yml (a bare rabbitmq would 403 without
        # it; see rabbitmq.conf for why the default bootstrap is skipped).
        run: |
          cd restorm/tests/docker
          docker run -d --name restorm-rabbitmq -p 5672:5672 -p 15672:15672 \
            -v "$(pwd)/rabbitmq.conf:/etc/rabbitmq/conf.d/10-restorm-e2e.conf:ro" \
            -v "$(pwd)/rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro" \
            rabbitmq:3-management

      - name: Start and seed Kafka broker
        # Single-node KRaft broker, mirroring tests/docker/docker-compose.yml.
        # Polls the broker with the same command the compose healthcheck
        # uses, then runs kafka-seed.sh unmodified INSIDE the broker
        # container (docker cp + exec) — simpler than the compose
        # kafka-seed job's separate --network host container, since
        # localhost:9092 already resolves correctly from inside
        # restorm-kafka itself.
        run: |
          cd restorm/tests/docker
          docker run -d --name restorm-kafka -p 9092:9092 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            apache/kafka:3.7.1
          timeout 90 sh -c 'until docker exec restorm-kafka /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1; do sleep 3; done'
          docker cp kafka-seed.sh restorm-kafka:/kafka-seed.sh
          docker exec restorm-kafka /bin/sh /kafka-seed.sh

      - name: Start git server (git daemon)
        # Unauthenticated `git daemon` on :9418, mirroring
        # tests/docker/docker-compose.yml. Alpine splits `git daemon` into its
        # own `git-daemon` apk package — the base `git` package does not
        # include it. Bind-mounts the SAME repos dir gitServerSeed.ts seeds
        # host-side for local runs; not seeded with a full project here (this
        # job only runs the vitest integration suite, not Playwright e2e —
        # the local pre-push / ship.sh gate) — but DOES `git init --bare` an
        # empty `healthcheck.git` so the wait-for-services check below can do
        # a real `git ls-remote` (protocol-level, not just TCP-open — a cold
        # `apk add` start has the port bound before git-daemon is actually
        # ready to speak the protocol).
        run: |
          cd restorm/tests/docker
          mkdir -p git-server/repos
          git init --bare -b main git-server/repos/healthcheck.git
          # `apk add` runs at container start and is the one network-flaky
          # step — retry it in a loop instead of dying on the first miss.
          docker run -d --name restorm-git-server -p 9418:9418 \
            -v "$(pwd)/git-server/repos:/srv/git" \
            alpine:3.19 \
            sh -c "until apk add --no-cache git-daemon; do echo 'apk retry…'; sleep 2; done && git config --global --add safe.directory '*' && exec git daemon --base-path=/srv/git --export-all --enable=receive-pack --reuseaddr --informative-errors --verbose"
          # Bounded readiness wait + UNCONDITIONAL container log dump: if the
          # daemon still isn't up, the next run's logs say exactly why
          # (apk failure, daemon exit, …) instead of a silent probe timeout.
          for i in $(seq 1 45); do
            if git ls-remote git://localhost:9418/healthcheck.git >/dev/null 2>&1; then
              echo "git daemon ready after $((i*2))s"; break
            fi
            sleep 2
          done
          echo "--- restorm-git-server container logs ---"
          docker logs restorm-git-server 2>&1 | tail -40 || true
          echo "--- container state ---"
          docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' restorm-git-server || true

      - name: Wait for services
        run: |
          cd restorm
          node tests/integration/wait-for-services.js

      - name: Run integration tests
        run: |
          cd restorm
          pnpm run test:integration:coverage
