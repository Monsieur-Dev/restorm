name: Build and Test

# Toggle for the redundant-with-local checks (lint / typecheck / depcheck):
#
#   DEFAULT (unset or 'false'): LIGHT CI — only install, build, and tests run.
#     This is sufficient for normal pushes because the pre-commit hook already
#     enforces lint + typecheck + depcheck locally before any commit lands.
#
#   FULL CI: set the repository variable CI_FULL_CHECKS=true
#     (Settings → Variables → Actions → CI_FULL_CHECKS) to re-enable all steps
#     on every push.  Alternatively, trigger a manual run via
#     Actions → "Build and Test" → Run workflow → check "Run full checks".
#
# Always-on (never gated): install, build, unit tests, integration tests.
# These catch lockfile drift, uncommitted artefacts, and env issues that local
# hooks cannot — they are the green signal that ship.sh --auto merges on.

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      full_checks:
        description: 'Run full checks (lint, typecheck, depcheck) — same as CI_FULL_CHECKS=true'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install electron-core-ui dependencies
        run: |
          cd electron-core-ui
          pnpm install --frozen-lockfile

      - name: Check electron-core-ui unused dependencies
        if: ${{ vars.CI_FULL_CHECKS == 'true' || inputs.full_checks == true }}
        run: |
          cd electron-core-ui
          npx depcheck

      - name: Run electron-core-ui linter (ESLint + Stylelint)
        if: ${{ vars.CI_FULL_CHECKS == 'true' || inputs.full_checks == true }}
        run: |
          cd electron-core-ui
          NODE_OPTIONS="--max-old-space-size=4096" pnpm run lint

      - name: Run electron-core-ui type check
        if: ${{ vars.CI_FULL_CHECKS == 'true' || inputs.full_checks == true }}
        run: |
          cd electron-core-ui
          NODE_OPTIONS="--max-old-space-size=4096" pnpm run typecheck

      - name: Validate theme contrast ratios
        run: |
          cd electron-core-ui
          pnpm run validate:contrast

      - name: Build electron-core-ui
        run: |
          cd electron-core-ui
          pnpm run build

      - name: Install restorm dependencies
        run: |
          cd restorm
          pnpm install --frozen-lockfile

      - name: Check restorm unused dependencies
        if: ${{ vars.CI_FULL_CHECKS == 'true' || inputs.full_checks == true }}
        run: |
          cd restorm
          npx depcheck

      - name: Run restorm linter
        if: ${{ vars.CI_FULL_CHECKS == 'true' || inputs.full_checks == true }}
        run: |
          cd restorm
          NODE_OPTIONS="--max-old-space-size=4096" pnpm run lint

      - name: Run restorm type check
        if: ${{ vars.CI_FULL_CHECKS == 'true' || inputs.full_checks == true }}
        run: |
          cd restorm
          NODE_OPTIONS="--max-old-space-size=4096" pnpm run typecheck

      - name: Run restorm unit and integration tests
        run: |
          cd restorm
          pnpm run test:all

      - name: Build restorm application
        run: |
          cd restorm
          NODE_OPTIONS="--max-old-space-size=4096" pnpm run build

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      petstore:
        image: swaggerapi/petstore
        ports:
          - 8080:8080
      petstore-openapi3:
        # Real OpenAPI 3.0 server. Used by the OpenAPI 3.x importer
        # integration tests to validate URL-based spec fetch +
        # content-sniff routing. Runtime endpoints under `/v3/*`
        # require auth and are not exercised in CI; runtime execution
        # stays on the swaggerapi/petstore mock above.
        image: openapitools/openapi-petstore
        ports:
          - 8081:8080
      graphql:
        image: node:20-alpine
        ports:
          - 4000:4000
      soap:
        image: castlemock/castlemock
        ports:
          - 8090:8080
      grpc:
        image: moul/grpcbin
        ports:
          - 9000:9000
          - 9002:9001

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install electron-core-ui dependencies
        run: |
          cd electron-core-ui
          pnpm install --frozen-lockfile

      - name: Build electron-core-ui
        run: |
          cd electron-core-ui
          pnpm run build

      - name: Install restorm dependencies
        run: |
          cd restorm
          pnpm install --frozen-lockfile

      - name: Start GraphQL, Socket.IO, raw-WebSocket, HTTP-util and SOAP mock servers
        run: |
          cd restorm/tests/docker/graphql-server && npm install && node server.js &
          cd restorm/tests/docker/socketio-server && npm install && node server.js &
          cd restorm/tests/docker/ws-echo-server && npm install && node server.js &
          # http-util and soap-server are zero-dependency (pure node:http) — no npm install needed.
          cd restorm/tests/docker/http-util && node server.js &
          cd restorm/tests/docker/soap-server && node server.js &
          sleep 10

      - name: Start OData Pet Store
        # AspNetCoreOData service isn't on a public registry so we
        # build it from tests/docker/odata-petstore/ on the fly and
        # run it as a detached container alongside the services
        # above. Port 5100 is what wait-for-services + the restorm
        # tests expect.
        run: |
          cd restorm/tests/docker/odata-petstore
          docker build -t restorm-odata-petstore .
          docker run -d --name restorm-odata-petstore -p 5100:5100 restorm-odata-petstore

      - name: Start Auth Service
        # Same pattern as odata-petstore — .NET 9 minimal-API container
        # built on the fly, exposing :5110. Drives the `auth-login` e2e
        # suite (POST /login, GET /pet/{id}, GET /swagger.json).
        run: |
          cd restorm/tests/docker/auth-service
          docker build -t restorm-auth-service .
          docker run -d --name restorm-auth-service -p 5110:5110 restorm-auth-service

      - name: Start MQTT broker (Mosquitto)
        # eclipse-mosquitto:2 on :1883, mirroring tests/docker/docker-compose.yml.
        # allow_anonymous=true + a pre-hashed passwd file (restorm/restorm) drive
        # the MQTT publish/subscribe + auth integration tests.
        run: |
          cd restorm/tests/docker
          docker run -d --name restorm-mqtt -p 1883:1883 \
            -v "$(pwd)/mosquitto.conf:/mosquitto/config/mosquitto.conf" \
            -v "$(pwd)/mosquitto-passwd:/mosquitto/config/passwd:ro" \
            eclipse-mosquitto:2

      - name: Wait for services
        run: |
          cd restorm
          node tests/integration/wait-for-services.js

      - name: Run integration tests
        run: |
          cd restorm
          pnpm run test:integration:coverage
