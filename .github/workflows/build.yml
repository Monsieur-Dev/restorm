name: Build and Test

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      
      - name: Install electron-core-ui dependencies
        run: |
          cd electron-core-ui
          pnpm install --frozen-lockfile
      
      - name: Check electron-core-ui unused dependencies
        run: |
          cd electron-core-ui
          npx depcheck
      
      - name: Run electron-core-ui linter (ESLint + Stylelint)
        run: |
          cd electron-core-ui
          pnpm run lint
      
      - name: Run electron-core-ui type check
        run: |
          cd electron-core-ui
          pnpm run typecheck
      
      - name: Validate theme contrast ratios
        run: |
          cd electron-core-ui
          pnpm run validate:contrast
      
      - name: Build electron-core-ui
        run: |
          cd electron-core-ui
          pnpm run build

      - name: Install restorm dependencies
        run: |
          cd restorm
          pnpm install --frozen-lockfile

      - name: Check restorm unused dependencies
        run: |
          cd restorm
          npx depcheck

      - name: Run restorm linter
        run: |
          cd restorm
          pnpm run lint

      - name: Run restorm type check
        run: |
          cd restorm
          pnpm run typecheck

      - name: Run restorm unit and integration tests
        run: |
          cd restorm
          pnpm run test:all

      - name: Build restorm application
        run: |
          cd restorm
          NODE_OPTIONS="--max-old-space-size=4096" pnpm run build

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    
    services:
      petstore:
        image: swaggerapi/petstore
        ports:
          - 8080:8080
      petstore-openapi3:
        # Real OpenAPI 3.0 server. Used by the OpenAPI 3.x importer
        # integration tests to validate URL-based spec fetch +
        # content-sniff routing. Runtime endpoints under `/v3/*`
        # require auth and are not exercised in CI; runtime execution
        # stays on the swaggerapi/petstore mock above.
        image: openapitools/openapi-petstore
        ports:
          - 8081:8080
      graphql:
        image: node:20-alpine
        ports:
          - 4000:4000
      soap:
        image: castlemock/castlemock
        ports:
          - 8090:8080
      grpc:
        image: moul/grpcbin
        ports:
          - 9000:9000
          - 9002:9001
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install electron-core-ui dependencies
        run: |
          cd electron-core-ui
          pnpm install --frozen-lockfile

      - name: Build electron-core-ui
        run: |
          cd electron-core-ui
          pnpm run build

      - name: Install restorm dependencies
        run: |
          cd restorm
          pnpm install --frozen-lockfile

      - name: Start GraphQL and Socket.IO servers
        run: |
          cd restorm/tests/docker/graphql-server && npm install && node server.js &
          cd restorm/tests/docker/socketio-server && npm install && node server.js &
          sleep 10

      - name: Start OData Pet Store
        # AspNetCoreOData service isn't on a public registry so we
        # build it from tests/docker/odata-petstore/ on the fly and
        # run it as a detached container alongside the services
        # above. Port 5100 is what wait-for-services + the restorm
        # tests expect.
        run: |
          cd restorm/tests/docker/odata-petstore
          docker build -t restorm-odata-petstore .
          docker run -d --name restorm-odata-petstore -p 5100:5100 restorm-odata-petstore

      - name: Start Auth Service
        # Same pattern as odata-petstore — .NET 9 minimal-API container
        # built on the fly, exposing :5110. Drives the `auth-login` e2e
        # suite (POST /login, GET /pet/{id}, GET /swagger.json).
        run: |
          cd restorm/tests/docker/auth-service
          docker build -t restorm-auth-service .
          docker run -d --name restorm-auth-service -p 5110:5110 restorm-auth-service

      - name: Wait for services
        run: |
          cd restorm
          node tests/integration/wait-for-services.js

      - name: Run integration tests
        run: |
          cd restorm
          pnpm run test:integration:coverage
