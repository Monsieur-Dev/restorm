name: Build and Test

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install electron-core-ui dependencies
        run: |
          cd electron-core-ui
          npm install
      
      - name: Run electron-core-ui linter (ESLint + Stylelint)
        run: |
          cd electron-core-ui
          npm run lint
      
      - name: Run electron-core-ui type check
        run: |
          cd electron-core-ui
          npm run typecheck
      
      - name: Validate theme contrast ratios
        run: |
          cd electron-core-ui
          npm run validate:contrast
      
      - name: Build electron-core-ui
        run: |
          cd electron-core-ui
          npm run build
      
      - name: Install gitable dependencies
        run: |
          cd gitable
          npm install
      
      - name: Run linter
        run: |
          cd gitable
          npm run lint
      
      - name: Run type check
        run: |
          cd gitable
          npm run typecheck
      
      - name: Build gitable application
        run: |
          cd gitable
          npm run build
