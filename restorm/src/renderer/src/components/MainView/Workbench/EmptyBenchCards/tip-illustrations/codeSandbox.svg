<svg viewBox="0 0 220 150" xmlns="http://www.w3.org/2000/svg" class="empty-bench-tip-illustration" role="img" aria-hidden="true">
  <style>
    .cs-panel { fill: #1e293b; stroke: #475569; stroke-width: 2; }
    .cs-glyph { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .cs-kw { fill: #22c55e; }
    .cs-str { fill: #f59e0b; }
    .cs-num { fill: #64748b; }

    .cs-l1 { transform-box: fill-box; transform-origin: left center; animation: cs-type1 4s ease-in-out infinite; animation-play-state: paused; }
    .cs-l2 { transform-box: fill-box; transform-origin: left center; animation: cs-type2 4s ease-in-out infinite; animation-play-state: paused; }
    .cs-l3 { transform-box: fill-box; transform-origin: left center; animation: cs-type3 4s ease-in-out infinite; animation-play-state: paused; }
    @keyframes cs-type1 { 0%,5% { transform: scaleX(0); } 20%,100% { transform: scaleX(1); } }
    @keyframes cs-type2 { 0%,25% { transform: scaleX(0); } 45%,100% { transform: scaleX(1); } }
    @keyframes cs-type3 { 0%,50% { transform: scaleX(0); } 72%,100% { transform: scaleX(1); } }

    .cs-caret { fill: #22c55e; animation: cs-blink 1s steps(2,start) infinite; animation-play-state: paused; }
    @keyframes cs-blink { 50% { opacity: 0; } }

    /* protective sandbox shield/bubble */
    .cs-shield { fill: #22c55e; fill-opacity: 0.07; stroke: #22c55e; stroke-width: 2; filter: drop-shadow(0 0 4px #22c55e); animation: cs-pulse 4s ease-in-out infinite; animation-play-state: paused; }
    @keyframes cs-pulse { 0%,100% { fill-opacity: 0.05; stroke-opacity: 0.55; } 50% { fill-opacity: 0.12; stroke-opacity: 1; } }

    /* yellow beam lapping the code box border (like the app's running beam) */
    .cs-beam { fill: none; stroke: #facc15; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 24 76; filter: drop-shadow(0 0 3px #facc15); animation: cs-beam 4s linear infinite; animation-play-state: paused; }
    @keyframes cs-beam { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -100; } }

    /* a forbidden file/secret tries to reach the code, hits the shield and is
       repelled — the prohibition (⊘) flashes at each impact. */
    .cs-file { transform-box: fill-box; transform-origin: center; animation: cs-file 4s ease-in-out infinite; animation-play-state: paused; }
    @keyframes cs-file {
      0%        { transform: translate(26px,0); opacity: 0; }
      14%       { transform: translate(2px,0);  opacity: 1; }
      36%       { transform: translate(-12px,0); opacity: 1; }   /* hits shield */
      44%       { transform: translate(-5px,0);  opacity: 1; }   /* bounces back */
      58%       { transform: translate(-12px,0); opacity: 1; }   /* hits again */
      66%       { transform: translate(30px,0);  opacity: 1; }   /* recoils away */
      76%,100%  { transform: translate(30px,0);  opacity: 0; }
    }
    .cs-no { transform-box: fill-box; transform-origin: center; opacity: 0; animation: cs-no 4s ease-in-out infinite; animation-play-state: paused; }
    @keyframes cs-no {
      0%,34%   { opacity: 0; transform: scale(0.5); }
      38%      { opacity: 1; transform: scale(1); }
      45%      { opacity: 0; transform: scale(1); }
      57%      { opacity: 0; transform: scale(0.5); }
      61%      { opacity: 1; transform: scale(1); }
      67%,100% { opacity: 0; transform: scale(1); }
    }
  </style>

  <!-- protective sandbox shield/bubble -->
  <path class="cs-shield" d="M110 14 L176 32 V78 C176 110 146 128 110 140 C74 128 44 110 44 78 V32 Z" />

  <!-- scenario code box -->
  <rect class="cs-panel" x="64" y="44" width="92" height="64" rx="7" />

  <!-- </> glyph -->
  <path class="cs-glyph" d="M77 56 L72 62 L77 68" />
  <path class="cs-glyph" d="M89 56 L94 62 L89 68" />
  <line class="cs-glyph" x1="85" y1="55" x2="81" y2="69" />

  <!-- code lines (type-in) -->
  <rect class="cs-l1 cs-kw"  x="72" y="78"  width="20" height="4" rx="2" />
  <rect class="cs-l1 cs-line" x="95" y="78"  width="40" height="4" rx="2" fill="#94a3b8" />
  <rect class="cs-l2 cs-str" x="78" y="88"  width="30" height="4" rx="2" />
  <rect class="cs-l2 cs-line" x="111" y="88" width="20" height="4" rx="2" fill="#94a3b8" />
  <rect class="cs-l3 cs-num" x="78" y="98"  width="16" height="4" rx="2" />
  <rect class="cs-l3 cs-line" x="97" y="98"  width="28" height="4" rx="2" fill="#94a3b8" />

  <!-- blinking caret -->
  <rect class="cs-caret" x="129" y="97" width="3" height="6" rx="1" />

  <!-- yellow beam around the code box -->
  <rect class="cs-beam" x="64" y="44" width="92" height="64" rx="7" pathLength="100" />

  <!-- a forbidden red file bouncing off the shield + prohibition flash -->
  <g class="cs-file">
    <!-- document body -->
    <path d="M183 55 h9 l5 5 v14 a0 0 0 0 1 0 0 h-14 a0 0 0 0 1 0 0 Z"
          fill="#ef4444" fill-opacity="0.16" stroke="#ef4444" stroke-width="1.5" stroke-linejoin="round" />
    <path d="M192 55 v5 h5" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linejoin="round" />
    <line x1="186" y1="64" x2="194" y2="64" stroke="#ef4444" stroke-width="1.3" />
    <line x1="186" y1="68" x2="194" y2="68" stroke="#ef4444" stroke-width="1.3" />
    <line x1="186" y1="72" x2="191" y2="72" stroke="#ef4444" stroke-width="1.3" />
  </g>
  <!-- prohibition sign flashing on each impact, at the shield contact point -->
  <g class="cs-no">
    <circle cx="178" cy="64" r="9" fill="none" stroke="#ef4444" stroke-width="2" />
    <line x1="171.6" y1="57.6" x2="184.4" y2="70.4" stroke="#ef4444" stroke-width="2" />
  </g>
</svg>
