<svg viewBox="0 0 220 150" xmlns="http://www.w3.org/2000/svg" class="empty-bench-tip-illustration" role="img" aria-hidden="true">
  <style>
    .mt-tab {
      fill: #c5c5c5;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linejoin: round;
    }

    .mt-page-and-tab {
      fill: var(--editor-background, #1e1e1e);
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linejoin: round;
    }

    .mt-modal {
      fill: var(--editor-background, #1e1e1e);
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linejoin: round;
    }
    .mt-modal-bar {
      fill: currentColor;
      opacity: 0.32;
    }
    .mt-modal-bar--title {
      opacity: 0.75;
    }

    .mt-pointer {
      fill: currentColor;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linejoin: round;
    }
    .mt-sparkle {
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
      opacity: 0;
    }

    .mt-modal-group {
      transform-box: fill-box;
      transform-origin: 50% 50%;
    }

    .mt-pointer-group,
    .mt-modal-group,
    .mt-sparkle {
      animation-duration: 6s;
      animation-iteration-count: infinite;
      animation-fill-mode: both;
      animation-play-state: paused;
    }
    .mt-pointer-group { animation-name: mt-pointer-move; animation-timing-function: ease-in-out; }
    .mt-modal-group   { animation-name: mt-modal-show; animation-timing-function: ease-out; }
    .mt-sparkle       { animation-name: mt-burst; animation-timing-function: linear; }

    @keyframes mt-pointer-move {
      0%   { transform: translate(170px, 95px); opacity: 0; }
      4%   { opacity: 1; }
      14%  { transform: translate(44px, 25px); opacity: 1; }
      78%  { transform: translate(44px, 25px); opacity: 1; }
      92%  { transform: translate(44px, 25px); opacity: 0; }
      100% { transform: translate(170px, 95px); opacity: 0; }
    }
    @keyframes mt-modal-show {
      0%, 32% {
        opacity: 0;
        transform: translateY(10px) scale(0.92);
      }
      45% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      78% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      92% {
        opacity: 0;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(10px) scale(0.92);
      }
    }
    @keyframes mt-burst {
      0%, 14% {
        opacity: 0;
        transform: translate(var(--mt-nx), var(--mt-ny));
      }
      17% {
        opacity: 1;
        transform: translate(0, 0);
      }
      21% {
        opacity: 0;
        transform: translate(calc(var(--mt-nx) * -0.6), calc(var(--mt-ny) * -0.6));
      }
      23% {
        opacity: 0;
        transform: translate(var(--mt-nx), var(--mt-ny));
      }
      26% {
        opacity: 1;
        transform: translate(0, 0);
      }
      30% {
        opacity: 0;
        transform: translate(calc(var(--mt-nx) * -0.6), calc(var(--mt-ny) * -0.6));
      }
      31%, 100% {
        opacity: 0;
      }
    }
  </style>

  <!-- Layer 1: inactive tabs (back). Paths instead of rects so only
       the TOP corners are rounded; the bottoms sit flush against
       the page body. Tabs are touching (no gap). -->
  <path class="mt-tab" d="M 78 16 L 106 16 A 10 10 0 0 1 116 26 L 116 40 L 68 40 L 68 26 A 10 10 0 0 1 78 16 Z" />
  <path class="mt-tab" d="M 126 16 L 154 16 A 10 10 0 0 1 164 26 L 164 40 L 116 40 L 116 26 A 10 10 0 0 1 126 16 Z" />

  <!-- Layer 2: merged active tab + page body silhouette. The tab's
       bottom-left and the body's top-left both share x=20 so the
       join is a straight line on the left (no rounding at the
       merge point). -->
  <path
    class="mt-page-and-tab"
    d="M 30 14 L 58 14 A 10 10 0 0 1 68 24 L 68 36 L 188 36 A 12 12 0 0 1 200 48 L 200 122 A 12 12 0 0 1 188 134 L 32 134 A 12 12 0 0 1 20 122 L 20 24 A 10 10 0 0 1 30 14 Z"
  />

  <!-- Layer 3: modal (covers tabs + page, except the cursor) -->
  <g class="mt-modal-group">
    <rect class="mt-modal" x="12" y="10" width="196" height="130" rx="16" />
    <rect class="mt-modal-bar mt-modal-bar--title" x="30" y="28" width="68" height="7" rx="3.5" />
    <rect class="mt-modal-bar" x="30" y="48" width="156" height="5" rx="2.5" />
    <rect class="mt-modal-bar" x="30" y="62" width="124" height="5" rx="2.5" />
    <rect class="mt-modal-bar" x="30" y="76" width="166" height="5" rx="2.5" />
    <rect class="mt-modal-bar" x="30" y="90" width="100" height="5" rx="2.5" />
    <rect class="mt-modal-bar" x="30" y="104" width="148" height="5" rx="2.5" />
    <rect class="mt-modal-bar" x="30" y="118" width="80" height="5" rx="2.5" />
  </g>

  <!-- Layer 4: pointer + click ripple (always on top) -->
  <g class="mt-pointer-group">
    <line class="mt-sparkle" x1="-2" y1="-3" x2="-8" y2="-10" style="--mt-nx: 4px; --mt-ny: 5px" />
    <line class="mt-sparkle" x1="-4" y1="-1" x2="-12" y2="-2" style="--mt-nx: 6px; --mt-ny: 1px" />
    <line class="mt-sparkle" x1="-1" y1="-4" x2="-2" y2="-12" style="--mt-nx: 1px; --mt-ny: 6px" />
    <line class="mt-sparkle" x1="2" y1="-4" x2="4" y2="-11" style="--mt-nx: -2px; --mt-ny: 6px" />
    <line class="mt-sparkle" x1="-3" y1="2" x2="-10" y2="6" style="--mt-nx: 5px; --mt-ny: -3px" />
    <line class="mt-sparkle" x1="5" y1="-2" x2="11" y2="-6" style="--mt-nx: -4px; --mt-ny: 3px" />
    <path class="mt-pointer" d="M 0 0 L 0 17 L 4.5 12.5 L 7.5 19 L 10 18 L 7.2 11.5 L 13 11.5 Z" />
  </g>
</svg>
