<svg viewBox="0 0 220 150" xmlns="http://www.w3.org/2000/svg" class="empty-bench-tip-illustration" role="img" aria-hidden="true">
  <style>
    .ci-term { fill: #0f172a; stroke: #475569; stroke-width: 2; }
    .ci-titlebar { fill: #1e293b; }
    .ci-dot { fill: #475569; }
    .ci-close { fill: none; stroke: #94a3b8; stroke-width: 1.6; stroke-linecap: round; }
    .ci-prompt { fill: #22c55e; font-family: monospace; }
    .ci-cmdbar { fill: #94a3b8; }
    .ci-caret {
      fill: #94a3b8;
      animation: ci-blink 1s steps(1) infinite;
      animation-play-state: paused;
    }
    .ci-badge { fill: #1e293b; stroke: #475569; stroke-width: 1.6; }
    .ci-badge-bar { fill: #22c55e; opacity: 0.85; }
    .ci-badge-bar2 { fill: #94a3b8; }
    .ci-beam {
      fill: none;
      stroke: #facc15;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 22 78;
      filter: drop-shadow(0 0 3px #facc15);
      animation: ci-beam-travel 4.2s linear infinite;
      animation-play-state: paused;
    }
    /* Circle + check scale together as ONE unit from their shared centre — a
       clean grow (animating the mark separately made it drift / distort). */
    .ci-check {
      transform-box: fill-box;
      transform-origin: center;
      animation: ci-check-pop 4.2s ease-out infinite;
      animation-play-state: paused;
    }
    .ci-check-circle { fill: #22c55e; filter: drop-shadow(0 0 4px #22c55e); }
    .ci-check-mark { fill: none; stroke: #ffffff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    @keyframes ci-blink { 50% { opacity: 0; } }
    @keyframes ci-beam-travel {
      0%   { stroke-dashoffset: 0; opacity: 1; }
      72%  { stroke-dashoffset: -100; opacity: 1; }
      80%  { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes ci-check-pop {
      0%, 70%   { opacity: 0; transform: scale(0.2); }
      80%       { opacity: 1; transform: scale(1.15); }
      88%, 100% { opacity: 1; transform: scale(1); }
    }
  </style>

  <!-- terminal window -->
  <rect class="ci-term" x="14" y="20" width="192" height="110" rx="9" />
  <path class="ci-titlebar" d="M14 29 a9 9 0 0 1 9 -9 h174 a9 9 0 0 1 9 9 v9 h-192 z" />
  <circle class="ci-dot" cx="26" cy="29" r="2.6" />
  <circle class="ci-dot" cx="35" cy="29" r="2.6" />
  <circle class="ci-dot" cx="44" cy="29" r="2.6" />
  <path class="ci-close" d="M192 25 l7 7 M199 25 l-7 7" />

  <!-- prompt line -->
  <text class="ci-prompt" x="24" y="55" font-size="11">$</text>
  <rect class="ci-cmdbar" x="34" y="49" width="78" height="6" rx="3" opacity="0.8" />
  <rect class="ci-caret" x="116" y="48" width="6" height="8" rx="1" />

  <!-- scenario badge running headless inside the terminal -->
  <g>
    <rect class="ci-badge" x="62" y="78" width="96" height="36" rx="8" />
    <rect class="ci-badge-bar" x="72" y="88" width="14" height="6" rx="3" />
    <rect class="ci-badge-bar2" x="72" y="99" width="56" height="5" rx="2.5" />
    <rect class="ci-beam" x="62" y="78" width="96" height="36" rx="8" pathLength="100" />

    <!-- success check (pops after the laps) -->
    <g class="ci-check">
      <circle class="ci-check-circle" cx="142" cy="96" r="11" />
      <path class="ci-check-mark" d="M136.5 96 l4 4 l7 -8" />
    </g>
  </g>
</svg>
