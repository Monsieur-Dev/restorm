<svg viewBox="0 0 220 150" xmlns="http://www.w3.org/2000/svg" class="empty-bench-tip-illustration" role="img" aria-hidden="true">
  <style>
    .fp-disc { fill: #0f172a; }
    .fp-kirby-body { fill: #ffb7c5; stroke: #ff9bb3; stroke-width: 2; }
    .fp-kirby-foot { fill: #ff6f91; }
    .fp-kirby-arm { fill: #ff9bb3; }
    .fp-kirby-cheek { fill: #ff7a9c; opacity: 0.85; animation: fp-cheek-pulse 3s ease-in-out infinite; animation-play-state: paused; }
    .fp-kirby-eye { fill: #2a2235; }
    .fp-kirby-eye-shine { fill: #ffffff; }
    .fp-kirby-mouth { fill: #b03a5b; animation: fp-mouth-pulse 3.6s ease-in-out infinite; animation-play-state: paused; transform-box: fill-box; transform-origin: center; }

    /* The two brand logos (real Simple Icons glyphs) get inhaled in turn:
       Postman first, then Bruno (half-cycle offset via animation-delay). */
    /* Both logos share one 3.6s cycle with NO animation-delay (delays caused a
       first-loop sync glitch). The schedule is baked into two keyframes:
       Postman is inhaled over 0–45%, Bruno over 50–95%, each invisible the rest
       of the time — so they never overlap and the first loop is already clean. */
    /* Base opacity 0: even a pre-animation paint frame (before the engine
       applies the first keyframe) is invisible — the keyframes are the ONLY
       thing that ever reveals a logo, during its active window. Kills the
       first-frame flash regardless of fill-mode / pause-resume timing. */
    .fp-logo { transform-box: fill-box; transform-origin: center; opacity: 0; animation-duration: 3.6s; animation-timing-function: ease-in; animation-iteration-count: infinite; animation-fill-mode: backwards; animation-play-state: paused; }
    .fp-logo--pm { animation-name: fp-suck-pm; }
    .fp-logo--bruno { animation-name: fp-suck-bruno; }
    .fp-pm-glyph { fill: #ff6c37; }
    .fp-bruno-glyph { fill: #f4aa41; }

    @keyframes fp-suck-pm {
      0%   { transform: translate(0px, 0px) scale(1);       opacity: 0; }
      4%   { transform: translate(0px, 0px) scale(1);       opacity: 1; }
      33%  { transform: translate(104px, 14px) scale(0.42); opacity: 1; }
      42%  { transform: translate(122px, 16px) scale(0.08); opacity: 0.5; }
      45%, 100% { transform: translate(124px, 16px) scale(0); opacity: 0; }
    }
    @keyframes fp-suck-bruno {
      0%, 50% { transform: translate(0px, 0px) scale(1);    opacity: 0; }
      54%  { transform: translate(0px, 0px) scale(1);       opacity: 1; }
      83%  { transform: translate(104px, 14px) scale(0.42); opacity: 1; }
      92%  { transform: translate(122px, 16px) scale(0.08); opacity: 0.5; }
      95%, 100% { transform: translate(124px, 16px) scale(0); opacity: 0; }
    }
    @keyframes fp-mouth-pulse {
      0%, 100% { transform: scale(1, 1); }
      45%      { transform: scale(1.18, 1.28); }
    }
    @keyframes fp-cheek-pulse {
      0%, 100% { opacity: 0.55; }
      45%      { opacity: 0.95; }
    }
  </style>

  <circle class="fp-disc" cx="110" cy="75" r="68" />

  <!-- Kirby on the right -->
  <g>
    <!-- feet -->
    <ellipse class="fp-kirby-foot" cx="138" cy="112" rx="13" ry="8" transform="rotate(-18 138 112)" />
    <ellipse class="fp-kirby-foot" cx="166" cy="112" rx="13" ry="8" transform="rotate(18 166 112)" />
    <!-- body -->
    <circle class="fp-kirby-body" cx="152" cy="78" r="34" />
    <!-- arm -->
    <ellipse class="fp-kirby-arm" cx="123" cy="84" rx="11" ry="8" transform="rotate(-30 123 84)" />
    <!-- cheeks (raised to the top-of-mouth level, flanking the mouth) -->
    <ellipse class="fp-kirby-cheek" cx="135" cy="77" rx="6" ry="3.5" />
    <ellipse class="fp-kirby-cheek" cx="165" cy="77" rx="6" ry="3.5" />
    <!-- eyes -->
    <ellipse class="fp-kirby-eye" cx="142" cy="66" rx="4" ry="8" />
    <ellipse class="fp-kirby-eye" cx="158" cy="66" rx="4" ry="8" />
    <circle class="fp-kirby-eye-shine" cx="141" cy="62" r="1.6" />
    <circle class="fp-kirby-eye-shine" cx="157" cy="62" r="1.6" />
    <!-- open mouth, centred between the two eyes -->
    <ellipse class="fp-kirby-mouth" cx="150" cy="84" rx="7" ry="9" />
  </g>

  <!-- Postman logo (Simple Icons glyph), inhaled first. Drawn at rest on the
       left; the 24×24 path is scaled ~1.2× and positioned, the suck animation
       carries it into Kirby's mouth. -->
  <g class="fp-logo fp-logo--pm">
    <g transform="translate(14 56) scale(1.2)">
      <path class="fp-pm-glyph" d="M13.527.099C6.955-.744.942 3.9.099 10.473c-.843 6.572 3.8 12.584 10.373 13.428 6.573.843 12.587-3.801 13.428-10.374C24.744 6.955 20.101.943 13.527.099zm2.471 7.485a.855.855 0 0 0-.593.25l-4.453 4.453-.307-.307-.643-.643c4.389-4.376 5.18-4.418 5.996-3.753zm-4.863 4.861l4.44-4.44a.62.62 0 1 1 .847.903l-4.699 4.125-.588-.588zm.33.694l-1.1.238a.06.06 0 0 1-.067-.032.06.06 0 0 1 .01-.073l.645-.645.512.512zm-2.803-.459l1.172-1.172.879.878-1.979.426a.074.074 0 0 1-.085-.039.072.072 0 0 1 .013-.093zm-3.646 6.058a.076.076 0 0 1-.069-.083.077.077 0 0 1 .022-.046h.002l.946-.946 1.222 1.222-2.123-.147zm2.425-1.256a.228.228 0 0 0-.117.256l.203.865a.125.125 0 0 1-.211.117h-.003l-.934-.934-.294-.295 3.762-3.758 1.82-.393.874.874c-1.255 1.102-2.971 2.201-5.1 3.268zm5.279-3.428h-.002l-.839-.839 4.699-4.125a.952.952 0 0 0 .119-.127c-.148 1.345-2.029 3.245-3.977 5.091zm3.657-6.46l-.003-.002a1.822 1.822 0 0 1 2.459-2.684l-1.61 1.613a.119.119 0 0 0 0 .169l1.247 1.247a1.817 1.817 0 0 1-2.093-.343zm2.578 0a1.714 1.714 0 0 1-.271.218h-.001l-1.207-1.207 1.533-1.533c.661.72.637 1.832-.054 2.522zM18.855 6.05a.143.143 0 0 0-.053.157.416.416 0 0 1-.053.45.14.14 0 0 0 .023.197.141.141 0 0 0 .084.03.14.14 0 0 0 .106-.05.691.691 0 0 0 .087-.751.138.138 0 0 0-.194-.033z"/>
    </g>
  </g>

  <!-- Bruno logo (Simple Icons glyph), inhaled second. -->
  <g class="fp-logo fp-logo--bruno">
    <g transform="translate(14 56) scale(1.2)">
      <path class="fp-bruno-glyph" d="M9.394 9.583s-.742.511-1.13.275c-.387-.236-.51-.742-.274-1.129.236-.388.742-.511 1.129-.275.388.236.275 1.129.275 1.129m1.48 3.245-.308.82.582.24c.04-.224.254-.372.477-.332.224.041.372.254.332.478-.093.515-.638.813-1.122.613l-.95-.391a.41.41 0 0 1-.228-.524l.448-1.193c.12-.32.426-.533.769-.533h2.525l.239.036c.076.023.148.057.214.101a.817.817 0 0 1 .303.363l.476 1.12c.083.197.002.425-.187.524l-.896.471c-.505.266-1.121-.053-1.196-.62a.411.411 0 0 1 .353-.461.411.411 0 0 1 .461.353l.56-.294-.327-.771zM9.353 17.98c-.959-.514-2.183-1.54-1.961-3.22.029-.225.236-.383.461-.354.225.03.383.236.353.461-.167 1.272.822 2.009 1.546 2.395.348.185.771.151 1.081-.092l.903-.708v-1.045c0-.226.184-.41.411-.41s.411.184.411.41v1.045l.903.708c.19.15.423.22.655.209a.45.45 0 0 1 .074-.019.42.42 0 0 1 .093-.003c.089-.02.176-.051.259-.095.724-.386 1.713-1.123 1.546-2.395a.411.411 0 0 1 .353-.461c.225-.029.432.129.461.354.223 1.688-1.013 2.716-1.974 3.227-.072.038-.145.071-.22.099.148 1.424-.14 2.562-.449 3.24-.169.37-.355.617-.49.732-.194.167-.517.305-.933.366-.531.078-1.227.039-1.945-.182-.576-.177-.973-.686-1.208-1.343-.362-1.009-.352-2.368-.33-2.919m4.54.213a1.81 1.81 0 0 1-.939-.376l-.807-.633-.807.633c-.341.268-.758.397-1.173.384-.012.453-.001 1.219.15 1.922.072.333.174.652.329.908.122.2.275.361.486.425.586.18 1.152.218 1.585.155.227-.033.412-.086.518-.176.115-.099.259-.363.395-.744.213-.597.367-1.46.263-2.498m-8.683-.955-.191.402c-.384.81-1.475.955-2.053.27-.81-.961-1.948-2.505-2.548-4.068-.427-1.115-.576-2.241-.213-3.198C2.894 3.559 6.247 2.969 6.98 2.928c1.34-.865 5.583-2.807 10.424.342.795-.051 4.042.203 6.424 7.252.325.961.162 2.081-.263 3.186-.599 1.557-1.709 3.088-2.5 4.046-.574.695-1.675.553-2.061-.262l-.133-.28c-.219.369-.524.832-.901 1.281-.57.679-1.306 1.32-2.154 1.598a.412.412 0 0 1-.519-.263.4114.4114 0 0 1 .263-.518c.705-.231 1.306-.78 1.781-1.345.556-.662.938-1.355 1.097-1.666l-.245-.518c-.126-.264-.154-.56-.078-.842.246-.924.981-4.015