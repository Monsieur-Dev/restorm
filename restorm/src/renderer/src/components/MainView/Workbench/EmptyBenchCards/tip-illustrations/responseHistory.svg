<svg viewBox="0 0 220 150" xmlns="http://www.w3.org/2000/svg" class="empty-bench-tip-illustration" role="img" aria-hidden="true">
  <style>
    .rh-pane {
      fill: var(--editor-background, #1e1e1e);
      stroke: currentColor;
      stroke-width: 1.2;
      stroke-linejoin: round;
    }
    .rh-row { fill: transparent; }
    .rh-row-hover { fill: #374151; }

    .rh-dot--ok  { fill: #22c55e; }
    .rh-dot--ko  { fill: #ef4444; }
    .rh-method--get    { fill: #16a34a; }
    .rh-method--post   { fill: #2563eb; }
    .rh-method--put    { fill: #f59e0b; }
    .rh-method--delete { fill: #ef4444; }

    .rh-text {
      stroke: currentColor;
      stroke-width: 2.6;
      stroke-linecap: round;
      opacity: 0.4;
    }
    .rh-text--strong { opacity: 0.7; }
    .rh-status--ok { fill: #22c55e; }
    .rh-status--ko { fill: #ef4444; }

    .rh-pointer {
      fill: currentColor;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linejoin: round;
    }
    .rh-sparkle {
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
      opacity: 0;
    }

    .rh-anim {
      animation-duration: 15s;
      animation-iteration-count: infinite;
      animation-fill-mode: both;
      animation-play-state: paused;
    }
    .rh-row-hover--1, .rh-detail--1 { animation-name: rh-step-1; opacity: 0; }
    .rh-row-hover--2, .rh-detail--2 { animation-name: rh-step-2; opacity: 0; }
    .rh-row-hover--3, .rh-detail--3 { animation-name: rh-step-3; opacity: 0; }
    .rh-pointer-group               { animation-name: rh-pointer-move; opacity: 0; animation-timing-function: ease-in-out; }
    .rh-sparkle                     { animation-name: rh-burst;        animation-timing-function: linear; }

    /* Each step (selecting the matching row) reveals its detail
       pane and keeps it visible until the next click. */
    @keyframes rh-step-1 {
      0%, 17%   { opacity: 0; }
      19%, 39%  { opacity: 1; }
      41%, 100% { opacity: 0; }
    }
    @keyframes rh-step-2 {
      0%, 42%   { opacity: 0; }
      44%, 64%  { opacity: 1; }
      66%, 100% { opacity: 0; }
    }
    @keyframes rh-step-3 {
      0%, 67%   { opacity: 0; }
      69%, 95%  { opacity: 1; }
      97%, 100% { opacity: 0; }
    }

    @keyframes rh-pointer-move {
      0%, 9%   { opacity: 0; transform: translate(110px, 130px); }
      12%      { opacity: 1; transform: translate(110px, 130px); }
      17%      { opacity: 1; transform: translate(40px, 24px); }
      22%      { opacity: 0; transform: translate(40px, 24px); }
      37%      { opacity: 0; transform: translate(40px, 24px); }
      40%      { opacity: 1; transform: translate(40px, 48px); }
      45%      { opacity: 0; transform: translate(40px, 48px); }
      62%      { opacity: 0; transform: translate(40px, 48px); }
      65%      { opacity: 1; transform: translate(40px, 72px); }
      70%      { opacity: 0; transform: translate(40px, 72px); }
      100%     { opacity: 0; }
    }
    @keyframes rh-burst {
      0%, 18%  { opacity: 0; transform: translate(var(--rh-nx), var(--rh-ny)); }
      20%      { opacity: 1; transform: translate(0, 0); }
      22%      { opacity: 0; transform: translate(calc(var(--rh-nx) * -0.6), calc(var(--rh-ny) * -0.6)); }
      23%, 41% { opacity: 0; transform: translate(var(--rh-nx), var(--rh-ny)); }
      43%      { opacity: 1; transform: translate(0, 0); }
      45%      { opacity: 0; transform: translate(calc(var(--rh-nx) * -0.6), calc(var(--rh-ny) * -0.6)); }
      46%, 66% { opacity: 0; transform: translate(var(--rh-nx), var(--rh-ny)); }
      68%      { opacity: 1; transform: translate(0, 0); }
      70%      { opacity: 0; transform: translate(calc(var(--rh-nx) * -0.6), calc(var(--rh-ny) * -0.6)); }
      71%, 100% { opacity: 0; }
    }
  </style>

  <!-- Left pane background -->
  <rect class="rh-pane" x="10" y="10" width="76" height="130" rx="6" />
  <!-- Right pane background -->
  <rect class="rh-pane" x="90" y="10" width="120" height="130" rx="6" />

  <!-- ============ Left list — 5 history rows ============ -->
  <!-- Row 1 — GET, 200 -->
  <rect class="rh-row-hover rh-row-hover--1 rh-anim" x="12" y="14" width="72" height="20" rx="3" />
  <circle class="rh-dot--ok" cx="18" cy="24" r="2.5" />
  <rect class="rh-method--get" x="24" y="20" width="14" height="8" rx="1.5" />
  <line class="rh-text" x1="42" y1="24" x2="80" y2="24" />

  <!-- Row 2 — POST, 401 (ko) -->
  <rect class="rh-row-hover rh-row-hover--2 rh-anim" x="12" y="38" width="72" height="20" rx="3" />
  <circle class="rh-dot--ko" cx="18" cy="48" r="2.5" />
  <rect class="rh-method--post" x="24" y="44" width="14" height="8" rx="1.5" />
  <line class="rh-text" x1="42" y1="48" x2="76" y2="48" />

  <!-- Row 3 — PUT, 200 -->
  <rect class="rh-row-hover rh-row-hover--3 rh-anim" x="12" y="62" width="72" height="20" rx="3" />
  <circle class="rh-dot--ok" cx="18" cy="72" r="2.5" />
  <rect class="rh-method--put" x="24" y="68" width="14" height="8" rx="1.5" />
  <line class="rh-text" x1="42" y1="72" x2="78" y2="72" />

  <!-- Row 4 — DELETE -->
  <circle class="rh-dot--ok" cx="18" cy="96" r="2.5" />
  <rect class="rh-method--delete" x="24" y="92" width="14" height="8" rx="1.5" />
  <line class="rh-text" x1="42" y1="96" x2="72" y2="96" />

  <!-- Row 5 — GET -->
  <circle class="rh-dot--ok" cx="18" cy="120" r="2.5" />
  <rect class="rh-method--get" x="24" y="116" width="14" height="8" rx="1.5" />
  <line class="rh-text" x1="42" y1="120" x2="80" y2="120" />

  <!-- ============ Right detail panes — one per selected row ============ -->
  <!-- Detail 1: GET 200 OK -->
  <g class="rh-detail--1 rh-anim">
    <rect class="rh-method--get" x="96" y="18" width="22" height="10" rx="1.5" />
    <line class="rh-text rh-text--strong" x1="124" y1="23" x2="200" y2="23" />
    <rect class="rh-status--ok" x="96" y="36" width="18" height="6" rx="1" />
    <line class="rh-text" x1="120" y1="39" x2="160" y2="39" />
    <line class="rh-text" x1="96"  y1="56" x2="204" y2="56" />
    <line class="rh-text" x1="96"  y1="66" x2="190" y2="66" />
    <line class="rh-text" x1="96"  y1="76" x2="198" y2="76" />
    <line class="rh-text" x1="96"  y1="86" x2="172" y2="86" />
    <line class="rh-text" x1="96"  y1="96" x2="200" y2="96" />
    <line class="rh-text" x1="96"  y1="106" x2="180" y2="106" />
    <line class="rh-text" x1="96"  y1="116" x2="192" y2="116" />
    <line class="rh-text" x1="96"  y1="126" x2="160" y2="126" />
  </g>

  <!-- Detail 2: POST 401 -->
  <g class="rh-detail--2 rh-anim">
    <rect class="rh-method--post" x="96" y="18" width="22" height="10" rx="1.5" />
    <line class="rh-text rh-text--strong" x1="124" y1="23" x2="192" y2="23" />
    <rect class="rh-status--ko" x="96" y="36" width="18" height="6" rx="1" />
    <line class="rh-text" x1="120" y1="39" x2="172" y2="39" />
    <line class="rh-text" x1="96"  y1="56" x2="184" y2="56" />
    <line class="rh-text" x1="96"  y1="66" x2="200" y2="66" />
    <line class="rh-text" x1="96"  y1="76" x2="170" y2="76" />
    <line class="rh-text" x1="96"  y1="86" x2="196" y2="86" />
    <line class="rh-text" x1="96"  y1="96" x2="178" y2="96" />
    <line class="rh-text" x1="96"  y1="106" x2="160" y2="106" />
    <line class="rh-text" x1="96"  y1="116" x2="200" y2="116" />
    <line class="rh-text" x1="96"  y1="126" x2="148" y2="126" />
  </g>

  <!-- Detail 3: PUT 200 -->
  <g class="rh-detail--3 rh-anim">
    <rect class="rh-method--put" x="96" y="18" width="22" height="10" rx="1.5" />
    <line class="rh-text rh-text--strong" x1="124" y1="23" x2="196" y2="23" />
    <rect class="rh-status--ok" x="96" y="36" width="18" height="6" rx="1" />
    <line class="rh-text" x1="120" y1="39" x2="156" y2="39" />
    <line class="rh-text" x1="96"  y1="56" x2="194" y2="56" />
    <line class="rh-text" x1="96"  y1="66" x2="178" y2="66" />
    <line class="rh-text" x1="96"  y1="76" x2="204" y2="76" />
    <line class="rh-text" x1="96"  y1="86" x2="158" y2="86" />
    <line class="rh-text" x1="96"  y1="96" x2="192" y2="96" />
    <line class="rh-text" x1="96"  y1="106" x2="170" y2="106" />
    <line class="rh-text" x1="96"  y1="116" x2="182" y2="116" />
    <line class="rh-text" x1="96"  y1="126" x2="200" y2="126" />
  </g>

  <!-- ============ Cursor + click sparkles ============ -->
  <g class="rh-pointer-group rh-anim">
    <line class="rh-sparkle" x1="-2" y1="-3" x2="-8"  y2="-10" style="--rh-nx: 4px;  --rh-ny: 5px" />
    <line class="rh-sparkle" x1="-4" y1="-1" x2="-12" y2="-2"  style="--rh-nx: 6px;  --rh-ny: 1px" />
    <line class="rh-sparkle" x1="-1" y1="-4" x2="-2"  y2="-12" style="--rh-nx: 1px;  --rh-ny: 6px" />
    <line class="rh-sparkle" x1="2"  y1="-4" x2="4"   y2="-11" style="--rh-nx: -2px; --rh-ny: 6px" />
    <line class="rh-sparkle" x1="-3" y1="2"  x2="-10" y2="6"   style="--rh-nx: 5px;  --rh-ny: -3px" />
    <line class="rh-sparkle" x1="5"  y1="-2" x2="11"  y2="-6"  style="--rh-nx: -4px; --rh-ny: 3px" />
    <path class="rh-pointer" d="M 0 0 L 0 17 L 4.5 12.5 L 7.5 19 L 10 18 L 7.2 11.5 L 13 11.5 Z" />
  </g>
</svg>
