<svg viewBox="0 0 220 150" xmlns="http://www.w3.org/2000/svg" class="empty-bench-tip-illustration" role="img" aria-hidden="true">
  <style>
    /* Same composition as the mcp / auth / supplyChain tips:
       a large disc anchored toward the lower-right (so its right
       and bottom edges fall outside the viewBox), with the
       protocol logo scaled big on top. Each protocol layer is
       revealed by a circle growing from (75%, 75%); when the
       last reveal completes, the cycle wraps back to GraphQL via
       a duplicate loop layer.

       The protocol name on the LEFT is not part of the clipped
       layers — each label has its own opacity animation, gated on
       the matching reveal phase, so the previous label vanishes
       cleanly when the next one shows up (no mask trickery). */
    .pr-disc { fill: var(--editor-background, #1e1e1e); }
    .pr-disc-ring {
      fill: none;
      stroke-width: 4;
    }

    .pr-layer-graphql   .pr-disc-ring { stroke: #e535ab; }
    .pr-layer-grpc      .pr-disc-ring { stroke: #14b8a6; }
    .pr-layer-soap      .pr-disc-ring { stroke: #4f46e5; }
    .pr-layer-odata     .pr-disc-ring { stroke: #ea580c; }
    .pr-layer-websocket .pr-disc-ring { stroke: #8b5cf6; }

    .pr-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif;
      font-size: 16px;
      font-weight: 700;
      dominant-baseline: middle;
      animation-duration: 20s;
      animation-iteration-count: infinite;
      animation-fill-mode: both;
      animation-play-state: paused;
      opacity: 0;
    }
    .pr-label--graphql   { fill: #e535ab; animation-name: pr-label-graphql; }
    .pr-label--grpc      { fill: #14b8a6; animation-name: pr-label-grpc; }
    .pr-label--soap      { fill: #4f46e5; animation-name: pr-label-soap; }
    .pr-label--odata     { fill: #ea580c; animation-name: pr-label-odata; }
    .pr-label--websocket { fill: #8b5cf6; animation-name: pr-label-websocket; }

    /* Each label is opaque only during the slice where its
       protocol is the active one — i.e. between the end of its
       own reveal (or 0% for the base) and the start of the next
       reveal. Cuts are sharp (no fade) so the swap reads as
       instant. */
    @keyframes pr-label-graphql {
      0%, 19% { opacity: 1; }
      20%, 92% { opacity: 0; }
      93%, 100% { opacity: 1; }
    }
    @keyframes pr-label-grpc {
      0%, 20% { opacity: 0; }
      21%, 37% { opacity: 1; }
      38%, 100% { opacity: 0; }
    }
    @keyframes pr-label-soap {
      0%, 38% { opacity: 0; }
      39%, 55% { opacity: 1; }
      56%, 100% { opacity: 0; }
    }
    @keyframes pr-label-odata {
      0%, 56% { opacity: 0; }
      57%, 73% { opacity: 1; }
      74%, 100% { opacity: 0; }
    }
    @keyframes pr-label-websocket {
      0%, 74% { opacity: 0; }
      75%, 92% { opacity: 1; }
      93%, 100% { opacity: 0; }
    }

    .pr-reveal {
      transform-origin: 75% 75%;
      transform: scale(0);
      animation-duration: 20s;
      animation-iteration-count: infinite;
      animation-fill-mode: both;
      animation-play-state: paused;
      animation-timing-function: ease-out;
    }
    .pr-reveal--grpc      { animation-name: pr-reveal-grpc; }
    .pr-reveal--soap      { animation-name: pr-reveal-soap; }
    .pr-reveal--odata     { animation-name: pr-reveal-odata; }
    .pr-reveal--websocket { animation-name: pr-reveal-websocket; }
    .pr-reveal--loop      { animation-name: pr-reveal-loop; }

    @keyframes pr-reveal-grpc      { 0%, 18% { transform: scale(0); } 21%, 100% { transform: scale(1); } }
    @keyframes pr-reveal-soap      { 0%, 36% { transform: scale(0); } 39%, 100% { transform: scale(1); } }
    @keyframes pr-reveal-odata     { 0%, 54% { transform: scale(0); } 57%, 100% { transform: scale(1); } }
    @keyframes pr-reveal-websocket { 0%, 72% { transform: scale(0); } 75%, 100% { transform: scale(1); } }
    @keyframes pr-reveal-loop      { 0%, 90% { transform: scale(0); } 93%, 100% { transform: scale(1); } }
  </style>

  <defs>
    <clipPath id="pr-clip-grpc"><circle class="pr-reveal pr-reveal--grpc"           cx="165" cy="112.5" r="220" /></clipPath>
    <clipPath id="pr-clip-soap"><circle class="pr-reveal pr-reveal--soap"           cx="165" cy="112.5" r="220" /></clipPath>
    <clipPath id="pr-clip-odata"><circle class="pr-reveal pr-reveal--odata"         cx="165" cy="112.5" r="220" /></clipPath>
    <clipPath id="pr-clip-websocket"><circle class="pr-reveal pr-reveal--websocket" cx="165" cy="112.5" r="220" /></clipPath>
    <clipPath id="pr-clip-loop"><circle class="pr-reveal pr-reveal--loop"           cx="165" cy="112.5" r="220" /></clipPath>
  </defs>

  <!-- ============ Layer 1 — GraphQL (base) ============ -->
  <g class="pr-layer-graphql">
    <circle class="pr-disc"      cx="180" cy="95" r="85" />
    <circle class="pr-disc-ring" cx="180" cy="95" r="85" />
    <image href="/imgs/import-sources/graphql.svg" x="140" y="55" width="80" height="80" preserveAspectRatio="xMidYMid meet" />
  </g>

  <!-- ============ Layer 2 — gRPC ============ -->
  <g class="pr-layer-grpc" clip-path="url(#pr-clip-grpc)">
    <circle class="pr-disc"      cx="180" cy="95" r="85" />
    <circle class="pr-disc-ring" cx="180" cy="95" r="85" />
    <image href="/imgs/import-sources/grpc.svg" x="135" y="68" width="90" height="54" preserveAspectRatio="xMidYMid meet" />
  </g>

  <!-- ============ Layer 3 — SOAP ============ -->
  <g class="pr-layer-soap" clip-path="url(#pr-clip-soap)">
    <circle class="pr-disc"      cx="180" cy="95" r="85" />
    <circle class="pr-disc-ring" cx="180" cy="95" r="85" />
    <image href="/imgs/import-sources/soap.svg" x="140" y="55" width="80" height="80" preserveAspectRatio="xMidYMid meet" />
  </g>

  <!-- ============ Layer 4 — OData ============ -->
  <g class="pr-layer-odata" clip-path="url(#pr-clip-odata)">
    <circle class="pr-disc"      cx="180" cy="95" r="85" />
    <circle class="pr-disc-ring" cx="180" cy="95" r="85" />
    <image href="/imgs/import-sources/odata.svg" x="140" y="55" width="80" height="80" preserveAspectRatio="xMidYMid meet" />
  </g>

  <!-- ============ Layer 5 — WebSocket ============ -->
  <g class="pr-layer-websocket" clip-path="url(#pr-clip-websocket)">
    <circle class="pr-disc"      cx="180" cy="95" r="85" />
    <circle class="pr-disc-ring" cx="180" cy="95" r="85" />
    <image href="/imgs/import-sources/websocket.svg" x="140" y="55" width="80" height="80" preserveAspectRatio="xMidYMid meet" />
  </g>

  <!-- ============ Layer 6 — GraphQL loop (closes the cycle) ============ -->
  <g class="pr-layer-graphql" clip-path="url(#pr-clip-loop)">
    <circle class="pr-disc"      cx="180" cy="95" r="85" />
    <circle class="pr-disc-ring" cx="180" cy="95" r="85" />
    <image href="/imgs/import-sources/graphql.svg" x="140" y="55" width="80" height="80" preserveAspectRatio="xMidYMid meet" />
  </g>

  <!-- ============ Labels — drawn last (above all discs), each with
       its own opacity keyframes so they pop in/out cleanly. ============ -->
  <text class="pr-label pr-label--graphql"   x="-8" y="140">GraphQL</text>
  <text class="pr-label pr-label--grpc"      x="-8" y="140">gRPC</text>
  <text class="pr-label pr-label--soap"      x="-8" y="140">SOAP</text>
  <text class="pr-label pr-label--odata"     x="-8" y="140">OData</text>
  <text class="pr-label pr-label--websocket" x="-8" y="140">WebSocket</text>
</svg>
