<svg viewBox="0 0 220 150" xmlns="http://www.w3.org/2000/svg" class="empty-bench-tip-illustration" role="img" aria-hidden="true">
  <style>
    .sc-field {
      fill: var(--editor-background, #1e1e1e);
      stroke: currentColor;
      stroke-width: 1.4;
      stroke-linejoin: round;
    }
    .sc-field-label {
      font-family: 'SFMono-Regular', Menlo, Consolas, monospace;
      font-size: 13px;
      font-weight: 500;
      fill: currentColor;
      dominant-baseline: middle;
    }

    .sc-lock-body {
      fill: var(--editor-background, #1e1e1e);
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linejoin: round;
    }
    .sc-lock-hole {
      fill: currentColor;
    }
    .sc-lock-shackle {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sc-pointer {
      fill: currentColor;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linejoin: round;
    }
    .sc-sparkle {
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
      opacity: 0;
    }

    .sc-anim-open,
    .sc-anim-closed,
    .sc-pwd--clear,
    .sc-pwd--masked,
    .sc-pointer-group,
    .sc-sparkle {
      animation-duration: 8s;
      animation-iteration-count: infinite;
      animation-fill-mode: both;
      animation-play-state: paused;
    }

    /* Open state (initial + final): 0-32% and 95-100%.
       Closed state (after click): 36-93%. */
    .sc-anim-open    { animation-name: sc-fade-open;   }
    .sc-anim-closed  { animation-name: sc-fade-closed; }
    .sc-pwd--clear   { animation-name: sc-fade-open;   }
    .sc-pwd--masked  { animation-name: sc-fade-closed; }

    @keyframes sc-fade-open {
      0%, 32%   { opacity: 1; }
      36%, 93%  { opacity: 0; }
      95%, 100% { opacity: 1; }
    }
    @keyframes sc-fade-closed {
      0%, 32%   { opacity: 0; }
      36%, 93%  { opacity: 1; }
      95%, 100% { opacity: 0; }
    }

    /* Cursor: invisible 0-14%, slides to padlock 14-28%, parked at
       padlock 28-36%, fades out after the click registers. */
    .sc-pointer-group { animation-name: sc-pointer-move; opacity: 0; }
    @keyframes sc-pointer-move {
      0%, 14% { opacity: 0; transform: translate(110px, 130px); }
      18%     { opacity: 1; transform: translate(110px, 130px); }
      28%     { opacity: 1; transform: translate(190px, 83px); }
      37%     { opacity: 1; transform: translate(190px, 83px); }
      42%, 100% { opacity: 0; transform: translate(190px, 83px); }
    }

    /* Single click burst on the padlock, peaks around 33%. */
    .sc-sparkle { animation-name: sc-burst; animation-timing-function: linear; }
    @keyframes sc-burst {
      0%, 30%   { opacity: 0; transform: translate(var(--sc-nx), var(--sc-ny)); }
      33%       { opacity: 1; transform: translate(0, 0); }
      37%       { opacity: 0; transform: translate(calc(var(--sc-nx) * -0.6), calc(var(--sc-ny) * -0.6)); }
      38%, 100% { opacity: 0; }
    }
  </style>

  <!-- Input field -->
  <rect class="sc-field" x="20" y="66" width="150" height="28" rx="4" />
  <text class="sc-field-label sc-pwd--clear"  x="28" y="80">P@ssw0rd!</text>
  <text class="sc-field-label sc-pwd--masked" x="28" y="80">●●●●●●●●●</text>

  <!-- Padlock — body + keyhole always shown; the shackle has two
       versions (open vs closed) that cross-fade on click. -->
  <g class="sc-anim-open">
    <!-- Open shackle: pivoted on the left arm, right arm raised
         and detached from the body. -->
    <path class="sc-lock-shackle" d="M 184 77 L 184 71 A 6 6 0 0 1 196 67 L 197 74" />
  </g>
  <g class="sc-anim-closed">
    <!-- Closed shackle: symmetric inverted-U seated on the body. -->
    <path class="sc-lock-shackle" d="M 184 77 L 184 71 A 6 6 0 0 1 196 71 L 196 77" />
  </g>
  <rect class="sc-lock-body" x="180" y="77" width="20" height="14" rx="2.5" />
  <circle class="sc-lock-hole" cx="190" cy="84" r="1.4" />

  <!-- Pointer + click sparkles (always on top) -->
  <g class="sc-pointer-group">
    <line class="sc-sparkle" x1="-2" y1="-3" x2="-8"  y2="-10" style="--sc-nx: 4px;  --sc-ny: 5px" />
    <line class="sc-sparkle" x1="-4" y1="-1" x2="-12" y2="-2"  style="--sc-nx: 6px;  --sc-ny: 1px" />
    <line class="sc-sparkle" x1="-1" y1="-4" x2="-2"  y2="-12" style="--sc-nx: 1px;  --sc-ny: 6px" />
    <line class="sc-sparkle" x1="2"  y1="-4" x2="4"   y2="-11" style="--sc-nx: -2px; --sc-ny: 6px" />
    <line class="sc-sparkle" x1="-3" y1="2"  x2="-10" y2="6"   style="--sc-nx: 5px;  --sc-ny: -3px" />
    <line class="sc-sparkle" x1="5"  y1="-2" x2="11"  y2="-6"  style="--sc-nx: -4px; --sc-ny: 3px" />
    <path class="sc-pointer" d="M 0 0 L 0 17 L 4.5 12.5 L 7.5 19 L 10 18 L 7.2 11.5 L 13 11.5 Z" />
  </g>
</svg>
