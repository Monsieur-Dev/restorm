<svg viewBox="0 0 220 150" xmlns="http://www.w3.org/2000/svg" class="empty-bench-tip-illustration" role="img" aria-hidden="true">
  <style>
    .is-bg { fill: #0f172a; }
    .is-box { fill: #1e293b; stroke: #475569; stroke-width: 2; }
    .is-edge { fill: none; stroke: #475569; stroke-width: 2.5; }

    /* Sequential run: box1 lights → beam down link1 → box2 (the input node)
       lights and STAYS lit while the dialog is up → dialog closes → beam down
       link2 → box3 lights. Yellow (#facc15) like the app's real beams. */
    .is-lit { fill: none; stroke: #facc15; stroke-width: 2.5; filter: drop-shadow(0 0 4px #facc15); opacity: 0; }
    .is-lit1 { animation: is-lit1 4.5s linear infinite; animation-play-state: paused; }
    .is-lit2 { animation: is-lit2 4.5s linear infinite; animation-play-state: paused; }
    .is-lit3 { animation: is-lit3 4.5s linear infinite; animation-play-state: paused; }
    @keyframes is-lit1 { 0% { opacity: 0; } 3%,11% { opacity: 1; } 15%,100% { opacity: 0; } }
    @keyframes is-lit2 { 0%,13% { opacity: 0; } 16% { opacity: 1; } 84% { opacity: 1; } 88%,100% { opacity: 0; } }
    @keyframes is-lit3 { 0%,90% { opacity: 0; } 94%,100% { opacity: 1; } }

    .is-link { fill: none; stroke: #facc15; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 14 100; filter: drop-shadow(0 0 3px #facc15); opacity: 0; }
    .is-link1 { animation: is-link1 4.5s linear infinite; animation-play-state: paused; }
    .is-link2 { animation: is-link2 4.5s linear infinite; animation-play-state: paused; }
    @keyframes is-link1 { 0%,5% { opacity: 0; stroke-dashoffset: 14; } 7% { opacity: 1; } 15% { opacity: 1; stroke-dashoffset: -100; } 17%,100% { opacity: 0; stroke-dashoffset: -100; } }
    @keyframes is-link2 { 0%,84% { opacity: 0; stroke-dashoffset: 14; } 86% { opacity: 1; } 94% { opacity: 1; stroke-dashoffset: -100; } 96%,100% { opacity: 0; stroke-dashoffset: -100; } }

    /* dim overlay behind the modal */
    .is-scrim { fill: #0f172a; opacity: 0; animation: is-scrim 4.5s ease-in-out infinite; animation-play-state: paused; }
    @keyframes is-scrim { 0%,12% { opacity: 0; } 18%,80% { opacity: 0.55; } 86%,100% { opacity: 0; } }

    /* dialog appears, then fades away */
    .is-dialog { animation: is-dialog 4.5s ease-in-out infinite; animation-play-state: paused; transform-origin: 110px 80px; }
    @keyframes is-dialog { 0%,12% { opacity: 0; transform: scale(0.9); } 18%,80% { opacity: 1; transform: scale(1); } 86%,100% { opacity: 0; transform: scale(0.9); } }

    .is-panel { fill: #1e293b; stroke: #475569; stroke-width: 2; }
    .is-titlebar { fill: #334155; }
    .is-text { fill: #94a3b8; }

    /* toggle: starts grey/off, flips green/on when clicked. The knob travels the
       full width of the pill (rest near the left edge → on near the right edge). */
    .is-toggle-track { animation: is-toggle-track 4.5s ease-in-out infinite; animation-play-state: paused; }
    @keyframes is-toggle-track { 0%,40% { fill: #475569; } 46%,100% { fill: #22c55e; } }
    .is-toggle-knob { animation: is-toggle-knob 4.5s ease-in-out infinite; animation-play-state: paused; }
    @keyframes is-toggle-knob { 0%,40% { transform: translateX(0); } 46%,100% { transform: translateX(15px); } }

    /* next button: brief press flash near the end of the dialog */
    .is-next { fill: #22c55e; animation: is-next 4.5s ease-in-out infinite; animation-play-state: paused; }
    @keyframes is-next { 0%,66% { fill: #22c55e; } 70% { fill: #16a34a; } 76%,100% { fill: #22c55e; } }
    .is-next-label { fill: #0f172a; }

    /* cursor: travels to the toggle centre (click), then to the next button
       (click), syncing with the flips. Tip is at the group origin so a plain
       translate lands the hotspot exactly on the click target. */
    .is-cursor { animation: is-cursor 4.5s ease-in-out infinite; animation-play-state: paused; }
    @keyframes is-cursor {
      0%,18% { transform: translate(176px, 70px); opacity: 0; }
      24% { transform: translate(137px, 94px); opacity: 1; }
      44% { transform: translate(137px, 94px); opacity: 1; }     /* at toggle centre */
      60% { transform: translate(134px, 114px); opacity: 1; }
      70% { transform: translate(134px, 114px); opacity: 1; }    /* at next button */
      82% { transform: translate(134px, 114px); opacity: 0; }
      100% { transform: translate(176px, 70px); opacity: 0; }
    }
    .is-ring { fill: none; stroke: #cbd5e1; stroke-width: 2; opacity: 0; animation: is-ring 4.5s ease-in-out infinite; animation-play-state: paused; }
    @keyframes is-ring {
      0%,41% { opacity: 0; r: 2; } 44% { opacity: 0.9; r: 4; } 50% { opacity: 0; r: 11; }
      66% { opacity: 0; r: 2; } 69% { opacity: 0.9; r: 4; } 76%,100% { opacity: 0; r: 11; }
    }
  </style>

  <rect class="is-bg" x="0" y="0" width="220" height="150" rx="10" />

  <!-- running scenario graph: edges touch both boxes on each end -->
  <line class="is-edge" x1="56" y1="34" x2="86" y2="34" />
  <line class="is-edge" x1="118" y1="34" x2="164" y2="34" />
  <!-- link beams -->
  <path class="is-link is-link1" d="M56 34 H86" pathLength="100" />
  <path class="is-link is-link2" d="M118 34 H164" pathLength="100" />

  <rect class="is-box" x="24" y="18" width="32" height="32" rx="7" />
  <rect class="is-box" x="86" y="18" width="32" height="32" rx="7" />
  <rect class="is-box" x="164" y="18" width="32" height="32" rx="7" />
  <!-- box lit overlays (sequential) -->
  <rect class="is-lit is-lit1" x="24" y="18" width="32" height="32" rx="7" />
  <rect class="is-lit is-lit2" x="86" y="18" width="32" height="32" rx="7" />
  <rect class="is-lit is-lit3" x="164" y="18" width="32" height="32" rx="7" />

  <!-- modal scrim -->
  <rect class="is-scrim" x="0" y="0" width="220" height="150" rx="10" />

  <!-- dialog modal -->
  <g class="is-dialog">
    <rect class="is-panel" x="62" y="52" width="96" height="74" rx="8" />
    <path class="is-titlebar" d="M62 60 a8 8 0 0 1 8 -8 h80 a8 8 0 0 1 8 8 v4 h-96 Z" />
    <rect class="is-text" x="70" y="55" width="34" height="4" rx="2" />

    <!-- pseudo-text lines -->
    <rect class="is-text" x="70" y="72" width="64" height="3.5" rx="1.75" />
    <rect class="is-text" x="70" y="80" width="48" height="3.5" rx="1.75" />

    <!-- toggle: track x[124..150], knob rests near left, travels +15 to near right -->
    <rect class="is-text" x="70" y="92" width="26" height="3.5" rx="1.75" />
    <rect class="is-toggle-track" x="124" y="89" width="26" height="11" rx="5.5" fill="#475569" />
    <circle class="is-toggle-knob" cx="129.5" cy="94.5" r="4" fill="#e2e8f0" />

    <!-- next button -->
    <rect class="is-next" x="116" y="108" width="36" height="13" rx="4" />
    <rect class="is-next-label" x="124" y="113" width="20" height="3.5" rx="1.75" />
  </g>

  <!-- cursor + click ring (tip at group origin) -->
  <g class="is-cursor">
    <circle class="is-ring" cx="0" cy="0" r="2" />
    <path d="M0 0 L0 18 L5 13 L8 20 L11 19 L8 12 L15 12 Z"
          fill="#ffffff" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round" />
  </g>
</svg>
