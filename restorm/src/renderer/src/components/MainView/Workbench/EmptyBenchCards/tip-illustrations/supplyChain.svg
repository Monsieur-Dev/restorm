<svg viewBox="0 0 220 150" xmlns="http://www.w3.org/2000/svg" class="empty-bench-tip-illustration" role="img" aria-hidden="true">
  <style>
    .sc-disc { fill: #94a3b8; }
    .sc-logo { fill: #ffffff; }

    .sc-ripple {
      fill: none;
      stroke: #cbd5e1;
      stroke-width: 4;
      vector-effect: non-scaling-stroke;
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
      animation-name: sc-ripple-pulse;
      animation-duration: 2.4s;
      animation-timing-function: ease-out;
      animation-iteration-count: infinite;
      animation-play-state: paused;
    }
    .sc-ripple--2 { animation-delay: 0.8s; }
    .sc-ripple--3 { animation-delay: 1.6s; }

    @keyframes sc-ripple-pulse {
      0%   { transform: scale(0); opacity: 1; }
      100% { transform: scale(1.35); opacity: 0; }
    }
  </style>

  <!-- Layer 1: silver disc (right + bottom clipped by the viewBox). -->
  <circle class="sc-disc" cx="180" cy="95" r="85" />

  <!-- Layer 2: wave ripples, drawn over the disc but under the shield. -->
  <circle class="sc-ripple sc-ripple--1" cx="180" cy="95" r="85" />
  <circle class="sc-ripple sc-ripple--2" cx="180" cy="95" r="85" />
  <circle class="sc-ripple sc-ripple--3" cx="180" cy="95" r="85" />

  <!-- Layer 3: shield codicon glyph, scaled 5×, NOT rotated (shield
       reads naturally upright). Same centre (180, 95) as the other
       tips. -->
  <g transform="translate(140 55) scale(5)">
    <path
      class="sc-logo"
      d="M9.25 7.25c0 .513-.309.953-.75 1.146v1.108a.5.5 0 1 1-1 0V8.396A1.25 1.25 0 1 1 9.25 7.25ZM7.143 2.042a8.308 8.308 0 0 1-1.718.875 9.266 9.266 0 0 1-2.7.576 5.133 5.133 0 0 1-.17.007h-.05A.5.5 0 0 0 2 4v2.755a7.5 7.5 0 0 0 3.685 6.457l2.062 1.219a.5.5 0 0 0 .509 0l2.06-1.218A7.5 7.5 0 0 0 14 6.756V4a.5.5 0 0 0-.508-.5h-.05a7.886 7.886 0 0 1-.804-.064 8.981 8.981 0 0 1-2.051-.518 8.691 8.691 0 0 1-1.724-.88 5.086 5.086 0 0 1-.4-.297 2.076 2.076 0 0 1-.111-.098.5.5 0 0 0-.706.005l-.109.097c-.082.07-.213.173-.394.297ZM3 6.755V4.477a10.265 10.265 0 0 0 2.78-.626 9.302 9.302 0 0 0 1.926-.983c.115-.078.214-.15.298-.215.085.064.185.136.3.214.424.285 1.058.65 1.922.983A9.98 9.98 0 0 0 13 4.48v2.277a6.5 6.5 0 0 1-3.193 5.596l-1.806 1.067-1.807-1.068A6.5 6.5 0 0 1 3 6.755Z"
    />
  </g>
</svg>
