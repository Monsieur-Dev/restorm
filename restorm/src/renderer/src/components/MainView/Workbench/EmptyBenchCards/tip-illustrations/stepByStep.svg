<svg viewBox="0 0 220 150" xmlns="http://www.w3.org/2000/svg" class="empty-bench-tip-illustration" role="img" aria-hidden="true">
  <style>
    .sbs-bg { fill: #0f172a; }
    .sbs-box { fill: #1e293b; stroke: #475569; stroke-width: 2; }
    .sbs-label { fill: #94a3b8; }
    .sbs-edge { fill: none; stroke: #475569; stroke-width: 2.5; }

    /* Step flow over one 4.5s cycle: click → box 1 lights → beam down link 1 →
       box 2 lights → beam down link 2 → box 3 lights. Yellow (#facc15) like the
       app's real beams. opacity 0 base = cold-load safe. */
    .sbs-lit { fill: none; stroke: #facc15; stroke-width: 2.5; filter: drop-shadow(0 0 4px #facc15); opacity: 0; }
    .sbs-lit-1 { animation: sbs-lit-1 4.5s linear infinite; animation-play-state: paused; }
    .sbs-lit-2 { animation: sbs-lit-2 4.5s linear infinite; animation-play-state: paused; }
    .sbs-lit-3 { animation: sbs-lit-3 4.5s linear infinite; animation-play-state: paused; }
    @keyframes sbs-lit-1 { 0%,9% { opacity: 0; } 13%,26% { opacity: 1; } 30%,100% { opacity: 0; } }
    @keyframes sbs-lit-2 { 0%,50% { opacity: 0; } 53%,64% { opacity: 1; } 68%,100% { opacity: 0; } }
    @keyframes sbs-lit-3 { 0%,82% { opacity: 0; } 85%,96% { opacity: 1; } 99%,100% { opacity: 0; } }

    /* a beam segment travels each link between the box lights */
    .sbs-link { fill: none; stroke: #facc15; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 16 100; filter: drop-shadow(0 0 3px #facc15); opacity: 0; }
    .sbs-link-1 { animation: sbs-link-1 4.5s linear infinite; animation-play-state: paused; }
    .sbs-link-2 { animation: sbs-link-2 4.5s linear infinite; animation-play-state: paused; }
    @keyframes sbs-link-1 { 0%,38% { opacity: 0; stroke-dashoffset: 20; } 40% { opacity: 1; } 48% { opacity: 1; stroke-dashoffset: -100; } 50%,100% { opacity: 0; stroke-dashoffset: -100; } }
    @keyframes sbs-link-2 { 0%,70% { opacity: 0; stroke-dashoffset: 20; } 72% { opacity: 1; } 80% { opacity: 1; stroke-dashoffset: -100; } 82%,100% { opacity: 0; stroke-dashoffset: -100; } }

    /* breakpoint dot + halo on box 2 */
    .sbs-bp-halo { fill: #ef4444; opacity: 0.25; transform-box: fill-box; transform-origin: center; animation: sbs-bp-halo 2.4s ease-in-out infinite; animation-play-state: paused; }
    @keyframes sbs-bp-halo { 0%,100% { opacity: 0.18; transform: scale(0.9); } 50% { opacity: 0.4; transform: scale(1.25); } }
    .sbs-bp-dot { fill: #ef4444; }

    /* step-over button — the inspector's round control: blue disc, white ring,
       white debug-step-over codicon; a quick press on each click. */
    .sbs-btn { fill: #3b82f6; stroke: rgba(255, 255, 255, 0.92); stroke-width: 2; }
    .sbs-glyph { fill: #ffffff; }
    .sbs-btn-press { transform-box: fill-box; transform-origin: center; animation: sbs-btn-press 4.5s ease-in-out infinite; animation-play-state: paused; }
    @keyframes sbs-btn-press {
      0%,8% { transform: scale(1); } 10% { transform: scale(0.9); } 14% { transform: scale(1); }
      36%,38% { transform: scale(1); } 40% { transform: scale(0.9); } 44% { transform: scale(1); }
      68%,70% { transform: scale(1); } 72% { transform: scale(0.9); } 76%,100% { transform: scale(1); } }

    /* mouse cursor sits on the button centre; click ring pulses on each press */
    .sbs-cursor { animation: sbs-cursor 4.5s ease-in-out infinite; animation-play-state: paused; }
    @keyframes sbs-cursor {
      0% { transform: translate(40px, -12px); }
      8%, 92% { transform: translate(0px, 0px); }
      100% { transform: translate(40px, -12px); }
    }
    .sbs-ring { fill: none; stroke: #cbd5e1; stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; animation: sbs-ring 4.5s ease-in-out infinite; animation-play-state: paused; }
    @keyframes sbs-ring {
      0%,9% { opacity: 0; r: 2; } 10% { opacity: 0.9; r: 4; } 17% { opacity: 0; r: 13; }
      37% { opacity: 0; r: 2; } 38% { opacity: 0.9; r: 4; } 45% { opacity: 0; r: 13; }
      69% { opacity: 0; r: 2; } 70% { opacity: 0.9; r: 4; } 77%,100% { opacity: 0; r: 13; } }
  </style>

  <rect class="sbs-bg" x="0" y="0" width="220" height="150" rx="10" />

  <!-- edges (touch the boxes on both ends) -->
  <line class="sbs-edge" x1="58" y1="56" x2="92" y2="56" />
  <line class="sbs-edge" x1="128" y1="56" x2="162" y2="56" />
  <!-- link beams -->
  <path class="sbs-link sbs-link-1" d="M58 56 H92" pathLength="100" />
  <path class="sbs-link sbs-link-2" d="M128 56 H162" pathLength="100" />

  <!-- box 1 -->
  <rect class="sbs-box" x="22" y="38" width="36" height="36" rx="7" />
  <rect class="sbs-label" x="28" y="46" width="24" height="4" rx="2" />
  <rect class="sbs-label" x="28" y="54" width="16" height="4" rx="2" />
  <rect class="sbs-lit sbs-lit-1" x="22" y="38" width="36" height="36" rx="7" />

  <!-- box 2 (with breakpoint) -->
  <rect class="sbs-box" x="92" y="38" width="36" height="36" rx="7" />
  <rect class="sbs-label" x="98" y="46" width="24" height="4" rx="2" />
  <rect class="sbs-label" x="98" y="54" width="16" height="4" rx="2" />
  <rect class="sbs-lit sbs-lit-2" x="92" y="38" width="36" height="36" rx="7" />
  <circle class="sbs-bp-halo" cx="92" cy="38" r="6" />
  <circle class="sbs-bp-dot" cx="92" cy="38" r="4" />

  <!-- box 3 -->
  <rect class="sbs-box" x="162" y="38" width="36" height="36" rx="7" />
  <rect class="sbs-label" x="168" y="46" width="24" height="4" rx="2" />
  <rect class="sbs-label" x="168" y="54" width="16" height="4" rx="2" />
  <rect class="sbs-lit sbs-lit-3" x="162" y="38" width="36" height="36" rx="7" />

  <!-- step-over button (round, like the inspector): blue disc + white ring +
       the real `debug-step-over` codicon (16×16, scaled + centred). -->
  <g class="sbs-btn-press">
    <circle class="sbs-btn" cx="110" cy="128" r="13.5" />
    <g transform="translate(103.2 121.2) scale(0.85)">
      <path class="sbs-glyph" d="M9.99993 13C9.99993 14.103 9.10293 15 7.99993 15C6.89693 15 5.99993 14.103 5.99993 13C5.99993 11.897 6.89693 11 7.99993 11C9.10293 11 9.99993 11.897 9.99993 13ZM13.2499 2C12.8359 2 12.4999 2.336 12.4999 2.75V4.027C11.3829 2.759 9.75993 2 7.99993 2C5.03293 2 2.47993 4.211 2.06093 7.144C2.00193 7.554 2.28793 7.934 2.69793 7.993C2.73393 7.999 2.76993 8.001 2.80493 8.001C3.17193 8.001 3.49293 7.731 3.54693 7.357C3.86093 5.159 5.77593 3.501 8.00093 3.501C9.52993 3.501 10.9199 4.264 11.7439 5.501H9.75093C9.33693 5.501 9.00093 5.837 9.00093 6.251C9.00093 6.665 9.33693 7.001 9.75093 7.001H13.2509C13.6649 7.001 14.0009 6.665 14.0009 6.251V2.751C14.0009 2.337 13.6649 2.001 13.2509 2.001L13.2499 2Z" />
    </g>
  </g>

  <!-- mouse cursor + click ring, tip on the button centre (110,128) -->
  <g class="sbs-cursor">
    <circle class="sbs-ring" cx="110" cy="128" r="2" />
    <path d="M110 128 L110 146 L115 141 L118 148 L121 147 L118 140 L125 140 Z"
          fill="#ffffff" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round" />
  </g>
</svg>
