<svg viewBox="0 0 220 150" xmlns="http://www.w3.org/2000/svg" class="empty-bench-tip-illustration" role="img" aria-hidden="true">
  <style>
    .sai-mcp-disc { fill: #2563eb; }
    .sai-mcp-logo { fill: #ffffff; }

    /* expanding wave ripples from the disc centre — same effect as the
       mcpControl tip (drawn over the disc, under the logo, so it stays readable) */
    .sai-mcp-ripple {
      fill: none;
      stroke: #60a5fa;
      stroke-width: 4;
      vector-effect: non-scaling-stroke;
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
      animation: sai-mcp-ripple 2.4s ease-out infinite;
      animation-play-state: paused;
    }
    .sai-mcp-ripple--2 { animation-delay: 0.8s; }
    .sai-mcp-ripple--3 { animation-delay: 1.6s; }
    @keyframes sai-mcp-ripple {
      0%   { transform: scale(0); opacity: 1; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    .sai-link {
      fill: none;
      stroke: #2563eb;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 4 6;
      animation: sai-link-pulse 6s linear infinite;
      animation-play-state: paused;
    }
    @keyframes sai-link-pulse { to { stroke-dashoffset: -40; } }

    .sai-box { fill: #1e293b; stroke: #475569; stroke-width: 2; }
    .sai-blabel { fill: #94a3b8; }
    .sai-edge { fill: none; stroke: #475569; stroke-width: 2; stroke-linecap: round; opacity: 0; }

    /* beam phase: box lights + travelling link beams (yellow, like the app) */
    .sai-lit { fill: none; stroke: #facc15; stroke-width: 2.5; filter: drop-shadow(0 0 4px #facc15); opacity: 0; }
    .sai-lbeam { fill: none; stroke: #facc15; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 14 100; filter: drop-shadow(0 0 3px #facc15); opacity: 0; }

    .sai-bx-b1 { transform-box: fill-box; transform-origin: center; opacity: 0; animation: sai-bx-b1 6s ease-out infinite; animation-play-state: paused; }
    @keyframes sai-bx-b1 { 0%,2% { opacity: 0; transform: scale(0.55); } 7%,100% { opacity: 1; transform: scale(1); } }
    .sai-lit-b1 { animation: sai-lit-b1 6s linear infinite; animation-play-state: paused; }
    @keyframes sai-lit-b1 { 0%,57% { opacity: 0; } 59%,64% { opacity: 1; } 66%,100% { opacity: 0; } }
    .sai-bx-b2 { transform-box: fill-box; transform-origin: center; opacity: 0; animation: sai-bx-b2 6s ease-out infinite; animation-play-state: paused; }
    @keyframes sai-bx-b2 { 0%,11% { opacity: 0; transform: scale(0.55); } 16%,100% { opacity: 1; transform: scale(1); } }
    .sai-lit-b2 { animation: sai-lit-b2 6s linear infinite; animation-play-state: paused; }
    @keyframes sai-lit-b2 { 0%,66% { opacity: 0; } 68%,73% { opacity: 1; } 75%,100% { opacity: 0; } }
    .sai-bx-b3 { transform-box: fill-box; transform-origin: center; opacity: 0; animation: sai-bx-b3 6s ease-out infinite; animation-play-state: paused; }
    @keyframes sai-bx-b3 { 0%,27% { opacity: 0; transform: scale(0.55); } 32%,100% { opacity: 1; transform: scale(1); } }
    .sai-lit-b3 { animation: sai-lit-b3 6s linear infinite; animation-play-state: paused; }
    @keyframes sai-lit-b3 { 0%,75% { opacity: 0; } 77%,82% { opacity: 1; } 84%,100% { opacity: 0; } }
    .sai-bx-b4 { transform-box: fill-box; transform-origin: center; opacity: 0; animation: sai-bx-b4 6s ease-out infinite; animation-play-state: paused; }
    @keyframes sai-bx-b4 { 0%,43% { opacity: 0; transform: scale(0.55); } 48%,100% { opacity: 1; transform: scale(1); } }
    .sai-lit-b4 { animation: sai-lit-b4 6s linear infinite; animation-play-state: paused; }
    @keyframes sai-lit-b4 { 0%,84% { opacity: 0; } 86%,91% { opacity: 1; } 93%,100% { opacity: 0; } }
    .sai-edge-l1 { animation: sai-edge-l1 6s ease-out infinite; animation-play-state: paused; }
    @keyframes sai-edge-l1 { 0%,18% { opacity: 0; stroke-dashoffset: 100; } 19% { opacity: 1; } 24%,100% { opacity: 1; stroke-dashoffset: 0; } }
    .sai-beam-l1 { animation: sai-beam-l1 6s linear infinite; animation-play-state: paused; }
    @keyframes sai-beam-l1 { 0%,62% { opacity: 0; stroke-dashoffset: 14; } 64% { opacity: 1; } 69% { opacity: 1; stroke-dashoffset: -100; } 70%,100% { opacity: 0; stroke-dashoffset: -100; } }
    .sai-edge-l2 { animation: sai-edge-l2 6s ease-out infinite; animation-play-state: paused; }
    @keyframes sai-edge-l2 { 0%,34% { opacity: 0; stroke-dashoffset: 100; } 35% { opacity: 1; } 40%,100% { opacity: 1; stroke-dashoffset: 0; } }
    .sai-beam-l2 { animation: sai-beam-l2 6s linear infinite; animation-play-state: paused; }
    @keyframes sai-beam-l2 { 0%,71% { opacity: 0; stroke-dashoffset: 14; } 73% { opacity: 1; } 78% { opacity: 1; stroke-dashoffset: -100; } 79%,100% { opacity: 0; stroke-dashoffset: -100; } }
    .sai-edge-l3 { animation: sai-edge-l3 6s ease-out infinite; animation-play-state: paused; }
    @keyframes sai-edge-l3 { 0%,50% { opacity: 0; stroke-dashoffset: 100; } 51% { opacity: 1; } 56%,100% { opacity: 1; stroke-dashoffset: 0; } }
    .sai-beam-l3 { animation: sai-beam-l3 6s linear infinite; animation-play-state: paused; }
    @keyframes sai-beam-l3 { 0%,80% { opacity: 0; stroke-dashoffset: 14; } 82% { opacity: 1; } 87% { opacity: 1; stroke-dashoffset: -100; } 88%,100% { opacity: 0; stroke-dashoffset: -100; } }
  </style>

  <!-- MCP logo disc (left) with wave ripples; the same glyph the app uses
       (codicon `mcp`), reused from the mcpControl tip. -->
  <g>
    <circle class="sai-mcp-disc" cx="40" cy="75" r="26" />
    <circle class="sai-mcp-ripple" cx="40" cy="75" r="26" />
    <circle class="sai-mcp-ripple sai-mcp-ripple--2" cx="40" cy="75" r="26" />
    <circle class="sai-mcp-ripple sai-mcp-ripple--3" cx="40" cy="75" r="26" />
    <g transform="rotate(-90 40 75)">
      <g transform="translate(24.8 59.8) scale(1.9)">
        <path class="sai-mcp-logo" fill-rule="evenodd" clip-rule="evenodd" d="M14.556 7.875a2.75 2.75 0 0 1-.053.054L8.697 13.62a.183.183 0 0 0-.003.259l.003.003 1.192 1.17a.55.55 0 0 1 .011.776l-.01.01a.575.575 0 0 1-.803 0L7.896 14.67a1.28 1.28 0 0 1 0-1.836L13.7 7.142a1.647 1.647 0 0 0 .032-2.328l-.031-.032-.034-.032a1.725 1.725 0 0 0-2.405-.002l-4.781 4.69h-.002l-.065.065a.575.575 0 0 1-.803 0 .55.55 0 0 1-.01-.776l.01-.01L10.46 3.96c.65-.636.663-1.678.027-2.329l-.029-.03a1.725 1.725 0 0 0-2.407 0L1.635 7.896a.575.575 0 0 1-.802 0 .55.55 0 0 1-.011-.776l.011-.01L7.25.814a2.875 2.875 0 0 1 4.01 0c.63.613.929 1.49.803 2.36.88-.125 1.77.166 2.406.787l.034.033a2.743 2.743 0 0 1 .053 3.88Zm-1.69-1.553a.549.549 0 0 0 .01-.776l-.01-.01a.575.575 0 0 0-.803 0L7.317 10.19a1.725 1.725 0 0 1-2.407 0A1.647 1.647 0 0 1 4.88 7.86l.031-.031 4.747-4.655a.55.55 0 0 0 .011-.776l-.011-.01a.575.575 0 0 0-.803 0L4.108 7.042a2.743 2.743 0 0 0 0 3.933 2.876 2.876 0 0 0 4.011 0l4.747-4.655v.001Z" />
      </g>
    </g>
  </g>

  <!-- pulsing link from MCP to the first box it builds -->
  <line class="sai-link" x1="66" y1="68" x2="82" y2="40" />

  <!-- scenario graph the MCP assembles, then runs -->
  <path class="sai-edge sai-edge-l1" d="M112 40 H152" pathLength="100" />
  <path class="sai-edge sai-edge-l2" d="M167 52 V92" pathLength="100" />
  <path class="sai-edge sai-edge-l3" d="M152 104 H112" pathLength="100" />
  <g class="sai-bx-b1">
    <rect class="sai-box" x="82" y="28" width="30" height="24" rx="6" />
    <rect class="sai-blabel" x="88" y="35" width="16" height="3.5" rx="1.75" />
    <rect class="sai-blabel" x="88" y="42" width="10" height="3.5" rx="1.75" opacity="0.6" />
  </g>
  <g class="sai-bx-b2">
    <rect class="sai-box" x="152" y="28" width="30" height="24" rx="6" />
    <rect class="sai-blabel" x="158" y="35" width="16" height="3.5" rx="1.75" />
    <rect class="sai-blabel" x="158" y="42" width="10" height="3.5" rx="1.75" opacity="0.6" />
  </g>
  <g class="sai-bx-b3">
    <rect class="sai-box" x="152" y="92" width="30" height="24" rx="6" />
    <rect class="sai-blabel" x="158" y="99" width="16" height="3.5" rx="1.75" />
    <rect class="sai-blabel" x="158" y="106" width="10" height="3.5" rx="1.75" opacity="0.6" />
  </g>
  <g class="sai-bx-b4">
    <rect class="sai-box" x="82" y="92" width="30" height="24" rx="6" />
    <rect class="sai-blabel" x="88" y="99" width="16" height="3.5" rx="1.75" />
    <rect class="sai-blabel" x="88" y="106" width="10" height="3.5" rx="1.75" opacity="0.6" />
  </g>
  <rect class="sai-lit sai-lit-b1" x="82" y="28" width="30" height="24" rx="6" />
  <rect class="sai-lit sai-lit-b2" x="152" y="28" width="30" height="24" rx="6" />
  <rect class="sai-lit sai-lit-b3" x="152" y="92" width="30" height="24" rx="6" />
  <rect class="sai-lit sai-lit-b4" x="82" y="92" width="30" height="24" rx="6" />
  <path class="sai-lbeam sai-beam-l1" d="M112 40 H152" pathLength="100" />
  <path class="sai-lbeam sai-beam-l2" d="M167 52 V92" pathLength="100" />
  <path class="sai-lbeam sai-beam-l3" d="M152 104 H112" pathLength="100" />
</svg>
