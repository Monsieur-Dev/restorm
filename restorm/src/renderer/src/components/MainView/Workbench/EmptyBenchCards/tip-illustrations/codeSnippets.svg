<svg viewBox="0 0 220 150" xmlns="http://www.w3.org/2000/svg" class="empty-bench-tip-illustration" role="img" aria-hidden="true">
  <style>
    .cs-window {
      fill: #1e1e1e;
      stroke: currentColor;
      stroke-width: 1.4;
      stroke-linejoin: round;
    }
    .cs-tab-bar { fill: #2d2d30; }

    .cs-tab-label {
      font-family: 'SFMono-Regular', Menlo, Consolas, monospace;
      font-size: 9.5px;
      fill: #9da5b4;
      text-anchor: middle;
    }

    .cs-tab-underline { fill: #007acc; }
    .cs-tab-underline,
    .cs-lang {
      animation-duration: 12s;
      animation-iteration-count: infinite;
      animation-fill-mode: both;
      animation-play-state: paused;
      opacity: 0;
    }
    .cs-tab-underline--1, .cs-lang--1 { animation-name: cs-phase-1; }
    .cs-tab-underline--2, .cs-lang--2 { animation-name: cs-phase-2; }
    .cs-tab-underline--3, .cs-lang--3 { animation-name: cs-phase-3; }
    .cs-tab-underline--4, .cs-lang--4 { animation-name: cs-phase-4; }

    /* Each phase is 25% of the cycle (1.5 s). Lang N is visible
       between (N-1)*25% and N*25%, with a tiny fade between. */
    @keyframes cs-phase-1 {
      0%, 2%   { opacity: 0; }
      4%, 22%  { opacity: 1; }
      24%, 100% { opacity: 0; }
    }
    @keyframes cs-phase-2 {
      0%, 24%  { opacity: 0; }
      27%, 47% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }
    @keyframes cs-phase-3 {
      0%, 49%  { opacity: 0; }
      52%, 72% { opacity: 1; }
      74%, 100% { opacity: 0; }
    }
    @keyframes cs-phase-4 {
      0%, 74%  { opacity: 0; }
      77%, 97% { opacity: 1; }
      99%, 100% { opacity: 0; }
    }

    .cs-tok { stroke: none; }
    .cs-keyword  { fill: #569cd6; }
    .cs-type     { fill: #4ec9b0; }
    .cs-string   { fill: #ce9178; }
    .cs-ident    { fill: #d4d4d4; }
    .cs-function { fill: #dcdcaa; }
    .cs-number   { fill: #b5cea8; }
  </style>

  <!-- Window shell + tab strip background -->
  <rect class="cs-window" x="10" y="14" width="200" height="128" rx="8" />
  <path d="M 10 22 A 8 8 0 0 1 18 14 L 202 14 A 8 8 0 0 1 210 22 L 210 36 L 10 36 Z" class="cs-tab-bar" />

  <!-- Tab labels (always shown, language name does not change) -->
  <text class="cs-tab-label" x="35"  y="29">curl</text>
  <text class="cs-tab-label" x="85"  y="29">ts</text>
  <text class="cs-tab-label" x="135" y="29">ps</text>
  <text class="cs-tab-label" x="185" y="29">c#</text>

  <!-- Active-tab underline indicators (one per tab, opacity-animated) -->
  <rect class="cs-tab-underline cs-tab-underline--1" x="22"  y="33" width="26" height="2" rx="1" />
  <rect class="cs-tab-underline cs-tab-underline--2" x="72"  y="33" width="26" height="2" rx="1" />
  <rect class="cs-tab-underline cs-tab-underline--3" x="122" y="33" width="26" height="2" rx="1" />
  <rect class="cs-tab-underline cs-tab-underline--4" x="172" y="33" width="26" height="2" rx="1" />

  <!-- Code blocks (one per language, opacity-animated). Each line
       is a sequence of small colored rectangles standing in for
       syntax-highlighted tokens. -->

  <!-- curl -->
  <g class="cs-lang cs-lang--1">
    <rect class="cs-tok cs-keyword" x="22" y="50"  width="18" height="6" rx="1" />
    <rect class="cs-tok cs-ident"   x="44" y="50"  width="10" height="6" rx="1" />
    <rect class="cs-tok cs-keyword" x="58" y="50"  width="22" height="6" rx="1" />
    <rect class="cs-tok cs-string"  x="84" y="50"  width="110" height="6" rx="1" />

    <rect class="cs-tok cs-ident"   x="22" y="66"  width="10" height="6" rx="1" />
    <rect class="cs-tok cs-string"  x="36" y="66"  width="80" height="6" rx="1" />

    <rect class="cs-tok cs-ident"   x="22" y="82"  width="10" height="6" rx="1" />
    <rect class="cs-tok cs-string"  x="36" y="82"  width="120" height="6" rx="1" />

    <rect class="cs-tok cs-ident"   x="22" y="98"  width="10" height="6" rx="1" />
    <rect class="cs-tok cs-string"  x="36" y="98"  width="64" height="6" rx="1" />

    <rect class="cs-tok cs-comment" x="22" y="114" width="100" height="6" rx="1" />
  </g>

  <!-- ts -->
  <g class="cs-lang cs-lang--2">
    <rect class="cs-tok cs-keyword"  x="22" y="50"  width="24" height="6" rx="1" />
    <rect class="cs-tok cs-ident"    x="50" y="50"  width="38" height="6" rx="1" />
    <rect class="cs-tok cs-keyword"  x="92" y="50"  width="18" height="6" rx="1" />
    <rect class="cs-tok cs-string"   x="114" y="50" width="48" height="6" rx="1" />

    <rect class="cs-tok cs-keyword"  x="22" y="66"  width="20" height="6" rx="1" />
    <rect class="cs-tok cs-ident"    x="46" y="66"  width="22" height="6" rx="1" />
    <rect class="cs-tok cs-ident"    x="72" y="66"  width="6"  height="6" rx="1" />
    <rect class="cs-tok cs-keyword"  x="82" y="66"  width="22" height="6" rx="1" />
    <rect class="cs-tok cs-function" x="108" y="66" width="26" height="6" rx="1" />

    <rect class="cs-tok cs-ident"    x="34" y="82"  width="34" height="6" rx="1" />
    <rect class="cs-tok cs-string"   x="72" y="82"  width="62" height="6" rx="1" />

    <rect class="cs-tok cs-keyword"  x="22" y="98"  width="20" height="6" rx="1" />
    <rect class="cs-tok cs-ident"    x="46" y="98"  width="26" height="6" rx="1" />
    <rect class="cs-tok cs-ident"    x="76" y="98"  width="6"  height="6" rx="1" />
    <rect class="cs-tok cs-function" x="86" y="98"  width="34" height="6" rx="1" />

    <rect class="cs-tok cs-comment"  x="22" y="114" width="86" height="6" rx="1" />
  </g>

  <!-- ps -->
  <g class="cs-lang cs-lang--3">
    <rect class="cs-tok cs-function" x="22" y="50"  width="78" height="6" rx="1" />
    <rect class="cs-tok cs-ident"    x="104" y="50" width="34" height="6" rx="1" />
    <rect class="cs-tok cs-string"   x="142" y="50" width="20" height="6" rx="1" />

    <rect class="cs-tok cs-ident"    x="22" y="66"  width="20" height="6" rx="1" />
    <rect class="cs-tok cs-string"   x="46" y="66"  width="120" height="6" rx="1" />

    <rect class="cs-tok cs-ident"    x="22" y="82"  width="34" height="6" rx="1" />
    <rect class="cs-tok cs-keyword"  x="60" y="82"  width="18" height="6" rx="1" />
    <rect class="cs-tok cs-string"   x="82" y="82"  width="64" height="6" rx="1" />

    <rect class="cs-tok cs-ident"    x="22" y="98"  width="22" height="6" rx="1" />
    <rect class="cs-tok cs-string"   x="48" y="98"  width="96" height="6" rx="1" />

    <rect class="cs-tok cs-comment"  x="22" y="114" width="74" height="6" rx="1" />
  </g>

  <!-- c# -->
  <g class="cs-lang cs-lang--4">
    <rect class="cs-tok cs-keyword"  x="22" y="50"  width="16" height="6" rx="1" />
    <rect class="cs-tok cs-ident"    x="42" y="50"  width="26" height="6" rx="1" />
    <rect class="cs-tok cs-ident"    x="72" y="50"  width="6"  height="6" rx="1" />
    <rect class="cs-tok cs-keyword"  x="82" y="50"  width="16" height="6" rx="1" />
    <rect class="cs-tok cs-type"     x="102" y="50" width="54" height="6" rx="1" />

    <rect class="cs-tok cs-keyword"  x="22" y="66"  width="16" height="6" rx="1" />
    <rect class="cs-tok cs-ident"    x="42" y="66"  width="32" height="6" rx="1" />
    <rect class="cs-tok cs-ident"    x="78" y="66"  width="6"  height="6" rx="1" />
    <rect class="cs-tok cs-keyword"  x="88" y="66"  width="16" height="6" rx="1" />
    <rect class="cs-tok cs-type"     x="108" y="66" width="60" height="6" rx="1" />

    <rect class="cs-tok cs-keyword"  x="22" y="82"  width="16" height="6" rx="1" />
    <rect class="cs-tok cs-ident"    x="42" y="82"  width="32" height="6" rx="1" />
    <rect class="cs-tok cs-ident"    x="78" y="82"  width="6"  height="6" rx="1" />
    <rect class="cs-tok cs-keyword"  x="88" y="82"  width="22" height="6" rx="1" />
    <rect class="cs-tok cs-function" x="114" y="82" width="46" height="6" rx="1" />

    <rect class="cs-tok cs-function" x="22" y="98"  width="60" height="6" rx="1" />
    <rect class="cs-tok cs-string"   x="86" y="98"  width="70" height="6" rx="1" />

    <rect class="cs-tok cs-comment"  x="22" y="114" width="92" height="6" rx="1" />
  </g>
</svg>
