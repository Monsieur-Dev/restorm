# RabbitMQ broker configuration — for testing purposes only.
#
# The app's AMQP support is read-only v1 (no declare/delete of queues or
# exchanges — see the AMQP scope notes), so the E2E fixture's queue has to
# already exist before restorm connects. Rather than pre-seed it via a
# one-shot script (racy against the E2E run's own startup), load it as a
# management-plugin "definitions" import — applied once the broker is up,
# additive on top of the image's default vhost (`/`) and `guest`/`guest`
# user, so it doesn't need to redeclare either.
management.load_definitions = /etc/rabbitmq/definitions.json
