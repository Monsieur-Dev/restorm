# RabbitMQ broker configuration — for testing purposes only.
#
# The app's AMQP support is read-only v1 (no declare/delete of queues or
# exchanges — see the AMQP scope notes), so the E2E fixture's queue has to
# already exist before restorm connects. Rather than pre-seed it via a
# one-shot script (racy against the E2E run's own startup), load it as a
# management-plugin "definitions" import — applied once the broker is up.
#
# Importing a definitions file on first boot replaces RabbitMQ's own default
# bootstrap: the `/` vhost and the `guest`/`guest` user are normally seeded
# automatically, but that seeding is skipped whenever a definitions import is
# configured (RabbitMQ >= 3.9 refuses to assume the fixed default credentials
# once a user database is being imported). So `rabbitmq-definitions.json`
# declares the `/` vhost, the `guest` user (with a `guest` password hash) and
# its permissions explicitly, on top of the queue — none of it is redundant.
management.load_definitions = /etc/rabbitmq/definitions.json
