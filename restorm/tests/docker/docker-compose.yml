networks:
  default:
    name: restorm-tests
    external: true

services:
  # REST/HTTP - OpenAPI Petstore
  petstore:
    image: swaggerapi/petstore
    container_name: restorm-petstore
    ports:
      - "8080:8080"

  # REST/HTTP - OpenAPI 3.0 Petstore. Same endpoints as the 2.0 image
  # above but advertises a true 3.0 spec at `/openapi.json`. Used by
  # the OpenAPI 3.x importer integration tests to exercise URL-based
  # spec fetch + content-sniff routing. Listens on :8081 so it
  # coexists with the 2.0 mock on :8080.
  petstore-openapi3:
    image: openapitools/openapi-petstore
    container_name: restorm-petstore-openapi3
    ports:
      - "8081:8080"

  # GraphQL - Custom test server
  graphql:
    image: node:20-alpine
    container_name: restorm-graphql
    working_dir: /app
    volumes:
      - ./graphql-server:/app
    command: sh -c "npm install && node server.js"
    ports:
      - "4000:4000"

  # MQTT - Eclipse Mosquitto broker
  mqtt:
    image: eclipse-mosquitto:2
    container_name: restorm-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  # SOAP - Castle Mock server
  soap:
    image: castlemock/castlemock
    container_name: restorm-soap
    ports:
      - "8090:8080"

  # gRPC - gRPCbin echo server
  grpc:
    image: moul/grpcbin
    container_name: restorm-grpc
    ports:
      - "9000:9000"
      - "9002:9001"

  # Socket.IO - Custom test server
  socketio:
    image: node:20-alpine
    container_name: restorm-socketio
    working_dir: /app
    volumes:
      - ./socketio-server:/app
    command: sh -c "npm install && node server.js"
    ports:
      - "3001:3001"

  # Raw WebSocket - Custom `ws`-based echo server. Socket.IO runs its own
  # framing over raw WS, so a plain-WS client can't echo cleanly against it;
  # this dedicated server gives raw `ws://` text/binary echo, subprotocol +
  # header negotiation, ping/pong, and HTTP `/push` + `/close` trigger routes.
  ws-echo:
    image: node:20-alpine
    container_name: restorm-ws-echo
    working_dir: /app
    volumes:
      - ./ws-echo-server:/app
    command: sh -c "npm install && node server.js"
    ports:
      - "3002:3002"

  # Auth - Custom .NET 9 minimal-API service used by the `auth-login`
  # e2e suite. Publishes `/login` (POST), `/pet/{id}` (GET, Bearer-gated)
  # and a pet-only `/swagger.json`. Same multi-stage Dockerfile pattern
  # as odata-petstore — listens on :5110.
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: restorm-auth-service
    ports:
      - "5110:5110"
    healthcheck:
      # `wget` / `curl` aren't in the dotnet/aspnet:9.0-alpine runtime
      # image, so poll `/health` via /dev/tcp as we do for odata-petstore.
      test: ["CMD", "sh", "-c", "exec 3<>/dev/tcp/localhost/5110 && echo -e 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q 200 <&3"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # OData v4 - Custom Pet Store (AspNetCoreOData)
  # Multi-stage Dockerfile builds the .NET 9 service and serves it on :5100.
  # Provides Pets/Categories/Tags/Owners entity sets, a bound `AdoptPet`
  # action, an unbound `GetAvailablePets(category=…)` function, and full
  # $batch support — enough to exercise every acceptance item of OYO-180.
  odata-petstore:
    build:
      context: ./odata-petstore
      dockerfile: Dockerfile
    container_name: restorm-odata-petstore
    ports:
      - "5100:5100"
    healthcheck:
      # `wget` / `curl` aren't in the dotnet/aspnet:9.0-alpine runtime
      # image, so use the `dotnet` binary that ships with it to perform
      # a tiny HTTP probe. `pnpm docker:wait` also polls /health
      # externally, so the compose healthcheck is mostly informational.
      test: ["CMD", "sh", "-c", "exec 3<>/dev/tcp/localhost/5100 && echo -e 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q 200 <&3"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
