networks:
  default:
    name: restorm-tests
    external: true

services:
  # REST/HTTP - OpenAPI Petstore
  petstore:
    image: swaggerapi/petstore
    container_name: restorm-petstore
    ports:
      - "8080:8080"

  # REST/HTTP - OpenAPI 3.0 Petstore. Same endpoints as the 2.0 image
  # above but advertises a true 3.0 spec at `/openapi.json`. Used by
  # the OpenAPI 3.x importer integration tests to exercise URL-based
  # spec fetch + content-sniff routing. Listens on :8081 so it
  # coexists with the 2.0 mock on :8080.
  petstore-openapi3:
    image: openapitools/openapi-petstore
    container_name: restorm-petstore-openapi3
    ports:
      - "8081:8080"
    # Java 8 sizes its file-descriptor table to the nofile hard limit at
    # startup; a docker daemon handing out an unlimited/huge default makes
    # that allocation itself fail ("unable to allocate file descriptor
    # table - out of memory", SIGSEGV/SIGABRT before any log line). Cap it
    # to a sane value — same fix as the activemq mock below.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # HTTP utility mock - zero-dependency Node server used by the
  # `http-execution` E2E suite for the deterministic cases the Petstore
  # can't do: redirects, settable cookies, arbitrary status codes,
  # request echo, binary/XML/HTML responses, multi-value headers, a
  # slow route (cancellation/timeout). Pure `node:http`, no npm install,
  # so it boots the instant the container starts. Listens on :8082.
  http-util:
    image: node:20-alpine
    container_name: restorm-http-util
    working_dir: /app
    volumes:
      - ./http-util:/app
    command: node server.js
    ports:
      - "8082:8082"

  # OData v2 - tiny zero-dependency node:http mock (companion to the
  # .NET v4 odata-petstore below). Exercises the v2 `{ d: { results,
  # __count, __next } }` envelope, `$inlinecount=allpages`, the older
  # CSDL `$metadata`, server-driven paging, and a v2/JSON `$batch`.
  # Pure `node:http`, mounted like http-util — no npm install, boots
  # instantly. Listens on :5102 (5100 = v4 OData, 5110 = auth-service).
  odata-v2-petstore:
    image: node:20-alpine
    container_name: restorm-odata-v2-petstore
    working_dir: /app
    volumes:
      - ./odata-v2-petstore:/app
    command: node server.js
    ports:
      - "5102:5102"

  # JSON-RPC 2.0 - tiny zero-dependency node:http mock used by the
  # `jsonrpc-execution` E2E suite. Single POST endpoint (/rpc) dispatches on
  # `method`: echo/namedEcho (positional/named params), add (batch mix),
  # failMethod (error path). Pure `node:http`, mounted like http-util — no
  # npm install, boots instantly. Listens on :8095.
  jsonrpc:
    image: node:20-alpine
    container_name: restorm-jsonrpc
    working_dir: /app
    volumes:
      - ./jsonrpc-server:/app
    command: node server.js
    ports:
      - "8095:8095"

  # GraphQL - Custom test server
  graphql:
    image: node:20-alpine
    container_name: restorm-graphql
    working_dir: /app
    volumes:
      - ./graphql-server:/app
    command: sh -c "npm install && node server.js"
    ports:
      - "4000:4000"

  # tRPC - hand-rolled zero-dependency node:http mock (v10 non-batch wire
  # format). Mirrors the http-util / odata-v2-petstore precedent — no
  # `npm install`, boots instantly. Listens on :8096.
  trpc:
    image: node:20-alpine
    container_name: restorm-trpc
    working_dir: /app
    volumes:
      - ./trpc-server:/app
    command: node server.js
    ports:
      - "8096:8096"

  # MQTT - Eclipse Mosquitto broker
  mqtt:
    image: eclipse-mosquitto:2
    container_name: restorm-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      # Pre-hashed password file (restorm / restorm) for the auth scenarios.
      # Mosquitto 2 only accepts hashed passwords; regenerate with
      #   docker run --rm --entrypoint sh eclipse-mosquitto:2 \
      #     -c "mosquitto_passwd -b -c /tmp/pw restorm restorm && cat /tmp/pw"
      - ./mosquitto-passwd:/mosquitto/config/passwd:ro

  # AMQP - RabbitMQ (management plugin enabled for the aliveness-test probe
  # below + the web UI at :15672 for manual local inspection). The image
  # takes longer than mosquitto to become ready (broker + management HTTP
  # API both have to come up), hence the generous start_period.
  rabbitmq:
    image: rabbitmq:3-management
    container_name: restorm-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/10-restorm-e2e.conf:ro
      - ./rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # SOAP - Castle Mock server (kept for manual local testing via the web UI).
  # The E2E suite targets the soap-server mock below (:8091), which requires
  # no seeding and starts instantly — Castle Mock is NOT used by the tests.
  soap:
    image: castlemock/castlemock
    container_name: restorm-soap
    ports:
      - "8090:8080"

  # SOAP mock server — zero-dependency Node server used by the
  # `soap-execution` E2E suite. Dispatches on the SOAPAction header and
  # returns deterministic SOAP 1.1 envelopes: Echo (reflects input),
  # Calculator Add/Subtract/Multiply/Divide, Fault, Slow (cancellation),
  # Malformed (clean-error test). Pure `node:http`, no npm install, boots
  # the instant the container starts. Listens on :8091.
  soap-server:
    image: node:20-alpine
    container_name: restorm-soap-server
    working_dir: /app
    volumes:
      - ./soap-server:/app
    command: node server.js
    ports:
      - "8091:8091"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8091/health | grep -q ok"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  # SSE mock server — zero-dependency Node server used by the `sse-execution`
  # E2E suite. `/events` streams deterministic labelled frames (`event: ping`)
  # then holds the connection open on heartbeats; `/reconnect-test` exercises
  # `Last-Event-ID` reconnect by dropping the connection once. Pure
  # `node:http`, no npm install, boots the instant the container starts.
  # Listens on :8097.
  sse-server:
    image: node:20-alpine
    container_name: restorm-sse-server
    working_dir: /app
    volumes:
      - ./sse-server:/app
    command: node server.js
    ports:
      - "8097:8097"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8097/health | grep -q ok"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  # gRPC - gRPCbin echo server (native gRPC only, port 9000). Its second port
  # (9001, TLS-secured) is native gRPC too, NOT gRPC-Web — plain HTTP/1.1
  # there gets "Client sent an HTTP request to an HTTPS server". gRPC-Web has
  # its own dedicated mock below.
  grpc:
    image: moul/grpcbin
    container_name: restorm-grpc
    ports:
      - "9000:9000"

  # gRPC-Web mock - zero-dependency Node server used by the `grpc-execution`
  # E2E suite's gRPC-Web-transport scenario. gRPC-Web normally needs an
  # Envoy/grpc-web-proxy sidecar translating to a real gRPC backend — there's
  # no ready-made local image for that either, so this hand-rolled server
  # answers the same `grpcbin.GRPCBin/DummyUnary` RPC directly (see
  # `grpcweb-server/server.js`), same precedent as `connect-mock` below.
  # Listens on :9002 (the port the gRPC-Web transport scenario's sample
  # request already points at).
  grpcweb-mock:
    image: node:20-alpine
    container_name: restorm-grpcweb-mock
    working_dir: /app
    volumes:
      - ./grpcweb-server:/app
    command: node server.js
    ports:
      - "9002:9002"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:9002/health | grep -q ok"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Connect-RPC mock - zero-dependency Node server used by the
  # `grpc-execution` E2E suite's Connect-transport scenarios. There's no
  # ready-made local Connect-RPC image (`connectrpc/eliza` is a public demo,
  # not a container); this hand-rolled server answers the same
  # `grpcbin.GRPCBin` service/method names as the bundled fallback proto, so
  # a Connect request needs no custom `.proto`. Pure `node:http`, no npm
  # install, boots instantly. Listens on :8093.
  connect-mock:
    image: node:20-alpine
    container_name: restorm-connect-mock
    working_dir: /app
    volumes:
      - ./connect-server:/app
    command: node server.js
    ports:
      - "8093:8093"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8093/health | grep -q ok"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
  # STOMP - ActiveMQ (classic 5.x) broker used by the `stomp-execution` E2E
  # suite. `rmohr/activemq` ships a `stomp+ws` transport connector on :61614
  # out of the box (no custom `activemq.xml` needed) — unlike
  # `apache/activemq-artemis`, whose default config only exposes plain STOMP
  # (:61613) and needs an extra acceptor for STOMP-over-WebSocket, and whose
  # first-boot time is noticeably slower in CI. `rmohr/activemq` starts in a
  # few seconds, which is why it was picked over Artemis for this ticket.
  activemq:
    image: rmohr/activemq:5.15.9
    container_name: restorm-activemq
    ports:
      - "61614:61614"
    # Java 8 FD-table allocation vs unlimited nofile — see petstore-openapi3.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      # This image's /bin/sh is dash, which lacks the /dev/tcp pseudo-device;
      # bash (present in the image) is required for the socket probe below.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/61614 && echo -en 'GET / HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s

  # NOTE: there is intentionally no Socket.IO nor raw-WebSocket mock service.
  # restorm hosts its OWN Socket.IO + raw-WebSocket servers (a "server mode"
  # request) and connects to them as a client in the same instance, so the
  # Socket.IO / WebSocket E2E + scenarios self-connect — no external mock to
  # run or maintain.

  # Auth - Custom .NET 9 minimal-API service used by the `auth-login`
  # e2e suite. Publishes `/login` (POST), `/pet/{id}` (GET, Bearer-gated)
  # and a pet-only `/swagger.json`. Same multi-stage Dockerfile pattern
  # as odata-petstore — listens on :5110.
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: restorm-auth-service
    ports:
      - "5110:5110"
    healthcheck:
      # The dotnet/aspnet:9.0-alpine runtime ships busybox `wget`; probe
      # /health with it. Use 127.0.0.1, not `localhost`: the service binds
      # IPv4 0.0.0.0 only, while `localhost` may resolve to the unbound ::1.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5110/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # Redis - official image, default port (nothing else in this compose file
  # uses 6379). Covers pub/sub (SUBSCRIBE/PUBLISH) and common commands
  # (GET/SET/DEL/HGET/HSET/LPUSH/RPUSH/LRANGE/XADD/XREAD) out of the box — no
  # seed data needed.
  redis:
    image: redis:7-alpine
    container_name: restorm-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Git server — a minimal, unauthenticated `git daemon` over a bind-mounted
  # bare-repo directory. Zero-dependency, same house style as http-util /
  # soap-server (no gitea/heavy web app). Alpine splits git into sub-packages
  # — the base `git` apk does NOT include `git daemon` (it's a separate
  # `git-daemon` package, pulled in here) — so this needs a plain `alpine`
  # base + an `apk add`, not a git-only image. Auth-free is intentional — the
  # git client delegates authentication entirely to the system credential
  # helper (see docs/Git/README.md); this mock only needs to BE a real
  # remote git can push/pull/fetch against, not exercise credential UX.
  # Repos live under ./git-server/repos (bind-mounted), seeded host-side by
  # tests/integration/gitServerSeed.ts (git CLI on the host against the SAME
  # mounted path — no docker exec needed). Listens on :9418 (git://).
  git-server:
    image: alpine:3.19
    container_name: restorm-git-server
    # `safe.directory *`: the bind-mounted bares are created by the HOST
    # user; on native-Linux docker the container's root git refuses to serve
    # them ("dubious ownership" — Docker Desktop masks this by remapping
    # ownership through its VM, which is why local runs never hit it but CI
    # did). A throwaway localhost mock, so the blanket exception is fine.
    command: sh -c "until apk add --no-cache git-daemon; do sleep 2; done && git config --global --add safe.directory '*' && exec git daemon --base-path=/srv/git --export-all --enable=receive-pack --reuseaddr --informative-errors --verbose"
    ports:
      - "9418:9418"
    volumes:
      - ./git-server/repos:/srv/git
    healthcheck:
      # TCP-open, not a real `git ls-remote` — deliberately narrower than
      # the CI check in wait-for-services.js. Baking a bare repo INTO the
      # image so this healthcheck could `ls-remote` it in-container would be
      # nontrivial image plumbing for a race this repo's dev/CI hosts don't
      # actually hit locally: `docker compose up -d --wait` runs against a
      # warm Docker cache here, and the `apk add git-daemon` step (the
      # actual race window) has consistently finished well inside the 5s
      # start_period in practice — see gitServerSeed.ts's real clone/push
      # validation, which never raced this. CI's cold image pull on a fresh
      # runner is the scenario where TCP-open really can lie, which is why
      # that check is the stricter protocol-level one.
      test: ["CMD", "sh", "-c", "nc -z localhost 9418"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  # OData v4 - Custom Pet Store (AspNetCoreOData)
  # Multi-stage Dockerfile builds the .NET 9 service and serves it on :5100.
  # Provides Pets/Categories/Tags/Owners entity sets, a bound `AdoptPet`
  # action, an unbound `GetAvailablePets(category=…)` function, and full
  # $batch support — enough to exercise every acceptance item of OYO-180.
  odata-petstore:
    build:
      context: ./odata-petstore
      dockerfile: Dockerfile
    container_name: restorm-odata-petstore
    ports:
      - "5100:5100"
    healthcheck:
      # The dotnet/aspnet:9.0-alpine runtime ships busybox `wget`; probe
      # /health with it. Use 127.0.0.1, not `localhost`: the service binds
      # IPv4 0.0.0.0 only, while `localhost` may resolve to the unbound ::1.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5100/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # Kafka - single-node KRaft broker (no ZooKeeper — built-in KRaft mode is
  # simpler to run/CI than Confluent Platform + ZK for a throwaway dev
  # cluster). restorm connects from the HOST, so the sole PLAINTEXT listener
  # is advertised as `localhost` and published on the default Kafka port.
  kafka:
    image: apache/kafka:3.7.1
    container_name: restorm-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  # One-shot seed job: creates `restorm-test` (1 partition) with 3 messages
  # once the broker is healthy, then exits. See `kafka-seed.sh` to refresh
  # the fixture data.
  kafka-seed:
    image: apache/kafka:3.7.1
    container_name: restorm-kafka-seed
    depends_on:
      kafka:
        condition: service_healthy
    # `kafka`'s only listener is advertised as `localhost:9092` (it must be —
    # that's the address restorm on the HOST resolves to). A compose-network
    # client would bootstrap via the `kafka` service alias but then get
    # redirected to that same `localhost:9092` advertised address, which
    # inside its own container is a dead end. Host networking sidesteps the
    # mismatch entirely: `localhost:9092` here IS the published broker port,
    # identical to what restorm itself connects to.
    network_mode: host
    volumes:
      - ./kafka-seed.sh:/kafka-seed.sh:ro
    entrypoint: ["/bin/sh", "/kafka-seed.sh"]
    restart: "no"
