# Mosquitto MQTT Broker Configuration
# For testing purposes only.

# Listener for the MQTT protocol (mqtt:// / mqtts://).
listener 1883
protocol mqtt

# Listener for MQTT-over-WebSocket (ws:// / wss://).
listener 9001
protocol websockets

# Anonymous connections are allowed so the basic publish/subscribe matrix
# runs without credentials. A connection that DOES present a username is
# still checked against the password file below, so:
#   - no credentials           -> allowed (anonymous)
#   - valid restorm / restorm   -> allowed
#   - wrong username/password   -> rejected (auth-error path)
allow_anonymous true
password_file /mosquitto/config/passwd

# Logging
log_type all
log_dest stdout
