- message: 🔵 [<time>] ▶ GraphQL Server
- message: ⚪ [<time>] start graphqlListen
  data:
    connectionName: GraphQL Mock
    label: start GraphQL mock server
    requestId: <uuid>
- message: ⚪ [<time>] done graphqlListen
- message: ⚪ [<time>] graphql-server "GraphQL Mock" connecting
- message: ⚪ [<time>] graphql-server "GraphQL Mock" connected
- message: ⚪ [<time>] start httpRequest
  data:
    label: query the mock
    requestId: <uuid>
    in: true
- message: ⚪ [<time>] done httpRequest
  data:
    response:
      request:
        url: http://localhost:<port>/graphql
        method: POST
        headers:
          Content-Type: application/json
        body:
          type: text
          content: '{"query":"{ pets }"}'
      response:
        status: 200
        statusText: OK
        headers:
          content-type: application/json; charset=utf-8
          content-length: "36"
          date: <dynamic-time>
          connection: keep-alive
          keep-alive: timeout=5
        body: '{"data":{"pets":["Rex","Whiskers"]}}'
        durationMs: <dynamic-time>
        success: true
- message: ⚪ [<time>] start log
