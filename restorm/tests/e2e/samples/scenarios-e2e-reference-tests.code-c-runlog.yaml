- message: ⚪ [<time>] start code
  data:
    code: >-
      // `input` = wired value (list of records). LINQ aggregate.

      var rows = ((IEnumerable<object>)input).Cast<IDictionary<string,
      object>>().ToList();

      long total = rows.Sum(r => Convert.ToInt64(r["v"]));

      var names = rows.OrderBy(r => Convert.ToInt64(r["v"])).Select(r =>
      (string)r["n"]).ToList();

      Console.WriteLine($"csharp: total = {total} names = {string.Join(",",
      names)}");

      new Dictionary<string, object> { ["total"] = total, ["names"] = names }
    language: csharp
    value:
      - n: a
        v: 3
      - n: b
        v: 1
      - n: c
        v: 2
