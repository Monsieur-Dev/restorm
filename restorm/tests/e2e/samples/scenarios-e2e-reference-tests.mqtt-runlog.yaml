- message: 🔵 [<time>] ▶ MQTT
- message: ⚪ [<time>] start mqttConnect
  data:
    connectionName: Broker
    label: Broker listen
    requestId: <uuid>
- message: ⚪ [<time>] done mqttConnect
- message: ⚪ [<time>] mqtt "Broker" connecting
- message: ⚪ [<time>] mqtt "Broker" connected
- message: ⚪ [<time>] start mqttConnect
  data:
    connectionName: Chat
    label: MQTT Chat
    requestId: <uuid>
    in: true
- message: ⚪ [<time>] done mqttConnect
- message: ⚪ [<time>] mqtt "Chat" connecting
- message: ⚪ [<time>] mqtt "Chat" connected
- message: ⚪ [<time>] start mqttSend
  data:
    connectionNodeId: <uuid>
    payload: '{"hello":"from mqtt scenario"}'
    in: true
- message: ⚪ [<time>] done mqttSend
- message: ⚪ [<time>] start wait
  data:
    durationMs: <dynamic-time>
    in: true
- message: ⚪ [<time>] start log
  data:
    message: received
    data:
      hello: from mqtt scenario
- message: 🔵 [<time>] received
  data:
    hello: from mqtt scenario
- message: ⚪ [<time>] start output
  data:
    name: lastMessage
    value:
      hello: from mqtt scenario
- message: ⚪ [<time>] done log
  data:
    value:
      hello: from mqtt scenario
- message: ⚪ [<time>] done output
  data:
    output:lastMessage:
      hello: from mqtt scenario
- message: ⚪ [<time>] done wait
- message: ⚪ [<time>] start mqttClose
  data:
    connectionNodeId: <uuid>
    in: true
- message: ⚪ [<time>] done mqttClose
- message: ⚪ [<time>] start mqttClose
  data:
    connectionNodeId: <uuid>
    label: close Broker
    in: true
- message: ⚪ [<time>] mqtt "Broker" closed
- message: ⚪ [<time>] done mqttClose
- message: ⚪ [<time>] mqtt "Chat" closed
- message: 🔵 [<time>] ■ MQTT
