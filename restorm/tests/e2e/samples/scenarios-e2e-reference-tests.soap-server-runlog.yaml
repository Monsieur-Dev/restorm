- message: 🔵 [<time>] ▶ SOAP Server
- message: ⚪ [<time>] start soapListen
  data:
    connectionName: Mock Server
    label: start mock server
    requestId: <uuid>
- message: ⚪ [<time>] done soapListen
- message: ⚪ [<time>] soap-server "Mock Server" connecting
- message: ⚪ [<time>] soap-server "Mock Server" connected
- message: ⚪ [<time>] start soapRequest
  data:
    label: call the mock
    requestId: <uuid>
    in: true
- message: ⚪ [<time>] start soapClose
  data:
    connectionNodeId: <uuid>
    label: stop the mock server
    in:
      request:
        soapAction: urn:Add
        operation: urn:Add
        url: /calculator
        body: |-
          <?xml version="1.0" encoding="utf-8"?>
          <soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
            <soap:Body>
              <Add xmlns="urn:calculator">
                <a>4</a>
                <b>3</b>
              </Add>
            </soap:Body>
          </soap:Envelope>
      response:
        status: 200
        body: <?xml version="1.0" encoding="utf-8"?><soap:Envelope
          xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/"><soap:Body><AddResponse
          xmlns="urn:calculator"><result>7</result></AddResponse></soap:Body></soap:Envelope>
        fault: false
- message: ⚪ [<time>] soap-server "Mock Server" closed
- message: ⚪ [<time>] start log
  data:
    level: info
    message: serveur SOAP arrêté
    in: true
- message: 🔵 [<time>] serveur SOAP arrêté
- message: ⚪ [<time>] done log
  data: {}
- message: ⚪ [<time>] done soapClose
- message: ⚪ [<time>] done soapRequest
  data:
    response:
      request:
        url: http://localhost:<port>/calculator
        method: POST
        headers: {}
      response:
        status: 200
        statusText: ""
        headers:
          content-type: text/xml; charset=utf-8
          date: <dynamic-time>
          connection: keep-alive
          keep-alive: timeout=5
          transfer-encoding: chunked
        body: <?xml version="1.0" encoding="utf-8"?><soap:Envelope
          xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/"><soap:Body><AddResponse
          xmlns="urn:calculator"><result>7</result></AddResponse></soap:Body></soap:Envelope>
        durationMs: <dynamic-time>
        success: true
- message: ⚪ [<time>] start log
  data:
    level: info
    message: réponse du consumer reçue
    runOnEachEvent: false
    data:
      request:
        url: http://localhost:<port>/calculator
        method: POST
        headers: {}
      response:
        status: 200
        statusText: ""
        headers:
          content-type: text/xml; charset=utf-8
          date: <dynamic-time>
          connection: keep-alive
          keep-alive: timeout=5
          transfer-encoding: chunked
        body: <?xml version="1.0" encoding="utf-8"?><soap:Envelope
          xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/"><soap:Body><AddResponse
          xmlns="urn:calculator"><result>7</result></AddResponse></soap:Body></soap:Envelope>
        durationMs: <dynamic-time>
        success: true
- message: 🔵 [<time>] réponse du consumer reçue
  data:
    request:
      url: http://localhost:<port>/calculator
      method: POST
      headers: {}
    response:
      status: 200
      statusText: ""
      headers:
        content-type: text/xml; charset=utf-8
        date: <dynamic-time>
        connection: keep-alive
        keep-alive: timeout=5
        transfer-encoding: chunked
      body: <?xml version="1.0" encoding="utf-8"?><soap:Envelope
        xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/"><soap:Body><AddResponse
        xmlns="urn:calculator"><result>7</result></AddResponse></soap:Body></soap:Envelope>
      durationMs: <dynamic-time>
      success: true
- message: ⚪ [<time>] done log
  data:
    value:
      request:
        url: http://localhost:<port>/calculator
        method: POST
        headers: {}
      response:
        status: 200
        statusText: ""
        headers:
          content-type: text/xml; charset=utf-8
          date: <dynamic-time>
          connection: keep-alive
          keep-alive: timeout=5
          transfer-encoding: chunked
        body: <?xml version="1.0" encoding="utf-8"?><soap:Envelope
          xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/"><soap:Body><AddResponse
          xmlns="urn:calculator"><result>7</result></AddResponse></soap:Body></soap:Envelope>
        durationMs: <dynamic-time>
