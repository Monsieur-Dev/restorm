- message: ⚪ [<time>] start code
  data:
    language: python
    code: |-
      # Fixed dataset (no input → runs at start). print(...) → run log.
      data = [{"n": "a", "v": 3}, {"n": "b", "v": 1}, {"n": "c", "v": 2}]
      print("python: built", len(data), "rows")
      data
- message: "🔵 [<time>] python: built 3 rows"
