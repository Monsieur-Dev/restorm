      total: 6
      names:
        - b
        - c
        - a
- message: ⚪ [<time>] start code
  data:
    language: python
    code: |-
      # f-strings + dict access on the previous result.
      summary = f"{len(input['names'])} items summing to {input['total']}"
      print("python:", summary)
      {"lang": "python", "summary": summary, "total": input["total"]}
    value:
      total: 6
      names:
        - b
        - c
        - a
