- message: ⚪ [<time>] start code
  data:
    language: python
    code: |-
      # `input` = wired value (list of dicts). Aggregate + sort.
      total = sum(r["v"] for r in input)
      names = [r["n"] for r in sorted(input, key=lambda r: r["v"])]
      print("python: total =", total, "names =", ",".join(names))
      {"total": total, "names": names}
    value:
      - n: a
        v: 3
      - n: b
        v: 1
      - n: c
        v: 2
- message: "🔵 [<time>] python: total = 6 names = b,c,a"
- message: ⚪ [<time>] done code
