- message: 🔵 [<time>] ▶ Socket.IO
- message: ⚪ [<time>] start socketioConnect
  data:
    connectionName: Server
    label: Server listen
    requestId: <uuid>
- message: ⚪ [<time>] done socketioConnect
- message: ⚪ [<time>] socketio "Server" connecting
- message: ⚪ [<time>] socketio "Server" connected
- message: ⚪ [<time>] start socketioConnect
  data:
    connectionName: Echo
    label: Echo connect
    requestId: <uuid>
    in: true
- message: ⚪ [<time>] done socketioConnect
- message: ⚪ [<time>] socketio "Echo" connecting
- message: ⚪ [<time>] socketio "Echo" connected
- message: ⚪ [<time>] start socketioSend
  data:
    channel: echo
    connectionNodeId: <uuid>
    label: send to Echo
    payload: '{"hello":"world"}'
    in: true
- message: ⚪ [<time>] done socketioSend
- message: ⚪ [<time>] start wait
  data:
    durationMs: <dynamic-time>
    label: let the send echo arrive first
    in: true
- message: ⚪ [<time>] done wait
- message: ⚪ [<time>] start socketioSend
  data:
    channel: echo
    connectionNodeId: <uuid>
    label: broadcast from server
    payload: '{"hello":"from server"}'
    in: true
- message: ⚪ [<time>] done socketioSend
- message: ⚪ [<time>] start wait
  data:
    durationMs: <dynamic-time>
    label: let the pushed echo arrive
    in: true
- message: ⚪ [<time>] start log
  data:
    level: info
    message: echo reçu
    data:
      hello: from server
- message: 🔵 [<time>] echo reçu
  data:
    hello: from server
- message: ⚪ [<time>] done log
  data:
    value:
      hello: from server
- message: ⚪ [<time>] done wait
- message: ⚪ [<time>] start socketioClose
  data:
    connectionNodeId: <uuid>
    label: close Echo
    in: true
- message: ⚪ [<time>] socketio "Echo" closed
- message: ⚪ [<time>] start log
  data:
    level: info
    message: connexion Socket.IO fermée
    in: true
- message: 🔵 [<time>] connexion Socket.IO fermée
- message: ⚪ [<time>] done log
  data: {}
- message: ⚪ [<time>] done socketioClose
- message: ⚪ [<time>] start socketioServerClose
  data:
    connectionNodeId: <uuid>
    label: close Server
    in: true
- message: ⚪ [<time>] socketio "Server" closed
- message: ⚪ [<time>] done socketioServerClose
- message: 🔵 [<time>] ■ Socket.IO
