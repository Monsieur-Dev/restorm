- message: 🔵 [<time>] ▶ Socket.IO
- message: ⚪ [<time>] start socketioConnect
  data:
    requestId: <uuid>
    connectionName: Echo
    label: Echo connect
- message: ⚪ [<time>] done socketioConnect
- message: ⚪ [<time>] socketio "Echo" connecting
- message: ⚪ [<time>] socketio "Echo" connected
- message: ⚪ [<time>] start socketioSend
  data:
    connectionNodeId: <uuid>
    channel: echo
    payload: '{"hello":"world"}'
    label: send to Echo
    in: true
- message: ⚪ [<time>] done socketioSend
- message: ⚪ [<time>] start wait
  data:
    durationMs: <dynamic-time>
    label: let the send echo arrive first
    in: true
- message: ⚪ [<time>] start log
  data:
    message: echo reçu
    level: info
    data:
      hello: world
- message: 🔵 [<time>] echo reçu
  data:
    hello: world
- message: ⚪ [<time>] done log
  data:
    value:
      hello: world
- message: ⚪ [<time>] done wait
- message: ⚪ [<time>] start httpRequest
  data:
    requestId: <uuid>
    label: Push to echo (HTTP)
    in: true
- message: ⚪ [<time>] start log
  data:
    message: echo reçu
    level: info
    data:
      hello: from HTTP
- message: 🔵 [<time>] echo reçu
  data:
    hello: from HTTP
- message: ⚪ [<time>] done log
  data:
    value:
      hello: from HTTP
- message: ⚪ [<time>] done httpRequest
  data:
    response:
      request:
        url: http://localhost:3001/emit?event=echo&data=%7B%22hello%22%3A%22from%20HTTP%22%7D
        method: GET
        headers: {}
      response:
        status: 200
        statusText: OK
        headers:
          content-type: application/json
          date: <dynamic-time>
          connection: keep-alive
          keep-alive: timeout=5
          transfer-encoding: chunked
        body: '{"ok":true,"emitted":{"ns":"/","event":"echo","data":{"hello":"from
          HTTP"}}}'
        durationMs: <dynamic-time>
        success: true
- message: ⚪ [<time>] start wait
  data:
    durationMs: <dynamic-time>
    label: let the pushed echo arrive
    in:
      request:
        url: http://localhost:3001/emit?event=echo&data=%7B%22hello%22%3A%22from%20HTTP%22%7D
        method: GET
        headers: {}
      response:
        status: 200
        statusText: OK
        headers:
          content-type: application/json
          date: <dynamic-time>
          connection: keep-alive
          keep-alive: timeout=5
          transfer-encoding: chunked
        body: '{"ok":true,"emitted":{"ns":"/","event":"echo","data":{"hello":"from
          HTTP"}}}'
        durationMs: <dynamic-time>
        success: true
- message: ⚪ [<time>] done wait
- message: ⚪ [<time>] start socketioClose
  data:
    connectionNodeId: <uuid>
    label: close Echo
    in: true
- message: ⚪ [<time>] socketio "Echo" closed
- message: ⚪ [<time>] start log
  data:
    message: connexion Socket.IO fermée
    level: info
    in: true
- message: 🔵 [<time>] connexion Socket.IO fermée
- message: ⚪ [<time>] done log
  data: {}
- message: ⚪ [<time>] done socketioClose
- message: 🔵 [<time>] ■ Socket.IO
