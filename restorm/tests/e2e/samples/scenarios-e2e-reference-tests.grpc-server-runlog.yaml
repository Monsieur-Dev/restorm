- message: 🔵 [<time>] ▶ gRPC Server
- message: ⚪ [<time>] start grpcListen
  data:
    connectionName: gRPC Mock
    label: start gRPC mock
    requestId: <uuid>
- message: ⚪ [<time>] done grpcListen
- message: ⚪ [<time>] grpc-server "gRPC Mock" connecting
- message: ⚪ [<time>] grpc-server "gRPC Mock" connected
- message: ⚪ [<time>] start httpRequest
  data:
    label: call the gRPC mock
    requestId: <uuid>
    in: true
- message: ⚪ [<time>] done httpRequest
  data:
    response:
      request:
        url: localhost:<port>
        method: mock.Greeter/SayHello
        headers: {}
      response:
        status: 0
        statusText: OK
        headers: {}
        body: '{"message":"hello from the restorm mock"}'
        durationMs: <dynamic-time>
        success: true
- message: ⚪ [<time>] start log
  data:
    level: info
    message: réponse du consumer gRPC reçue
    runOnEachEvent: false
    data:
      request:
        url: localhost:<port>
        method: mock.Greeter/SayHello
        headers: {}
      response:
        status: 0
        statusText: OK
        headers: {}
        body: '{"message":"hello from the restorm mock"}'
        durationMs: <dynamic-time>
        success: true
- message: 🔵 [<time>] réponse du consumer gRPC reçue
  data:
    request:
      url: localhost:<port>
      method: mock.Greeter/SayHello
      headers: {}
    response:
      status: 0
      statusText: OK
      headers: {}
      body: '{"message":"hello from the restorm mock"}'
      durationMs: <dynamic-time>
      success: true
- message: ⚪ [<time>] done log
  data:
    value:
      request:
        url: localhost:<port>
        method: mock.Greeter/SayHello
        headers: {}
      response:
        status: 0
        statusText: OK
        headers: {}
        body: '{"message":"hello from the restorm mock"}'
        durationMs: <dynamic-time>
        success: true
- message: ⚪ [<time>] start grpcServerClose
  data:
    connectionNodeId: <uuid>
    label: stop the gRPC mock server
    in: true
- message: ⚪ [<time>] done grpcServerClose
- message: ⚪ [<time>] grpc-server "gRPC Mock" closed
- message: ⚪ [<time>] start log
  data:
    level: info
    message: serveur gRPC arrêté
    in: true
- message: 🔵 [<time>] serveur gRPC arrêté
- message: ⚪ [<time>] done log
  data: {}
- message: 🔵 [<time>] ■ gRPC Server
