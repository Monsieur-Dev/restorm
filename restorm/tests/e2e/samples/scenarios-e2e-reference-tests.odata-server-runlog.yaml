- message: 🔵 [<time>] ▶ OData Server
- message: ⚪ [<time>] start odataListen
  data:
    requestId: <uuid>
    connectionName: OData Mock
    label: start OData mock
- message: ⚪ [<time>] done odataListen
- message: ⚪ [<time>] odata-server "OData Mock" connecting
- message: ⚪ [<time>] odata-server "OData Mock" connected
- message: ⚪ [<time>] start httpRequest
  data:
    requestId: <uuid>
    label: call the OData mock
    in: true
- message: ⚪ [<time>] start odataClose
  data:
    connectionNodeId: <uuid>
    label: stop the OData mock
    in:
      request:
        method: GET
        url: /odata/Pets
        headers:
          host: localhost:8078
          connection: keep-alive
      response:
        status: 200
        headers:
          Content-Type: application/json; odata.metadata=minimal
          OData-Version: "4.0"
        body: '{"@odata.context":"/odata/$metadata#Pets","value":[{"Id":1,"Name":"Rex"},{"Id":2,"Name":"Whiskers"}]}'
- message: ⚪ [<time>] odata-server "OData Mock" closed
- message: ⚪ [<time>] start log
  data:
    message: service OData arrêté
    level: info
    in: true
- message: 🔵 [<time>] service OData arrêté
- message: ⚪ [<time>] done log
  data: {}
- message: ⚪ [<time>] done odataClose
- message: ⚪ [<time>] done httpRequest
  data:
    response:
      request:
        url: http://localhost:8078/odata/Pets
        method: GET
        headers: {}
      response:
        status: 200
        statusText: OK
        headers:
          content-type: application/json; odata.metadata=minimal
          odata-version: "4.0"
          date: <dynamic-time>
          connection: keep-alive
          keep-alive: timeout=5
          transfer-encoding: chunked
        body: '{"@odata.context":"/odata/$metadata#Pets","value":[{"Id":1,"Name":"Rex"},{"Id":2,"Name":"Whiskers"}]}'
        durationMs: <dynamic-time>
        success: true
