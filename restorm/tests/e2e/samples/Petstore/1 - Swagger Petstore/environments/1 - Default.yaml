name: Default
variables:
  - key: port
    value:
      type: string
      value: '8080'
    description: ''
    enabled: true
  - key: scheme
    value:
      type: string
      value: http
    description: ''
    enabled: true
  - key: domain
    value:
      type: string
      value: localhost
    description: ''
    enabled: true
  - key: baseUrl
    value:
      type: string
      value: '{{scheme}}://{{domain}}:{{port}}'
    description: ''
    enabled: true
subEnvironments:
  - name: Production
    variables:
      - key: scheme
        value:
          type: string
          value: https
        description: ''
      - key: domain
        value:
          type: string
          value: petstore.com
        description: ''
      - key: baseUrl
        value:
          type: string
          value: '{{scheme}}://{{domain}}:{{port}}'
        description: ''
