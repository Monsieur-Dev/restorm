folderType: environment
name: Swagger Petstore
documentation: |-
  # Swagger Petstore

  This is a sample server Petstore server.  You can find out more about Swagger at [http://swagger.io](http://swagger.io) or on [irc.freenode.net, #swagger](http://swagger.io/irc/).  For this sample, you can use the api key &#x60;special-key&#x60; to test the authorization filters.

  **Version:** 1.0.7

  **Terms of Service:** [http://swagger.io/terms/](http://swagger.io/terms/)

  ## Contact

  - **Email:** [apiteam@swagger.io](mailto:apiteam@swagger.io)

  ## License

  [Apache 2.0](http://www.apache.org/licenses/LICENSE-2.0.html)

  ## External Documentation

  [Find out more about Swagger](http://swagger.io)

  **Host:** `localhost:8080`

  **Base Path:** `/api`

  **Schemes:** `https`, `http`

  ## Models

  ```mermaid
  classDiagram
    class Category {
      - id? : integer
      - name? : string
    }
    class Pet {
      - id? : integer
      - category? : Category
      + name : string
      + photoUrls : array<string>
      - tags? : array<Tag>
      - status? : string
    }
    class Tag {
      - id? : integer
      - name? : string
    }
    class ApiResponse {
      - code? : integer
      - type? : string
      - message? : string
    }
    class Order {
      - id? : integer
      - petId? : integer
      - quantity? : integer
      - shipDate? : string
      - status? : string
      - complete? : boolean
    }
    class User {
      - id? : integer
      - username? : string
      - firstName? : string
      - lastName? : string
      - email? : string
      - password? : string
      - phone? : string
      - userStatus? : integer
    }
    Pet --> Category
    Pet --> Tag
  ```
