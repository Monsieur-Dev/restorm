- message: ⚪ [<time>] start code
  data:
    code: >-
      // cheerio — jQuery-style HTML/XML scraping (server-side).

      const $ = cheerio.load('<ul><li
      class="first">one</li><li>two</li><li>three</li></ul>')

      const items = $('li').map((i, el) => $(el).text()).get()

      console.log('cheerio items =', items.join(','))

      return { library: 'cheerio', items, first: $('.first').text(), count:
      items.length }
    in: true
