  data:
    code: |-
      // `input` = wired value. Curated stdlib (lodash) available as globals.
      const total = _.sumBy(input, 'v')
      const names = _.map(_.sortBy(input, 'v'), 'n')
      console.log('javascript: total =', total, 'names =', names.join(','))
      return { total, names }
    language: javascript
