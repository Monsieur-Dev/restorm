- message: 🔵 [<time>] ▶ WebSocket
- message: ⚪ [<time>] start websocketConnect
  data:
    requestId: <uuid>
    connectionName: Echo
    label: Echo connect
- message: ⚪ [<time>] done websocketConnect
- message: ⚪ [<time>] websocket "Echo" connecting
- message: ⚪ [<time>] websocket "Echo" connected
- message: ⚪ [<time>] start websocketSend
  data:
    connectionNodeId: <uuid>
    payload: '{"hello":"world"}'
    label: send to Echo
    in: true
- message: ⚪ [<time>] done websocketSend
- message: ⚪ [<time>] start wait
  data:
    durationMs: <dynamic-time>
    label: let the send echo arrive first
    in: true
- message: ⚪ [<time>] start log
  data:
    message: message reçu
    level: info
    data:
      hello: world
- message: 🔵 [<time>] message reçu
  data:
    hello: world
- message: ⚪ [<time>] done log
  data:
    value:
      hello: world
- message: ⚪ [<time>] done wait
- message: ⚪ [<time>] start httpRequest
  data:
    requestId: <uuid>
    label: Push to WS echo (HTTP)
    in: true
- message: ⚪ [<time>] start log
  data:
    message: message reçu
    level: info
    data:
      hello: from HTTP
- message: 🔵 [<time>] message reçu
  data:
    hello: from HTTP
- message: ⚪ [<time>] done log
  data:
    value:
      hello: from HTTP
- message: ⚪ [<time>] done httpRequest
  data:
    response:
      request:
        url: http://localhost:3002/push?data=%7B%22hello%22%3A%22from%20HTTP%22%7D
        method: GET
        headers: {}
      response:
        status: 200
        statusText: OK
        headers:
          content-type: application/json
          date: <dynamic-time>
          connection: keep-alive
          keep-alive: timeout=5
          transfer-encoding: chunked
        body: '{"ok":true,"pushed":"{\"hello\":\"from HTTP\"}","clients":1}'
        durationMs: <dynamic-time>
        success: true
- message: ⚪ [<time>] start wait
  data:
    durationMs: <dynamic-time>
    label: let the pushed echo arrive
    in:
      request:
        url: http://localhost:3002/push?data=%7B%22hello%22%3A%22from%20HTTP%22%7D
        method: GET
        headers: {}
      response:
        status: 200
        statusText: OK
        headers:
          content-type: application/json
          date: <dynamic-time>
          connection: keep-alive
          keep-alive: timeout=5
          transfer-encoding: chunked
        body: '{"ok":true,"pushed":"{\"hello\":\"from HTTP\"}","clients":1}'
        durationMs: <dynamic-time>
        success: true
- message: ⚪ [<time>] done wait
- message: ⚪ [<time>] start websocketClose
  data:
    connectionNodeId: <uuid>
    label: close Echo
    in: true
- message: ⚪ [<time>] done websocketClose
- message: ⚪ [<time>] websocket "Echo" closed
- message: ⚪ [<time>] start log
  data:
    message: connexion WebSocket fermée
    level: info
    in: true
- message: 🔵 [<time>] connexion WebSocket fermée
- message: ⚪ [<time>] done log
  data: {}
- message: 🔵 [<time>] ■ WebSocket
