# GraphQL Schema - Docker Test Server (port 4000)
# Matches: restorm/tests/docker/graphql-server/server.js

type User {
  id: ID!
  name: String!
  email: String!
  posts: [Post!]!
}

type Post {
  id: ID!
  title: String!
  content: String!
  author: User!
}

type Query {
  """Get all users"""
  users: [User!]!
  
  """Get a user by ID"""
  user(id: ID!): User
  
  """Get all posts"""
  posts: [Post!]!
  
  """Get a post by ID"""
  post(id: ID!): Post
  
  """Echo a message back"""
  echo(message: String!): String!
}

type Mutation {
  """Create a new user"""
  createUser(name: String!, email: String!): User!
  
  """Create a new post"""
  createPost(title: String!, content: String!, authorId: ID!): Post!
  
  """Delete a user by ID"""
  deleteUser(id: ID!): Boolean!
  
  """Delete a post by ID"""
  deletePost(id: ID!): Boolean!
}

type Subscription {
  """Subscribe to new posts"""
  postCreated: Post!
}
