// gRPC Schema - Docker Test Server (moul/grpcbin)
// Ports: 9000 (gRPC), 9002 (gRPC-Web)
// Documentation: https://github.com/moul/grpcbin

syntax = "proto3";

package grpcbin;

// Hello service - simple greeting
service HelloService {
  // Say hello
  rpc SayHello(HelloRequest) returns (HelloResponse);
}

message HelloRequest {
  string greeting = 1;
}

message HelloResponse {
  string reply = 1;
}

// Headers service - echo headers
service HeadersService {
  // Returns request headers
  rpc GetHeaders(EmptyMessage) returns (HeadersResponse);
}

message EmptyMessage {}

message HeadersResponse {
  map<string, string> headers = 1;
}

// Index service - list available services
service IndexService {
  // Get server index
  rpc GetIndex(EmptyMessage) returns (IndexResponse);
}

message IndexResponse {
  repeated string services = 1;
}

// DummyMessage service - generate dummy messages
service DummyService {
  // Unary call
  rpc DummyUnary(DummyMessage) returns (DummyMessage);
  
  // Server streaming
  rpc DummyServerStream(DummyMessage) returns (stream DummyMessage);
  
  // Client streaming
  rpc DummyClientStream(stream DummyMessage) returns (DummyMessage);
  
  // Bidirectional streaming
  rpc DummyBidirectionalStream(stream DummyMessage) returns (stream DummyMessage);
}

message DummyMessage {
  string f_string = 1;
  repeated string f_strings = 2;
  int32 f_int32 = 3;
  repeated int32 f_int32s = 4;
  enum Enum {
    ENUM_0 = 0;
    ENUM_1 = 1;
    ENUM_2 = 2;
  }
  Enum f_enum = 5;
  repeated Enum f_enums = 6;
  SubMessage f_sub = 7;
  repeated SubMessage f_subs = 8;
  bool f_bool = 9;
  repeated bool f_bools = 10;
  int64 f_int64 = 11;
  repeated int64 f_int64s = 12;
  bytes f_bytes = 13;
  repeated bytes f_bytess = 14;
  float f_float = 15;
  repeated float f_floats = 16;
}

message SubMessage {
  string f_string = 1;
}

// SpecificError service - return specific error codes
service SpecificErrorService {
  // Return a specific gRPC error code
  rpc SpecificError(SpecificErrorRequest) returns (EmptyMessage);
}

message SpecificErrorRequest {
  int32 code = 1; // gRPC error code (0-16)
}

// AddrService - return client address
service AddrService {
  // Get client IP address
  rpc GetClientAddr(EmptyMessage) returns (AddrResponse);
}

message AddrResponse {
  string addr = 1;
}
