groups:
  - id: "behavior"
    titleKey: "behavior.title"
    items:
      - setting:
          id: "dateTimeFormat"
          titleKey: "behavior.dateTimeFormat"
          descriptionKey: "behavior.dateTimeFormatDescription"
          type: "enum"
          default: "us"
          params:
            values:
              - value: "us"
                labelKey: "behavior.dateTimeFormat.us"
              - value: "iso"
                labelKey: "behavior.dateTimeFormat.iso"
      - setting:
          id: "syncSidebarWithTabs"
          titleKey: "behavior.syncSidebarWithTabs"
          descriptionKey: "behavior.syncSidebarWithTabsDescription"
          type: "toggle"
          default: true
  - id: "console"
    titleKey: "console.title"
    items:
      - setting:
          id: "requestFormat"
          titleKey: "console.requestFormat"
          descriptionKey: "console.requestFormatDescription"
          type: "enum"
          default: "curl"
          params:
            values:
              - value: "curl"
                labelKey: "console.requestFormat.curl"
              - value: "powershell"
                labelKey: "console.requestFormat.powershell"
  - id: "mcp"
    titleKey: "mcp.title"
    items:
      - setting:
          id: "enabled"
          titleKey: "mcp.enabled"
          descriptionKey: "mcp.enabledDescription"
          type: "toggle"
          default: true
      - setting:
          id: "logsRetentionCap"
          titleKey: "mcp.logsRetentionCap"
          descriptionKey: "mcp.logsRetentionCapDescription"
          type: "number"
          default: 100
          params:
            min: 0
            max: 10000
            integer: true
      - setting:
          id: "captureRetentionCap"
          titleKey: "mcp.captureRetentionCap"
          descriptionKey: "mcp.captureRetentionCapDescription"
          type: "number"
          default: 20
          params:
            min: 0
            max: 10000
            integer: true
  - id: "git"
    titleKey: "git.settingsTitle"
    items:
      - setting:
          id: "applyCommitMessageLanguageByDefault"
          titleKey: "git.applyCommitMessageLanguageByDefaultTitle"
          descriptionKey: "git.applyCommitMessageLanguageByDefaultDescription"
          type: "toggle"
          default: true
          capability: "git.client"
      - setting:
          id: "semiPullFrequency"
          titleKey: "git.semiPullFrequencyTitle"
          descriptionKey: "git.semiPullFrequencyDescription"
          type: "enum"
          default: "1h"
          capability: "git.client"
          params:
            values:
              - value: "off"
                labelKey: "git.semiPullFrequency.off"
              - value: "15m"
                labelKey: "git.semiPullFrequency.15m"
              - value: "30m"
                labelKey: "git.semiPullFrequency.30m"
              - value: "1h"
                labelKey: "git.semiPullFrequency.1h"
              - value: "4h"
                labelKey: "git.semiPullFrequency.4h"
              - value: "12h"
                labelKey: "git.semiPullFrequency.12h"
              - value: "24h"
                labelKey: "git.semiPullFrequency.24h"
  - id: "updates"
    titleKey: "updates.settingsTitle"
    items:
      - setting:
          id: "autoCheckEnabled"
          titleKey: "updates.autoCheckTitle"
          descriptionKey: "updates.autoCheckDescription"
          type: "toggle"
          default: true
      - setting:
          id: "status"
          titleKey: "updates.statusTitle"
          descriptionKey: "updates.statusDescription"
          type: "update-actions"
          default: ""
  - id: "privacy"
    titleKey: "privacy.settingsTitle"
    items:
      # Crash reports are plan-modulated, which is why this toggle defaults ON
      # while telemetry defaults OFF. Community accounts fund the product with
      # the diagnostics that make it possible to fix what breaks for them, so
      # the capability below locks the control (visible, greyed, with the
      # upsell); Pro and Enterprise unlock it and can opt out. The main-process
      # ConsentService applies the same rule to `canSend('crash')`, so a locked
      # control can never disagree with what is actually sent.
      - setting:
          id: "crashReports"
          titleKey: "privacy.crashReportsTitle"
          descriptionKey: "privacy.crashReportsDescription"
          type: "toggle"
          default: true
          capability: "crash.optOut"
          # Community sees the control locked ON because that is what the main
          # process actually enforces. Without this the row would render the
          # stored boolean — so an ex-Pro user who had opted out and then
          # downgraded would see a greyed OFF toggle while reports were being
          # sent. Their stored `false` is preserved and takes effect again the
          # moment they resubscribe.
          capabilityLockedValue: true
          # The generic lock tooltip is an upsell ("Pro version / Subscribe"),
          # which reads wrong here: this is not a feature held back for sale, it
          # is an explanation of why the free tier cannot switch it off. Name the
          # reason instead.
          capabilityLockedLabelKey: "privacy.crashReportsLockedLabel"
      - setting:
          id: "telemetry"
          titleKey: "privacy.telemetryTitle"
          descriptionKey: "privacy.telemetryDescription"
          type: "toggle"
          default: false
