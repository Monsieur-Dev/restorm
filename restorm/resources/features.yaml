# Restorm Feature Flags Configuration
# This file defines the feature flags available in the application
# 
# Each feature can have multiple strategies that must ALL return true
# for the feature to be enabled (AND logic).

Features:
  # Test feature - always enabled
  - Name: "test"
    Strategies:
      - Type: Basic
        Enabled: true

  # Handlebars helpers - extended helpers for variable transformation
  - Name: "handlebars-helpers"
    Strategies:
      - Type: Basic
        Enabled: true

  # Navigation back/forward and Ctrl+Tab tab switching
  - Name: "navigation"
    Strategies:
      - Type: Basic
        Enabled: true

  # Workbench tab-detach: drag a tab outside the window to spawn a
  # new BrowserWindow holding that tab. The pathway is partially
  # implemented and ships behaviour that's clearly not ready yet
  # (a separate fix ticket tracks the remaining work). Default OFF —
  # invisible to end users in production builds. Engineers working
  # on the fix flip this on locally to reproduce the buggy state.
  - Name: "workbench.tabDetach"
    Strategies:
      - Type: Basic
        Enabled: false

  # Scenario step-debugger: pause-at-breakpoint, step-over, inspect node
  # output mid-run. Pro-only capability — requires the `scenario.stepDebug`
  # entitlement from the backend. Community users see the control but it is
  # disabled (upsell CTA). The `Entitlement` strategy type is evaluated live
  # against the current AuthState by the registered entitlementEvaluator.
  - Name: "scenario.stepDebug"
    Strategies:
      - Type: Entitlement
        RequiredCapabilities:
          - scenario.stepDebug

  # Advanced MCP tools (schema introspection, live request manipulation,
  # etc.). The MCP server itself is free; only the Pro tool set is gated.
  # Mirrors the `mcp.pro` capability minted by the backend into `pro` +
  # `enterprise` entitlement tokens. Used by `mcpProGate.ts` via direct
  # closure (unchanged); this YAML entry lets `useFeature('mcp.pro')` work
  # as an alternative renderer-side gate.
  - Name: "mcp.pro"
    Strategies:
      - Type: Entitlement
        RequiredCapabilities:
          - mcp.pro
