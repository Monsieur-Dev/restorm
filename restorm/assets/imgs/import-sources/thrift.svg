<!--
  Custom glyph — Apache Thrift's actual official mark (Wikimedia
  Commons) is a 697x102 horizontal wordmark that doesn't fit this
  component's square logo slot, and the ASF still flags it as
  trademarked material outside its own sanctioned use. This draws a
  centered three-layer stack instead, echoing Thrift's own
  transport/protocol/processor layering.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M7 3H17V7H7Z M4 9H20V13H4Z M1 15H23V19H1Z"/></svg>
